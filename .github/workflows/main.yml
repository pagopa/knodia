name: Main CI

on:
  push:
    branches:
      - main

jobs:
  typecheck:
    name: Turbo typecheck
    uses: ./.github/workflows/pnpm-job.yml
    with:
      command: typecheck

  lint:
    name: Turbo lint
    uses: ./.github/workflows/pnpm-job.yml
    with:
      command: lint

  knip:
    name: Knip
    uses: ./.github/workflows/pnpm-job.yml
    with:
      command: knip
      # not a turbo command, no need to limit to affected packages

  generate-openapi:
    name: Generate OpenAPI
    uses: ./.github/workflows/pnpm-job.yml
    with:
      command: generate-openapi
      fail_on_git_diff: true
