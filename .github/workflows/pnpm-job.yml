name: PNPM Job

on:
  workflow_call:
    inputs:
      command:
        description: pnpm script to run
        required: true
        type: string
      fail_on_git_diff:
        description: Fail if the command changes tracked files
        required: false
        type: boolean
        default: false

jobs:
  run:
    name: ${{ inputs.command }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Turbo --affected needs full history; blob filter keeps history without file contents.
          # https://turborepo.com/docs/reference/run#options
          fetch-depth: 0
          filter: blob:none

      - name: Fetch base branch for PRs
        if: ${{ github.event_name == 'pull_request' }}
        run: git fetch origin "${{ github.base_ref }}:${{ github.base_ref }}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # Avoid double install; we run pnpm install after cache setup.
          run_install: false

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm ${{ inputs.command }}
        run: pnpm ${{ inputs.command }}

      - name: Fail if git diff is not empty
        if: ${{ inputs.fail_on_git_diff }}
        run: git diff --exit-code
