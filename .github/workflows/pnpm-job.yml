name: CI Job

on:
  workflow_call:
    inputs:
      command:
        description: pnpm script to run
        required: true
        type: string
      fail_on_git_diff:
        description: Fail if the command changes tracked files
        required: false
        type: boolean
        default: false

jobs:
  run:
    name: ${{ inputs.command }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm command
        run: pnpm ${{ inputs.command }}

      - name: Fail if git diff is not empty
        if: ${{ inputs.fail_on_git_diff }}
        run: git diff --exit-code
