name: "Build & Push"

on:
  push:
    branches:
      - "main"
    tags:
      - "*"
    paths:
      - "apps/**"
      - "collections/**"
      - "migrations/**"
      - "packages/**"
      - ".github/workflows/build-push.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  find_dockerfiles:
    name: Find Dockerfiles
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.set_packages_output.outputs.packages }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Find packages
        id: set_packages_output
        run: |
          set -euo pipefail

          DOCKERFILES=$(find apps -maxdepth 3 -mindepth 3 -type f -name "Dockerfile" | sort -u)

          if [ -z "$DOCKERFILES" ]; then
            echo "::error::No Dockerfiles found"
            exit 1
          fi

          PACKAGES=$(echo "$DOCKERFILES" | jq -R -s -c '
            split("\n") | map(select(. != "")) | map(. | split("/") | {
              name: .[-2],
              section: .[-3],
              path: (.[:-1] | join("/")),
              repo: ((if .[-3] == "services" then "knodia-be-"
                      elif .[-3] == "web" then "knodia-web-"
                      elif .[-3] == "infra" then "knodia-infra-"
                      else "knodia-" end) + .[-2])
            }) | unique_by(.name)
          ')
          echo "packages=$PACKAGES" >> $GITHUB_OUTPUT

  build_push_image:
    name: "${{ matrix.package.section }}/${{ matrix.package.name }}"
    needs: [find_dockerfiles]
    runs-on: ["TBD"]
    environment: ecr
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.find_dockerfiles.outputs.packages) }}
    env:
        DOCKER_BUILD_SUMMARY: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ matrix.package.repo }}
          flavor: |
            latest=false
            prefix=
            suffix=
          tags: |
            type=ref,event=branch
            type=ref,event=tag

      - name: Build and push Docker image
        id: build_push
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7
        with:
          context: .
          file: ${{ matrix.package.path }}/Dockerfile
          build-args: |
            NODE_REGISTRY=${{ vars.NODE_REGISTRY }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
