name: PR Validation

on:
  pull_request:

jobs:
  typecheck:
    name: Turbo typecheck
    uses: ./.github/workflows/pnpm-job.yml
    with:
      command: typecheck

  lint:
    name: Turbo lint
    uses: ./.github/workflows/pnpm-job.yml
    with:
      command: lint

  knip:
    name: Knip
    uses: ./.github/workflows/pnpm-job.yml
    with:
      command: knip

  generate-api-client:
    name: Generate API client
    uses: ./.github/workflows/pnpm-job.yml
    with:
      command: generate-api-client
      fail_on_git_diff: true

  generate-openapi:
    name: Generate openapi
    uses: ./.github/workflows/pnpm-job.yml
    needs: generate-api-client
    with:
      command: generate-openapi
      fail_on_git_diff: true
