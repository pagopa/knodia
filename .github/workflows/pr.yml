name: PR Validation

on:
  pull_request:

# TODO: consider running these same jobs on pushes to main
# without the "affected" flags, so main gets a full validation run
# after each merge. Put that workflow a separate file rather than here
# (e.g., main.yml / ci.yml).

jobs:
  typecheck:
    name: Turbo typecheck
    uses: ./.github/workflows/pnpm-job.yml
    with:
      command: typecheck:affected

  lint:
    name: Turbo lint
    uses: ./.github/workflows/pnpm-job.yml
    with:
      command: lint:affected

  knip:
    name: Knip
    uses: ./.github/workflows/pnpm-job.yml
    with:
      command: knip

  generate-openapi:
    name: Generate openapi
    uses: ./.github/workflows/pnpm-job.yml
    with:
      command: generate-openapi:affected
      fail_on_git_diff: true
