name: PR Validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck
    uses: ./.github/workflows/pnpm-job.yml
    with:
      command: typecheck

  lint:
    name: Lint
    uses: ./.github/workflows/pnpm-job.yml
    with:
      command: lint

  knip:
    name: Knip
    uses: ./.github/workflows/pnpm-job.yml
    with:
      command: knip

  generate-openapi:
    name: Generate OpenAPI specs
    uses: ./.github/workflows/pnpm-job.yml
    with:
      command: generate-openapi
      fail_on_git_diff: true

  lint-openapi:
    name: Lint OpenAPI specs
    uses: ./.github/workflows/pnpm-job.yml
    with:
      command: lint-openapi

  test:
    name: Test
    uses: ./.github/workflows/pnpm-job.yml
    with:
      command: test
