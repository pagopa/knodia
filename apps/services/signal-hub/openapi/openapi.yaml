openapi: 3.0.4
info:
  contact:
    url: https://github.com/pagopa/knodia/issues
  termsOfService: https://knodia.org/
  description: API for managing Knodia Signal Hub
  title: Knodia Signal Hub API
  version: 1.0.0
components:
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: A JWT bearer token conforming to the best practices defined in RFC
        8725 (https://www.rfc-editor.org/rfc/rfc8725.html)
      scheme: bearer
      type: http
  schemas:
    ProblemError:
      type: object
      properties:
        code:
          description: Internal code of the error
          example: 123-4567
          pattern: ^[0-9]{3}-[0-9]{4,5}$
          type: string
          minLength: 8
          maxLength: 9
        detail:
          description: A human readable explanation specific to this occurrence of the
            problem
          example: Parameter not valid
          pattern: ^.{0,1024}$
          type: string
          maxLength: 4096
      required:
        - code
        - detail
      additionalProperties: false
    CorrelationId:
      type: string
      format: uuid
      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
    Problem:
      type: object
      properties:
        correlationId:
          description: Unique identifier of the request
          example: 53af4f2d-0c87-41ef-a645-b726a821852b
          allOf:
            - $ref: "#/components/schemas/CorrelationId"
        errors:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/ProblemError"
        status:
          description: The HTTP status code generated by the origin server for this
            occurrence of the problem
          example: 404
          exclusiveMaximum: true
          format: int32
          type: number
          minimum: 100
          maximum: 600
        title:
          description: A short, summary of the problem type. Written in english and readable
          example: Service Unavailable
          pattern: ^[ -~]{0,64}$
          type: string
          maxLength: 64
      required:
        - correlationId
        - status
        - title
      additionalProperties: false
    ObjectSignal:
      type: object
      properties:
        eserviceId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        signalId:
          format: int64
          type: integer
          exclusiveMinimum: true
          maximum: 9007199254740991
        objectId:
          type: string
        objectType:
          type: string
        signalType:
          type: string
          enum:
            - CREATE
            - UPDATE
            - DELETE
      required:
        - eserviceId
        - signalId
        - objectId
        - objectType
        - signalType
      additionalProperties: false
    SeedUpdateSignal:
      type: object
      properties:
        eserviceId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        signalId:
          format: int64
          type: integer
          exclusiveMinimum: true
          maximum: 9007199254740991
        signalType:
          type: string
          enum:
            - SEEDUPDATE
      required:
        - eserviceId
        - signalId
        - signalType
      additionalProperties: false
    Signal:
      discriminator:
        mapping:
          CREATE: "#/components/schemas/ObjectSignal"
          DELETE: "#/components/schemas/ObjectSignal"
          SEEDUPDATE: "#/components/schemas/SeedUpdateSignal"
          UPDATE: "#/components/schemas/ObjectSignal"
        propertyName: signalType
      oneOf:
        - $ref: "#/components/schemas/ObjectSignal"
        - $ref: "#/components/schemas/SeedUpdateSignal"
    PushResponse:
      type: object
      properties:
        signalId:
          format: int64
          type: integer
          exclusiveMinimum: true
          maximum: 9007199254740991
      required:
        - signalId
      additionalProperties: false
    PullResponse:
      type: object
      properties:
        lastSignalId:
          format: int64
          type: integer
          exclusiveMinimum: true
          maximum: 9007199254740991
        signals:
          type: array
          items:
            $ref: "#/components/schemas/Signal"
      required:
        - signals
      additionalProperties: false
paths:
  /status:
    get:
      operationId: getStatus
      tags:
        - health
      description: Check the health status of the service
      security: []
      responses:
        "200":
          description: Service status OK
          content:
            application/problem+json:
              schema:
                description: Service status OK
                allOf:
                  - $ref: "#/components/schemas/Problem"
  /signals:
    post:
      operationId: pushSignal
      summary: Push Signal
      tags:
        - signalHub
      description: Push a signal for an E-service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Signal"
      responses:
        "200":
          description: Signal accepted
          content:
            application/json:
              schema:
                description: Signal accepted
                allOf:
                  - $ref: "#/components/schemas/PushResponse"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                description: Bad Request
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                description: Unauthorized
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                description: Forbidden
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                description: Not Found
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "409":
          description: Conflict
          content:
            application/problem+json:
              schema:
                description: Conflict
                allOf:
                  - $ref: "#/components/schemas/Problem"
  /signals/{eserviceId}:
    get:
      operationId: pullSignals
      summary: Pull Signals
      tags:
        - signalHub
      description: Pull a list of signals for an E-service
      parameters:
        - schema:
            format: int64
            default: 0
            type: integer
            minimum: 0
            maximum: 9007199254740991
          in: query
          name: lastSignalId
          required: false
          description: The ID of the last signal received, used for pagination
        - schema:
            format: int32
            default: 10
            type: integer
            minimum: 1
            maximum: 100
          in: query
          name: size
          required: false
          description: Maximum number of signals returned
        - schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: path
          name: eserviceId
          required: true
      responses:
        "200":
          description: Signals pulled successfully
          content:
            application/json:
              schema:
                description: Signals pulled successfully
                allOf:
                  - $ref: "#/components/schemas/PullResponse"
        "206":
          description: Signals pulled successfully, but there are more signals to pull
          content:
            application/json:
              schema:
                description: Signals pulled successfully, but there are more signals to pull
                allOf:
                  - $ref: "#/components/schemas/PullResponse"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                description: Bad Request
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                description: Unauthorized
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                description: Forbidden
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                description: Not Found
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "409":
          description: Conflict
          content:
            application/problem+json:
              schema:
                description: Conflict
                allOf:
                  - $ref: "#/components/schemas/Problem"
servers:
  - description: Signal Hub API
    url: /
security:
  - bearerAuth: []
tags:
  - description: Health check routes
    name: health
  - description: Signal Hub routes
    name: signalHub
