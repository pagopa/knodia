openapi: 3.0.4
info:
  contact:
    url: https://github.com/pagopa/knodia/issues
  termsOfService: https://knodia.org/
  description: Mock e-service API for POC UC03 relay (ERD dispatch relay between SERCs)
  title: Knodia Mock E-service API (ERDS Relay)
  version: 1.0.0
components:
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: A JWT bearer token conforming to the best practices defined in RFC
        8725 (https://www.rfc-editor.org/rfc/rfc8725.html)
      scheme: bearer
      type: http
  schemas:
    ProblemError:
      type: object
      properties:
        code:
          description: Internal code of the error
          example: 123-4567
          pattern: ^[0-9]{3}-[0-9]{4,5}$
          type: string
          minLength: 8
          maxLength: 9
        detail:
          description: A human readable explanation specific to this occurrence of the
            problem
          example: Parameter not valid
          pattern: ^.{0,1024}$
          type: string
          maxLength: 4096
      required:
        - code
        - detail
      additionalProperties: false
    CorrelationId:
      type: string
      format: uuid
      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
    Problem:
      type: object
      properties:
        correlationId:
          description: Unique identifier of the request
          example: 53af4f2d-0c87-41ef-a645-b726a821852b
          allOf:
            - $ref: "#/components/schemas/CorrelationId"
        errors:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/ProblemError"
        status:
          description: The HTTP status code generated by the origin server for this
            occurrence of the problem
          example: 404
          exclusiveMaximum: true
          format: int32
          type: number
          minimum: 100
          maximum: 600
        title:
          description: A short, summary of the problem type. Written in english and readable
          example: Service Unavailable
          pattern: ^[ -~]{0,64}$
          type: string
          maxLength: 64
      required:
        - correlationId
        - status
        - title
      additionalProperties: false
    UriScheme:
      description: Identifier scheme URI accepted by Knodia mock e-services
      type: string
      enum:
        - http://memberstate.ms/PIdentifier
        - http://memberstate.ms/VAT
    ErdsIdentifier:
      description: Identifier of an Electronic Registered Delivery Service (SERC) in the POC
      type: string
      enum:
        - systemSERCLynx
        - systemSERCOrion
    ErdsPartyIdentifier:
      description: Globally unique identifier of a party in an ERD dispatch (Core
        Person Vocabulary 2.1.1)
      type: object
      properties:
        notation:
          type: string
          minLength: 1
        schemeName:
          type: string
          minLength: 1
        schemeURI:
          $ref: "#/components/schemas/UriScheme"
      required:
        - notation
        - schemeName
        - schemeURI
      additionalProperties: false
    ErdsRefIdentifier:
      description: Reference to an ERD message or evidence (SERC + uuid)
      type: object
      properties:
        erdsIdentifier:
          $ref: "#/components/schemas/ErdsIdentifier"
        uuid:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
      required:
        - erdsIdentifier
        - uuid
      additionalProperties: false
    ErdMessageType:
      description: Whether an ERD dispatch carries a message or its receipt
      type: string
      enum:
        - Dispatch
        - Receipt
    EventIdentifier:
      description: ERDS evidence event
      type: string
      enum:
        - SubmissionAcceptance
        - RelayAcceptance
        - RelayRejection
        - RelayFailure
        - ContentConsignment
        - ContentConsignmentFailure
        - ContentHandover
        - ContentHandoverFailure
    EventReason:
      description: Reason of an ERDS evidence event
      type: string
      enum:
        - MessageAccepted
        - MessageSuccessfullyRelayed
        - MessageRejected
        - UnknownRecipient
        - MessageConsignedToRecipient
        - MessageNotConsignedForQuota
        - MessageHandoverToRecipient
        - MessageTypeNotAcceptedByRecipient
    UserContent:
      description: The message the sender wants to deliver to the recipient
      type: object
      properties:
        body:
          type: string
        subject:
          type: string
      required:
        - body
        - subject
      additionalProperties: false
    RelayMetadata:
      description: Metadata generated by a SERC to relay a data exchange
      type: object
      properties:
        messageIdentifier:
          $ref: "#/components/schemas/ErdsRefIdentifier"
        messageType:
          $ref: "#/components/schemas/ErdMessageType"
        recipientIdentifier:
          $ref: "#/components/schemas/ErdsPartyIdentifier"
        senderIdentifier:
          $ref: "#/components/schemas/ErdsPartyIdentifier"
        userContentInformation:
          type: string
          enum:
            - text
        version:
          type: string
          enum:
            - KNODIAUSECASE
      required:
        - messageIdentifier
        - messageType
        - recipientIdentifier
        - senderIdentifier
        - version
      additionalProperties: false
    ErdEvidence:
      description: ERDS evidence generated by a SERC for a data exchange
      type: object
      properties:
        eventIdentifier:
          $ref: "#/components/schemas/EventIdentifier"
        eventReason:
          $ref: "#/components/schemas/EventReason"
        eventTime:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        evidenceIdentifier:
          $ref: "#/components/schemas/ErdsRefIdentifier"
        version:
          type: string
          enum:
            - KNODIAUSECASE
      required:
        - eventIdentifier
        - eventReason
        - eventTime
        - evidenceIdentifier
        - version
      additionalProperties: false
    ErdDispatch:
      description: "The set of data exchanged between SERCs: the user message
        (optional), the relay metadata, and the evidence (ETSI EN 319 522-2)."
      type: object
      properties:
        evidence:
          $ref: "#/components/schemas/ErdEvidence"
        relayMetadata:
          $ref: "#/components/schemas/RelayMetadata"
        userContent:
          allOf:
            - $ref: "#/components/schemas/UserContent"
      required:
        - evidence
        - relayMetadata
      additionalProperties: false
    RelayAck:
      description: Acknowledgment returned by a SERC upon accepting a relayed dispatch.
      type: object
      properties:
        correlationId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        messageIdentifier:
          $ref: "#/components/schemas/ErdsRefIdentifier"
        receivedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
      required:
        - correlationId
        - messageIdentifier
        - receivedAt
      additionalProperties: false
  headers:
    RateLimitLimit:
      description: Total requests allowed in the current window.
      required: false
      schema:
        format: int32
        minimum: 0
        type: integer
    RateLimitRemaining:
      description: Requests remaining in the current window.
      required: false
      schema:
        format: int32
        minimum: 0
        type: integer
    RateLimitReset:
      description: Seconds before the current window resets.
      required: false
      schema:
        format: int32
        minimum: 0
        type: integer
    RateLimitRetryAfter:
      description: Seconds the client should wait before retrying.
      required: false
      schema:
        format: int32
        minimum: 0
        type: integer
paths:
  /relay:
    post:
      operationId: relay
      summary: Relay
      tags:
        - pocUc03Relay
      description: Receives an ERD dispatch (the sender's message or the delivery
        evidences) from another SERC and acknowledges it (ETSI EN 319 522-2
        relay, Bearer-protected, Receive-data mode).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErdDispatch"
      responses:
        "200":
          description: Dispatch accepted by the SERC
          content:
            application/json:
              schema:
                description: Dispatch accepted by the SERC
                allOf:
                  - $ref: "#/components/schemas/RelayAck"
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
        "400":
          description: Invalid erd_dispatch body
          content:
            application/problem+json:
              schema:
                description: Invalid erd_dispatch body
                allOf:
                  - $ref: "#/components/schemas/Problem"
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                description: Unauthorized
                allOf:
                  - $ref: "#/components/schemas/Problem"
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
        "429":
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                description: Too Many Requests
                allOf:
                  - $ref: "#/components/schemas/Problem"
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
            Retry-After:
              $ref: "#/components/headers/RateLimitRetryAfter"
servers:
  - description: Mock E-service API
    url: /
security:
  - bearerAuth: []
tags:
  - description: ERD dispatch relay between SERCs (POC UC03 receive-data, Bearer-protected)
    name: pocUc03Relay
