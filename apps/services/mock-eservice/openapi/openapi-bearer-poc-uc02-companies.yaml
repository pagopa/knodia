    LegalEntity:
      description: Legal entity (company), modelled after Core Business Vocabulary 2.2.0
      type: object
      properties:
        legalEntityActivity:
          $ref: "#/components/schemas/LegalEntityActivity"
        legalIdentifier:
          $ref: "#/components/schemas/LegalIdentifier"
        legalName:
          type: string
        registrationDate:
          type: string
          format: date
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
      required:
        - legalEntityActivity
        - legalIdentifier
        - legalName
      additionalProperties: false
    EvidenceTypeClassification:
      description: Type of evidence (CCCEV 2.1.0)
      type: object
      properties:
        evidenceTypeClassification:
          type: string
          enum:
            - codeETC_001
            - codeETC_002
            - codeETC_003
            - codeETC_004
        identifier:
          type: string
      required:
        - evidenceTypeClassification
        - identifier
      additionalProperties: false
    PeriodOfTime:
      description: Period of time during which an evidence is valid (CCCEV 2.1.0)
      type: object
      properties:
        endtime:
          type: string
          format: date
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
        starttime:
          type: string
          format: date
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
      required:
        - starttime
      additionalProperties: false
    Evidence:
      description: Evidence about a legal entity (CCCEV 2.1.0)
      type: object
      properties:
        isAbout:
          $ref: "#/components/schemas/LegalEntity"
        isConformantTo:
          $ref: "#/components/schemas/EvidenceTypeClassification"
        validityPeriod:
          $ref: "#/components/schemas/PeriodOfTime"
      required:
        - isAbout
        - isConformantTo
        - validityPeriod
      additionalProperties: false
paths:
  /legal-entities/{uidCompany}/information:
    get:
      operationId: getCompanyInformation
      summary: Get company information
      tags:
        - pocUc02Companies
      description: Returns the registry information of a legal entity (company)
        identified by its uid_company (Bearer-protected).
      parameters:
        - schema:
            $ref: "#/components/schemas/CompanyUid"
          in: path
          name: uidCompany
          required: true
      responses:
        "200":
          description: Registry information for the requested legal entity
          content:
            application/json:
              schema:
                description: Registry information for the requested legal entity
                allOf:
                  - $ref: "#/components/schemas/LegalEntity"
        "400":
          description: Invalid uid_company
          content:
            application/problem+json:
              schema:
                description: Invalid uid_company
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                description: Unauthorized
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "404":
          description: No legal entity found for the uid_company
          content:
            application/problem+json:
              schema:
                description: No legal entity found for the uid_company
                allOf:
                  - $ref: "#/components/schemas/Problem"
  /legal-entities/{uidCompany}/evidences:
    get:
      operationId: getEvidences
      summary: Get evidences
      tags:
        - pocUc02Companies
      description: Returns the evidences held about a legal entity (company),
        optionally filtered by evidence type (Bearer-protected).
      parameters:
        - schema:
            type: string
            enum:
              - codeETC_001
              - codeETC_002
              - codeETC_003
              - codeETC_004
          in: query
          name: evidenceType
          required: false
        - schema:
            $ref: "#/components/schemas/CompanyUid"
          in: path
          name: uidCompany
          required: true
      responses:
        "200":
          description: Evidences for the requested legal entity
          content:
            application/json:
              schema:
                description: Evidences for the requested legal entity
                type: array
                items:
                  $ref: "#/components/schemas/Evidence"
        "400":
          description: Invalid uid_company
          content:
            application/problem+json:
              schema:
                description: Invalid uid_company
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                description: Unauthorized
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "404":
          description: No legal entity found for the uid_company
          content:
            application/problem+json:
              schema:
                description: No legal entity found for the uid_company
                allOf:
                  - $ref: "#/components/schemas/Problem"
servers:
  - description: Mock E-service API
    url: /
security:
  - bearerAuth: []
tags:
  - description: Legal-entity information + evidences lookup by uid_company
      (Bearer-protected)
    name: pocUc02Companies
