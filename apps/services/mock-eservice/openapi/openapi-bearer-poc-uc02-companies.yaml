openapi: 3.0.4
info:
  contact:
    url: https://github.com/pagopa/knodia/issues
  termsOfService: https://knodia.org/
  description: Mock e-service API for POC UC02 companies (legal-entity information
    + evidences)
  title: Knodia Mock E-service API (Companies)
  version: 1.0.0
components:
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: A JWT bearer token conforming to the best practices defined in RFC
        8725 (https://www.rfc-editor.org/rfc/rfc8725.html)
      scheme: bearer
      type: http
  schemas:
    ProblemError:
      type: object
      properties:
        code:
          description: Internal code of the error
          example: 123-4567
          pattern: ^[0-9]{3}-[0-9]{4,5}$
          type: string
          minLength: 8
          maxLength: 9
        detail:
          description: A human readable explanation specific to this occurrence of the
            problem
          example: Parameter not valid
          pattern: ^.{0,1024}$
          type: string
          maxLength: 4096
      required:
        - code
        - detail
      additionalProperties: false
    CorrelationId:
      type: string
      format: uuid
      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
    Problem:
      type: object
      properties:
        correlationId:
          description: Unique identifier of the request
          example: 53af4f2d-0c87-41ef-a645-b726a821852b
          allOf:
            - $ref: "#/components/schemas/CorrelationId"
        errors:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/ProblemError"
        status:
          description: The HTTP status code generated by the origin server for this
            occurrence of the problem
          example: 404
          exclusiveMaximum: true
          format: int32
          type: number
          minimum: 100
          maximum: 600
        title:
          description: A short, summary of the problem type. Written in english and readable
          example: Service Unavailable
          pattern: ^[ -~]{0,64}$
          type: string
          maxLength: 64
      required:
        - correlationId
        - status
        - title
      additionalProperties: false
    UriScheme:
      description: Identifier scheme URI accepted by Knodia mock e-services
      type: string
      enum:
        - http://memberstate.ms/PIdentifier
        - http://memberstate.ms/VAT
    CompanyUid:
      description: "Legal-entity identifier in the path: 11-digit Italian VAT number
        (Partita IVA)."
      example: "01229430085"
      type: string
      pattern: ^[0-9]{11}$
    LegalIdentifier:
      description: Unique identifier of a legal entity (Core Business Vocabulary 2.2.0)
      type: object
      properties:
        notation:
          $ref: "#/components/schemas/CompanyUid"
        schemeName:
          type: string
        schemeURI:
          $ref: "#/components/schemas/UriScheme"
      required:
        - notation
        - schemeName
        - schemeURI
      additionalProperties: false
    LegalEntityActivity:
      description: Economic activity of the legal entity — ATECO 2025 classification
        code (6-digit category level, with NACE Rev. 2.1 correspondence)
      example: 43.22.07
      type: string
      enum:
        - 01.11.00
        - 01.12.00
        - 01.13.11
        - 01.13.12
