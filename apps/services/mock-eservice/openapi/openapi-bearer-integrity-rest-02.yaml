openapi: 3.0.4
info:
  contact:
    url: https://github.com/pagopa/knodia/issues
  termsOfService: https://knodia.org/
  description: Mock e-service for Integrity Rest 02 (legal-entity address lookup)
  title: Knodia Mock E-service API (Integrity Rest 02)
  version: 1.0.0
components:
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: A JWT bearer token conforming to the best practices defined in RFC
        8725 (https://www.rfc-editor.org/rfc/rfc8725.html)
      scheme: bearer
      type: http
  schemas:
    ProblemError:
      type: object
      properties:
        code:
          description: Internal code of the error
          example: 123-4567
          pattern: ^[0-9]{3}-[0-9]{4,5}$
          type: string
          minLength: 8
          maxLength: 9
        detail:
          description: A human readable explanation specific to this occurrence of the
            problem
          example: Parameter not valid
          pattern: ^.{0,1024}$
          type: string
          maxLength: 4096
      required:
        - code
        - detail
      additionalProperties: false
    CorrelationId:
      type: string
      format: uuid
      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
    Problem:
      type: object
      properties:
        correlationId:
          description: Unique identifier of the request
          example: 53af4f2d-0c87-41ef-a645-b726a821852b
          allOf:
            - $ref: "#/components/schemas/CorrelationId"
        errors:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/ProblemError"
        status:
          description: The HTTP status code generated by the origin server for this
            occurrence of the problem
          example: 404
          exclusiveMaximum: true
          format: int32
          type: number
          minimum: 100
          maximum: 600
        title:
          description: A short, summary of the problem type. Written in english and readable
          example: Service Unavailable
          pattern: ^[ -~]{0,64}$
          type: string
          maxLength: 64
      required:
        - correlationId
        - status
        - title
      additionalProperties: false
    Address:
      description: Address, modelled after Core Person Vocabulary 2.1.1 / Core
        Business Vocabulary 2.2.0
      type: object
      properties:
        adminUnitL1:
          type: string
        adminUnitL2:
          type: string
        fullAddress:
          type: string
        postCode:
          type: string
        postName:
          type: string
      required:
        - adminUnitL1
        - adminUnitL2
        - fullAddress
      additionalProperties: false
    CompanyUid:
      description: "Legal-entity identifier in the path: 11-digit Italian VAT number
        (Partita IVA)."
      example: "01229430085"
      type: string
      pattern: ^[0-9]{11}$
paths:
  /legal-entities/{uidCompany}/address:
    get:
      operationId: getCompanyAddress
      summary: Get company address
      tags:
        - companyAddress
      description: Returns the address of a company identified by its UID
        (Cross-Border E-service 03, Bearer-protected).
      parameters:
        - schema:
            $ref: "#/components/schemas/CompanyUid"
          in: path
          name: uidCompany
          required: true
      responses:
        "200":
          description: Address for the requested company
          content:
            application/json:
              schema:
                description: Address for the requested company
                allOf:
                  - $ref: "#/components/schemas/Address"
        "400":
          description: Invalid uid_company
          content:
            application/problem+json:
              schema:
                description: Invalid uid_company
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                description: Unauthorized
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "404":
          description: No legal entity found for the uid_company
          content:
            application/problem+json:
              schema:
                description: No legal entity found for the uid_company
                allOf:
                  - $ref: "#/components/schemas/Problem"
servers:
  - description: Mock E-service API
    url: /
security:
  - bearerAuth: []
tags:
  - description: Legal-entity address lookup by uid_company (Cross-Border E-service
      06, Bearer-protected)
    name: companyAddress
