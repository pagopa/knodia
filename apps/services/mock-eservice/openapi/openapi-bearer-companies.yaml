openapi: 3.0.4
info:
  contact:
    url: https://github.com/pagopa/knodia/issues
  termsOfService: https://knodia.org/
  description: Mock e-service API for POC UC02 companies (legal-entity information
    + evidences)
  title: Knodia Mock E-service API (Companies)
  version: 1.0.0
components:
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: A JWT bearer token conforming to the best practices defined in RFC
        8725 (https://www.rfc-editor.org/rfc/rfc8725.html)
      scheme: bearer
      type: http
  schemas:
    ProblemError:
      type: object
      properties:
        code:
          description: Internal code of the error
          example: 123-4567
          pattern: ^[0-9]{3}-[0-9]{4,5}$
          type: string
          minLength: 8
          maxLength: 9
        detail:
          description: A human readable explanation specific to this occurrence of the
            problem
          example: Parameter not valid
          pattern: ^.{0,1024}$
          type: string
          maxLength: 4096
      required:
        - code
        - detail
      additionalProperties: false
    CorrelationId:
      type: string
      format: uuid
      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
    Problem:
      type: object
      properties:
        correlationId:
          description: Unique identifier of the request
          example: 53af4f2d-0c87-41ef-a645-b726a821852b
          allOf:
            - $ref: "#/components/schemas/CorrelationId"
        errors:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/ProblemError"
        status:
          description: The HTTP status code generated by the origin server for this
            occurrence of the problem
          example: 404
          exclusiveMaximum: true
          format: int32
          type: number
          minimum: 100
          maximum: 600
        title:
          description: A short, summary of the problem type. Written in english and readable
          example: Service Unavailable
          pattern: ^[ -~]{0,64}$
          type: string
          maxLength: 64
      required:
        - correlationId
        - status
        - title
      additionalProperties: false
    UriScheme:
      description: Identifier scheme URI accepted by Knodia mock e-services
      type: string
      enum:
        - http://memberstate.ms/PIdentifier
        - http://memberstate.ms/VAT
    CompanyUid:
      description: "Legal-entity identifier in the path: 11-digit Italian VAT number
        (Partita IVA)."
      example: "01229430085"
      type: string
      pattern: ^[0-9]{11}$
    LegalIdentifier:
      description: Unique identifier of a legal entity (Core Business Vocabulary 2.2.0)
      type: object
      properties:
        notation:
          $ref: "#/components/schemas/CompanyUid"
        schemeName:
          type: string
        schemeURI:
          $ref: "#/components/schemas/UriScheme"
      required:
        - notation
        - schemeName
        - schemeURI
      additionalProperties: false
    LegalEntityActivity:
      description: Economic activity of the legal entity, derived from NACE Rev. 2.1
      example: "43.21"
      type: string
      minLength: 1
    LegalEntity:
      description: Legal entity (company), modelled after Core Business Vocabulary 2.2.0
      type: object
      properties:
        legalEntityActivity:
          $ref: "#/components/schemas/LegalEntityActivity"
        legalIdentifier:
          $ref: "#/components/schemas/LegalIdentifier"
        legalName:
          type: string
        registrationDate:
          type: string
          format: date
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
      required:
        - legalEntityActivity
        - legalIdentifier
        - legalName
      additionalProperties: false
    EvidenceTypeClassification:
      description: Type of evidence (CCCEV 2.1.0)
      type: object
      properties:
        evidenceTypeClassification:
          type: string
          enum:
            - codeETC_001
            - codeETC_002
            - codeETC_003
            - codeETC_004
        identifier:
          type: string
      required:
        - evidenceTypeClassification
        - identifier
      additionalProperties: false
    PeriodOfTime:
      description: Period of time during which an evidence is valid (CCCEV 2.1.0)
      type: object
      properties:
        endtime:
          type: string
          format: date
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
        starttime:
          type: string
          format: date
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
      required:
        - starttime
      additionalProperties: false
    Evidence:
      description: Evidence about a legal entity (CCCEV 2.1.0), returned by the
        Cross-Border E-service 04
      type: object
      properties:
        isAbout:
          $ref: "#/components/schemas/LegalEntity"
        isConformantTo:
          $ref: "#/components/schemas/EvidenceTypeClassification"
        validityPeriod:
          $ref: "#/components/schemas/PeriodOfTime"
      required:
        - isAbout
        - isConformantTo
        - validityPeriod
      additionalProperties: false
paths:
  /legal-entities/{uidCompany}/information:
    get:
      operationId: getCompanyInformation
      summary: Get company information
      tags:
        - legalEntity
      description: Returns the registry information of a legal entity (company)
        identified by its uid_company (Cross-Border E-service 04,
        Bearer-protected).
      parameters:
        - schema:
            $ref: "#/components/schemas/CompanyUid"
          in: path
          name: uidCompany
          required: true
      responses:
        "200":
          description: Registry information for the requested legal entity
          content:
            application/json:
              schema:
                description: Registry information for the requested legal entity
                allOf:
                  - $ref: "#/components/schemas/LegalEntity"
        "400":
          description: Invalid uid_company
          content:
            application/problem+json:
              schema:
                description: Invalid uid_company
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                description: Unauthorized
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "404":
          description: No legal entity found for the uid_company
          content:
            application/problem+json:
              schema:
                description: No legal entity found for the uid_company
                allOf:
                  - $ref: "#/components/schemas/Problem"
  /legal-entities/{uidCompany}/evidences:
    get:
      operationId: getEvidences
      summary: Get evidences
      tags:
        - legalEntity
      description: Returns the evidences held about a legal entity (company),
        optionally filtered by evidence type (Cross-Border E-service 04,
        Bearer-protected).
      parameters:
        - schema:
            type: string
            enum:
              - codeETC_001
              - codeETC_002
              - codeETC_003
              - codeETC_004
          in: query
          name: evidenceType
          required: false
        - schema:
            $ref: "#/components/schemas/CompanyUid"
          in: path
          name: uidCompany
          required: true
      responses:
        "200":
          description: Evidences for the requested legal entity
          content:
            application/json:
              schema:
                description: Evidences for the requested legal entity
                type: array
                items:
                  $ref: "#/components/schemas/Evidence"
        "400":
          description: Invalid uid_company
          content:
            application/problem+json:
              schema:
                description: Invalid uid_company
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                description: Unauthorized
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "404":
          description: No legal entity found for the uid_company
          content:
            application/problem+json:
              schema:
                description: No legal entity found for the uid_company
                allOf:
                  - $ref: "#/components/schemas/Problem"
servers:
  - description: Mock E-service API
    url: /
security:
  - bearerAuth: []
tags:
  - description: Legal-entity information + evidences lookup by uid_company
      (Cross-Border E-service 04, Bearer-protected)
    name: legalEntity
