openapi: 3.0.4
info:
  contact:
    url: https://github.com/pagopa/knodia/issues
  termsOfService: https://knodia.org/
  description: Mock e-service API for POC UC03 supervisory body (lookupERDS +
    getERDSMetadata)
  title: Knodia Mock E-service API (ERDS Lookup & Metadata)
  version: 1.0.0
components:
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: A JWT bearer token conforming to the best practices defined in RFC
        8725 (https://www.rfc-editor.org/rfc/rfc8725.html)
      scheme: bearer
      type: http
  schemas:
    ProblemError:
      type: object
      properties:
        code:
          description: Internal code of the error
          example: 123-4567
          pattern: ^[0-9]{3}-[0-9]{4,5}$
          type: string
          minLength: 8
          maxLength: 9
        detail:
          description: A human readable explanation specific to this occurrence of the
            problem
          example: Parameter not valid
          pattern: ^.{0,1024}$
          type: string
          maxLength: 4096
      required:
        - code
        - detail
      additionalProperties: false
    CorrelationId:
      type: string
      format: uuid
      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
    Problem:
      type: object
      properties:
        correlationId:
          description: Unique identifier of the request
          example: 53af4f2d-0c87-41ef-a645-b726a821852b
          allOf:
            - $ref: "#/components/schemas/CorrelationId"
        errors:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/ProblemError"
        status:
          description: The HTTP status code generated by the origin server for this
            occurrence of the problem
          example: 404
          exclusiveMaximum: true
          format: int32
          type: number
          minimum: 100
          maximum: 600
        title:
          description: A short, summary of the problem type. Written in english and readable
          example: Service Unavailable
          pattern: ^[ -~]{0,64}$
          type: string
          maxLength: 64
      required:
        - correlationId
        - status
        - title
      additionalProperties: false
    UriScheme:
      description: Identifier scheme URI accepted by Knodia mock e-services
      type: string
      enum:
        - http://memberstate.ms/PIdentifier
        - http://memberstate.ms/VAT
    ErdsIdentifier:
      description: Identifier of an Electronic Registered Delivery Service (SERC) in the POC
      type: string
      enum:
        - systemSERCLynx
        - systemSERCOrion
    ErdsLookupResult:
      description: The SERC that serves the looked-up recipient (lookupERDS).
      type: object
      properties:
        erdsIdentifier:
          $ref: "#/components/schemas/ErdsIdentifier"
      required:
        - erdsIdentifier
      additionalProperties: false
    ErdsMetadata:
      description: "Metadata of an Electronic Registered Delivery Service
        (getERDSMetadata): its domain name and the knode/e-service that publish
        its relay."
      type: object
      properties:
        domainName:
          description: Domain name of the SERC (ETSI EN 319 522-2)
          example: systemSERCOrion
          type: string
        eserviceId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        identifier:
          $ref: "#/components/schemas/ErdsIdentifier"
        knodeId:
          type: string
          enum:
            - Orion
            - Lynx
      required:
        - domainName
        - eserviceId
        - identifier
        - knodeId
      additionalProperties: false
  headers:
    RateLimitLimit:
      description: Total requests allowed in the current window.
      required: false
      schema:
        format: int32
        minimum: 0
        type: integer
    RateLimitRemaining:
      description: Requests remaining in the current window.
      required: false
      schema:
        format: int32
        minimum: 0
        type: integer
    RateLimitReset:
      description: Seconds before the current window resets.
      required: false
      schema:
        format: int32
        minimum: 0
        type: integer
    RateLimitRetryAfter:
      description: Seconds the client should wait before retrying.
      required: false
      schema:
        format: int32
        minimum: 0
        type: integer
paths:
  /erds:
    get:
      operationId: lookupERDS
      summary: Lookup ERDS
      tags:
        - pocUc03SupervisoryBody
      description: Resolves the SERC (erdsIdentifier) that serves a recipient
        identified by the given IDENTIFIER (lookupERDS, Bearer-protected).
      parameters:
        - schema:
            type: string
            minLength: 1
          in: query
          name: notation
          required: true
        - schema:
            type: string
            minLength: 1
          in: query
          name: schemeName
          required: true
        - schema:
            $ref: "#/components/schemas/UriScheme"
          in: query
          name: schemeURI
          required: true
      responses:
        "200":
          description: The SERC that serves the recipient
          content:
            application/json:
              schema:
                description: The SERC that serves the recipient
                allOf:
                  - $ref: "#/components/schemas/ErdsLookupResult"
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
        "400":
          description: Missing or invalid identifier
          content:
            application/problem+json:
              schema:
                description: Missing or invalid identifier
                allOf:
                  - $ref: "#/components/schemas/Problem"
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                description: Unauthorized
                allOf:
                  - $ref: "#/components/schemas/Problem"
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
        "404":
          description: No SERC serves the given recipient
          content:
            application/problem+json:
              schema:
                description: No SERC serves the given recipient
                allOf:
                  - $ref: "#/components/schemas/Problem"
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
        "429":
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                description: Too Many Requests
                allOf:
                  - $ref: "#/components/schemas/Problem"
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
            Retry-After:
              $ref: "#/components/headers/RateLimitRetryAfter"
  /erds/{erdsIdentifier}/metadata:
    get:
      operationId: getERDSMetadata
      summary: Get ERDS metadata
      tags:
        - pocUc03SupervisoryBody
      description: Returns the metadata of a SERC — its domain name and the
        knode/e-service that publish its relay (getERDSMetadata,
        Bearer-protected).
      parameters:
        - schema:
            example: systemSERCOrion
            type: string
            minLength: 1
          in: path
          name: erdsIdentifier
          required: true
          description: SERC identifier
      responses:
        "200":
          description: Metadata of the SERC
          content:
            application/json:
              schema:
                description: Metadata of the SERC
                allOf:
                  - $ref: "#/components/schemas/ErdsMetadata"
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
        "400":
          description: Missing or invalid erdsIdentifier
          content:
            application/problem+json:
              schema:
                description: Missing or invalid erdsIdentifier
                allOf:
                  - $ref: "#/components/schemas/Problem"
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                description: Unauthorized
                allOf:
                  - $ref: "#/components/schemas/Problem"
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
        "404":
          description: No SERC found for the identifier
          content:
            application/problem+json:
              schema:
                description: No SERC found for the identifier
                allOf:
                  - $ref: "#/components/schemas/Problem"
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
        "429":
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                description: Too Many Requests
                allOf:
                  - $ref: "#/components/schemas/Problem"
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
            Retry-After:
              $ref: "#/components/headers/RateLimitRetryAfter"
servers:
  - description: Mock E-service API
    url: /
security:
  - bearerAuth: []
tags:
  - description: ERDS lookup + metadata for the supervisory body (POC UC03
      provide-data, Bearer-protected)
    name: pocUc03SupervisoryBody
