openapi: 3.0.4
info:
  contact:
    url: https://github.com/pagopa/knodia/issues
  termsOfService: https://knodia.org/
  description: Mock e-service API for POC UC01 qualifications (getQualifications)
  title: Knodia Mock E-service API (Qualifications)
  version: 1.0.0
components:
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: A JWT bearer token conforming to the best practices defined in RFC
        8725 (https://www.rfc-editor.org/rfc/rfc8725.html)
      scheme: bearer
      type: http
  schemas:
    ProblemError:
      type: object
      properties:
        code:
          description: Internal code of the error
          example: 123-4567
          pattern: ^[0-9]{3}-[0-9]{4,5}$
          type: string
          minLength: 8
          maxLength: 9
        detail:
          description: A human readable explanation specific to this occurrence of the
            problem
          example: Parameter not valid
          pattern: ^.{0,1024}$
          type: string
          maxLength: 4096
      required:
        - code
        - detail
      additionalProperties: false
    CorrelationId:
      type: string
      format: uuid
      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
    Problem:
      type: object
      properties:
        correlationId:
          description: Unique identifier of the request
          example: 53af4f2d-0c87-41ef-a645-b726a821852b
          allOf:
            - $ref: "#/components/schemas/CorrelationId"
        errors:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/ProblemError"
        status:
          description: The HTTP status code generated by the origin server for this
            occurrence of the problem
          example: 404
          exclusiveMaximum: true
          format: int32
          type: number
          minimum: 100
          maximum: 600
        title:
          description: A short, summary of the problem type. Written in english and readable
          example: Service Unavailable
          pattern: ^[ -~]{0,64}$
          type: string
          maxLength: 64
      required:
        - correlationId
        - status
        - title
      additionalProperties: false
    Location:
      description: Geographic place, modelled after Core Person Vocabulary 2.1.1
        (GeoNames URI + name)
      type: object
      properties:
        geographicIdentifier:
          type: string
          format: uri
        geographicName:
          type: string
      required:
        - geographicIdentifier
        - geographicName
      additionalProperties: false
    StudentUid:
      description: "Student identifier in the path: 8-digit national student-registry
        matricola."
      example: "00132423"
      type: string
      pattern: ^[0-9]{8}$
    EQFLevel:
      description: European Qualifications Framework level (8-level scale)
      type: string
      enum:
        - level01
        - level02
        - level03
        - level04
        - level05
        - level06
        - level07
        - level08
    ISCEDFCode:
      description: ISCED-F broad field of education and training code
      type: string
      enum:
        - "10"
        - "00"
        - "01"
        - "02"
        - "03"
        - "04"
        - "05"
        - "06"
        - "07"
        - "08"
        - "09"
    Organisation:
      description: Organisation (tertiary education institute), modelled after the
        European Learning Model 3.3.1
      type: object
      properties:
        legalName:
          type: string
        location:
          $ref: "#/components/schemas/Location"
      required:
        - legalName
        - location
      additionalProperties: false
    Qualification:
      description: Qualification (learning outcome), modelled after the European
        Learning Model 3.3.1
      type: object
      properties:
        EQFLevel:
          $ref: "#/components/schemas/EQFLevel"
        ISCEDFCode:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/ISCEDFCode"
        publisher:
          $ref: "#/components/schemas/Organisation"
        title:
          type: string
      required:
        - EQFLevel
        - ISCEDFCode
        - publisher
        - title
      additionalProperties: false
paths:
  /students/{uidStudent}/qualifications:
    get:
      operationId: getQualifications
      summary: Get qualifications
      tags:
        - pocUc01Qualifications
      description: Returns the qualifications held by a student identified by
        uidStudent, optionally filtered by ISCED-F field code
        (Bearer-protected).
      parameters:
        - schema:
            allOf:
              - $ref: "#/components/schemas/ISCEDFCode"
          in: query
          name: iscedfCode
          required: false
        - schema:
            $ref: "#/components/schemas/StudentUid"
          in: path
          name: uidStudent
          required: true
      responses:
        "200":
          description: Qualifications for the requested student
          content:
            application/json:
              schema:
                description: Qualifications for the requested student
                type: array
                items:
                  $ref: "#/components/schemas/Qualification"
        "400":
          description: Invalid uidStudent
          content:
            application/problem+json:
              schema:
                description: Invalid uidStudent
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                description: Unauthorized
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "404":
          description: No student found for the uidStudent
          content:
            application/problem+json:
              schema:
                description: No student found for the uidStudent
                allOf:
                  - $ref: "#/components/schemas/Problem"
servers:
  - description: Mock E-service API
    url: /
security:
  - bearerAuth: []
tags:
  - description: Qualifications lookup by uidStudent (Cross-Border E-service,
      Bearer-protected)
    name: pocUc01Qualifications
