openapi: 3.0.4
info:
  contact:
    url: https://github.com/pagopa/knodia/issues
  termsOfService: https://knodia.org/
  description: Mock e-service API with Bearer token authentication
  title: Knodia Mock E-service API (Bearer)
  version: 1.0.0
components:
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: A JWT bearer token conforming to the best practices defined in RFC
        8725 (https://www.rfc-editor.org/rfc/rfc8725.html)
      scheme: bearer
      type: http
  schemas:
    ProblemError:
      type: object
      properties:
        code:
          description: Internal code of the error
          example: 123-4567
          pattern: ^[0-9]{3}-[0-9]{4,5}$
          type: string
          minLength: 8
          maxLength: 9
        detail:
          description: A human readable explanation specific to this occurrence of the
            problem
          example: Parameter not valid
          pattern: ^.{0,1024}$
          type: string
          maxLength: 4096
      required:
        - code
        - detail
      additionalProperties: false
    CorrelationId:
      type: string
      format: uuid
      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
    Problem:
      type: object
      properties:
        correlationId:
          description: Unique identifier of the request
          example: 53af4f2d-0c87-41ef-a645-b726a821852b
          allOf:
            - $ref: "#/components/schemas/CorrelationId"
        errors:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/ProblemError"
        status:
          description: The HTTP status code generated by the origin server for this
            occurrence of the problem
          example: 404
          exclusiveMaximum: true
          format: int32
          type: number
          minimum: 100
          maximum: 600
        title:
          description: A short, summary of the problem type. Written in english and readable
          example: Service Unavailable
          pattern: ^[ -~]{0,64}$
          type: string
          maxLength: 64
      required:
        - correlationId
        - status
        - title
      additionalProperties: false
    Notation:
      description: Italian Codice Fiscale, uppercase only. Acts as the natural-person
        identifier in the path.
      example: RMNLNR03H12H501Z
      type: string
      pattern: ^[A-Z]{6}[0-9LMNPQRSTUV]{2}[A-Z][0-9LMNPQRSTUV]{2}[A-Z][0-9LMNPQRSTUV]{3}[A-Z]$
    PersonalInformation:
      description: Personal information returned by the Cross-Border E-Service 01
      type: object
      properties:
        dateOfBirth:
          type: string
          format: date
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
      required:
        - dateOfBirth
      additionalProperties: false
paths:
  /natural-persons/{identifierNotation}:
    get:
      operationId: getPersonalInformation
      summary: Get personal information
      tags:
        - personalInformation
      description: Returns the date of birth of a natural person identified by Codice
        Fiscale (Cross-Border E-Service 01, Bearer-protected).
      parameters:
        - schema:
            $ref: "#/components/schemas/Notation"
          in: path
          name: identifierNotation
          required: true
      responses:
        "200":
          description: Personal information for the requested natural person
          content:
            application/json:
              schema:
                description: Personal information for the requested natural person
                allOf:
                  - $ref: "#/components/schemas/PersonalInformation"
        "400":
          description: Invalid Codice Fiscale
          content:
            application/problem+json:
              schema:
                description: Invalid Codice Fiscale
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                description: Unauthorized
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "404":
          description: No natural person found for the given Codice Fiscale
          content:
            application/problem+json:
              schema:
                description: No natural person found for the given Codice Fiscale
                allOf:
                  - $ref: "#/components/schemas/Problem"
servers:
  - description: Mock E-service API
    url: /
security:
  - bearerAuth: []
tags:
  - description: Personal information lookup by Codice Fiscale (Cross-Border
      E-Service 01, Bearer-protected)
    name: personalInformation
