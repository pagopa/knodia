openapi: 3.0.4
info:
  contact:
    url: https://github.com/pagopa/knodia/issues
  termsOfService: https://knodia.org/
  description: API for managing Knodia Signup Manager
  title: Knodia Signup Manager API
  version: 1.0.0
components:
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: A JWT bearer token conforming to the best practices defined in RFC
        8725 (https://www.rfc-editor.org/rfc/rfc8725.html)
      scheme: bearer
      type: http
  schemas:
    ProblemError:
      type: object
      properties:
        code:
          description: Internal code of the error
          example: 123-4567
          pattern: ^[0-9]{3}-[0-9]{4,5}$
          type: string
          minLength: 8
          maxLength: 9
        detail:
          description: A human readable explanation specific to this occurrence of the
            problem
          example: Parameter not valid
          pattern: ^.{0,1024}$
          type: string
          maxLength: 4096
      required:
        - code
        - detail
      additionalProperties: false
    CorrelationId:
      type: string
      format: uuid
      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
    Problem:
      type: object
      properties:
        correlationId:
          description: Unique identifier of the request
          example: 53af4f2d-0c87-41ef-a645-b726a821852b
          allOf:
            - $ref: "#/components/schemas/CorrelationId"
        errors:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/ProblemError"
        status:
          description: The HTTP status code generated by the origin server for this
            occurrence of the problem
          example: 404
          exclusiveMaximum: true
          format: int32
          type: number
          minimum: 100
          maximum: 600
        title:
          description: A short, summary of the problem type. Written in english and readable
          example: Service Unavailable
          pattern: ^[ -~]{0,64}$
          type: string
          maxLength: 64
      required:
        - correlationId
        - status
        - title
      additionalProperties: false
    SessionResponse:
      type: object
      properties:
        uiSignupSessionToken:
          type: string
      required:
        - uiSignupSessionToken
      additionalProperties: false
    ConfirmOnboardingRequestBody:
      type: object
      properties:
        email:
          type: string
          format: email
          pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
      required:
        - email
      additionalProperties: false
    ChangeEmailRequestBody:
      type: object
      properties:
        email:
          type: string
          format: email
          pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
      required:
        - email
      additionalProperties: false
    SuspendUserRequestBody:
      type: object
      properties:
        suspensionReason:
          type: string
          enum:
            - ACCURACY_CONTESTED
            - UNLAWFUL_PROCESSING
            - DATA_NEEDED_FOR_LEGAL_CLAIMS
            - PENDING_OBJECTION_VERIFICATION
      required:
        - suspensionReason
      additionalProperties: false
    KnodeAssignment:
      type: object
      properties:
        knode:
          type: string
          enum:
            - Orion
            - Lynx
        organizationName:
          type: string
        username:
          type: string
      required:
        - knode
        - organizationName
        - username
      additionalProperties: false
    CurrentSignupUser:
      oneOf:
        - type: object
          properties:
            onboardingStatus:
              type: string
              enum:
                - NOT_COMPLETED
          required:
            - onboardingStatus
          additionalProperties: false
        - type: object
          properties:
            email:
              type: string
              format: email
              pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
            knodes:
              type: array
              items:
                $ref: "#/components/schemas/KnodeAssignment"
            onboardingStatus:
              type: string
              enum:
                - ACTIVE
                - SUSPENDED
                - DELETION_PENDING
          required:
            - email
            - knodes
            - onboardingStatus
          additionalProperties: false
  headers:
    RateLimitLimit:
      description: Total requests allowed in the current window.
      required: false
      schema:
        format: int32
        minimum: 0
        type: integer
    RateLimitRemaining:
      description: Requests remaining in the current window.
      required: false
      schema:
        format: int32
        minimum: 0
        type: integer
    RateLimitReset:
      description: Seconds before the current window resets.
      required: false
      schema:
        format: int32
        minimum: 0
        type: integer
    RateLimitRetryAfter:
      description: Seconds the client should wait before retrying.
      required: false
      schema:
        format: int32
        minimum: 0
        type: integer
paths:
  /status:
    get:
      operationId: getStatus
      tags:
        - health
      description: Check the health status of the service
      security: []
      responses:
        "200":
          description: Service status OK
          content:
            application/problem+json:
              schema:
                description: Service status OK
                allOf:
                  - $ref: "#/components/schemas/Problem"
  /auth/oidc/start:
    get:
      operationId: startOIDCSession
      tags:
        - auth
      description: Initiate OIDC session
      security: []
      responses:
        "302":
          description: Redirected to One Identity's login page
  /auth/oidc/token:
    get:
      operationId: exchangeOIDCCode
      tags:
        - auth
      description: Handle OIDC callback and exchange authorization code for session token
      parameters:
        - schema:
            type: string
          in: query
          name: code
          required: true
        - schema:
            type: string
          in: query
          name: state
          required: true
        - schema:
            type: string
          in: cookie
          name: oidc-session
          required: false
          description: HttpOnly cookie carrying the OIDC state and nonce (set by
            /auth/oidc/start)
      security: []
      responses:
        "200":
          description: OIDC login successful, signup UI session token returned
          content:
            application/json:
              schema:
                description: OIDC login successful, signup UI session token returned
                allOf:
                  - $ref: "#/components/schemas/SessionResponse"
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                description: Bad Request
                allOf:
                  - $ref: "#/components/schemas/Problem"
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                description: Forbidden
                allOf:
                  - $ref: "#/components/schemas/Problem"
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
        "429":
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                description: Too Many Requests
                allOf:
                  - $ref: "#/components/schemas/Problem"
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
            Retry-After:
              $ref: "#/components/headers/RateLimitRetryAfter"
  /user/confirmOnboarding:
    post:
      operationId: confirmOnboarding
      tags:
        - signup
      description: Confirm onboarding for the caller user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmOnboardingRequestBody"
      responses:
        "204":
          description: Onboarding confirmed successfully
          headers:
