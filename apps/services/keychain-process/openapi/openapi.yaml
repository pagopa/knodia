openapi: 3.0.4
info:
  contact:
    url: https://github.com/pagopa/knodia/issues
  termsOfService: https://knodia.org/
  description: API for managing Knodia Keychains
  title: Knodia Keychain Process API
  version: 1.0.0
components:
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: A JWT bearer token conforming to the best practices defined in RFC
        8725 (https://www.rfc-editor.org/rfc/rfc8725.html)
      scheme: bearer
      type: http
  schemas:
    ProblemError:
      type: object
      properties:
        code:
          description: Internal code of the error
          example: 123-4567
          pattern: ^[0-9]{3}-[0-9]{4,5}$
          type: string
          minLength: 8
          maxLength: 9
        detail:
          description: A human readable explanation specific to this occurrence of the
            problem
          example: Parameter not valid
          pattern: ^.{0,1024}$
          type: string
          maxLength: 4096
      required:
        - code
        - detail
      additionalProperties: false
    CorrelationId:
      type: string
      format: uuid
      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
    Problem:
      type: object
      properties:
        correlationId:
          description: Unique identifier of the request
          example: 53af4f2d-0c87-41ef-a645-b726a821852b
          allOf:
            - $ref: "#/components/schemas/CorrelationId"
        errors:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/ProblemError"
        status:
          description: The HTTP status code generated by the origin server for this
            occurrence of the problem
          example: 404
          exclusiveMaximum: true
          format: int32
          type: number
          minimum: 100
          maximum: 600
        title:
          description: A short, summary of the problem type. Written in english and readable
          example: Service Unavailable
          pattern: ^[ -~]{0,64}$
          type: string
          maxLength: 64
      required:
        - correlationId
        - status
        - title
      additionalProperties: false
    KnodeId:
      description: Unique Knode identifier
      type: string
      enum:
        - Orion
        - Lynx
    KeychainId:
      description: Unique identifier of the Keychain
      type: string
      format: uuid
      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
    KeychainLocalizedName:
      description: Name of the Keychain
      type: object
      properties:
        en:
          type: string
          minLength: 5
          maxLength: 60
      required:
        - en
      additionalProperties: false
    KeychainKeyLocalizedName:
      description: Name of the Keychain Key
      type: object
      properties:
        en:
          type: string
          minLength: 5
          maxLength: 60
      required:
        - en
      additionalProperties: false
    KeychainLocalizedDescription:
      description: Description of the Keychain
      type: object
      properties:
        en:
          type: string
          minLength: 10
          maxLength: 250
      required:
        - en
      additionalProperties: false
    KeyFormat:
      type: string
      enum:
        - PublicKey
        - X509Certificate
    KeyAlgorithm:
      type: string
      enum:
        - RS256
    ConsumerKeychainPurposeLinkSeed:
      type: object
      properties:
        knodeId:
          $ref: "#/components/schemas/KnodeId"
        purposeId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
      required:
        - knodeId
        - purposeId
      additionalProperties: false
    Pagination:
      type: object
      properties:
        limit:
          format: int32
          type: number
          minimum: 1
          maximum: 50
        offset:
          format: int32
          type: number
          minimum: 0
        total:
          format: int32
          type: number
          minimum: 0
      required:
        - limit
        - offset
        - total
      additionalProperties: false
    OrganizationId:
      description: Unique identifier of the Organization
      type: string
      format: uuid
      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
    UserId:
      description: Unique identifier of the User
      type: string
      format: uuid
      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
    KeyId:
      description: Unique identifier of the Key
      type: string
      format: base64url
      pattern: ^[A-Za-z0-9_-]*$
    Keychain:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        description:
          allOf:
            - $ref: "#/components/schemas/KeychainLocalizedDescription"
        id:
          $ref: "#/components/schemas/KeychainId"
        name:
          $ref: "#/components/schemas/KeychainLocalizedName"
        ownerId:
          $ref: "#/components/schemas/OrganizationId"
        updatedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
      required:
        - createdAt
        - id
        - name
        - ownerId
        - updatedAt
      additionalProperties: false
    Keychains:
      type: object
      properties:
        pagination:
          $ref: "#/components/schemas/Pagination"
        results:
          type: array
          items:
            $ref: "#/components/schemas/Keychain"
      required:
        - pagination
        - results
      additionalProperties: false
    ConsumerKeychainSeed:
      type: object
      properties:
        description:
          allOf:
            - $ref: "#/components/schemas/KeychainLocalizedDescription"
        name:
          $ref: "#/components/schemas/KeychainLocalizedName"
      required:
        - name
      additionalProperties: false
    KnodeApiKeychainSeed:
      type: object
      properties:
        description:
          allOf:
            - $ref: "#/components/schemas/KeychainLocalizedDescription"
        name:
          $ref: "#/components/schemas/KeychainLocalizedName"
      required:
        - name
      additionalProperties: false
    ConsumerKeychainPatch:
      type: object
      properties:
        description:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/KeychainLocalizedDescription"
        name:
          allOf:
            - $ref: "#/components/schemas/KeychainLocalizedName"
      additionalProperties: false
    KeychainKeySeed:
      type: object
      properties:
        encodedPem:
          type: string
        name:
          $ref: "#/components/schemas/KeychainKeyLocalizedName"
      required:
        - encodedPem
        - name
      additionalProperties: false
    KeychainKey:
      type: object
      properties:
        algorithm:
          $ref: "#/components/schemas/KeyAlgorithm"
        createdAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        encodedPem:
          type: string
        format:
          $ref: "#/components/schemas/KeyFormat"
        kid:
          $ref: "#/components/schemas/KeyId"
        name:
          $ref: "#/components/schemas/KeychainKeyLocalizedName"
        userId:
          $ref: "#/components/schemas/UserId"
      required:
        - algorithm
        - createdAt
        - encodedPem
        - format
        - kid
        - name
        - userId
      additionalProperties: false
    KeychainKeys:
      type: object
      properties:
        pagination:
          $ref: "#/components/schemas/Pagination"
        results:
          type: array
          items:
            $ref: "#/components/schemas/KeychainKey"
      required:
        - pagination
        - results
      additionalProperties: false
    User:
      type: object
      properties:
        email:
          type: string
        id:
          $ref: "#/components/schemas/UserId"
        username:
          type: string
      required:
        - email
        - id
        - username
      additionalProperties: false
    KeychainMemberSeed:
      type: object
      properties:
        userId:
          $ref: "#/components/schemas/UserId"
      required:
        - userId
      additionalProperties: false
    ConsumerKeychainLinkedPurpose:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        knodeId:
          $ref: "#/components/schemas/KnodeId"
      required:
        - id
        - knodeId
      additionalProperties: false
    ConsumerKeychainPurpose:
      type: object
      properties:
        consumerKeychainId:
          $ref: "#/components/schemas/KeychainId"
        linkedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        purpose:
          $ref: "#/components/schemas/ConsumerKeychainLinkedPurpose"
      required:
        - consumerKeychainId
        - linkedAt
        - purpose
      additionalProperties: false
    ConsumerKeychainPurposes:
      type: object
      properties:
        pagination:
          $ref: "#/components/schemas/Pagination"
        results:
          type: array
          items:
            $ref: "#/components/schemas/ConsumerKeychainPurpose"
      required:
        - pagination
        - results
      additionalProperties: false
    KeychainMembers:
      type: object
      properties:
        pagination:
          $ref: "#/components/schemas/Pagination"
        results:
          type: array
          items:
            $ref: "#/components/schemas/User"
      required:
        - pagination
        - results
      additionalProperties: false
paths:
  /status:
    get:
      operationId: getStatus
      tags:
        - health
      description: Check the health status of the service
      security: []
      responses:
        "200":
          description: Service status OK
          content:
            application/problem+json:
              schema:
                description: Service status OK
                allOf:
                  - $ref: "#/components/schemas/Problem"
  /consumerKeychains:
    get:
      operationId: getConsumerKeychains
      tags:
        - consumerKeychain
      description: Retrieve a list of Consumer Keychains
      parameters:
        - schema:
            format: int32
            type: number
            minimum: 1
            maximum: 50
          in: query
          name: limit
          required: true
          description: Maximum number of items returned
        - schema:
            format: int32
            type: number
            minimum: 0
          in: query
          name: offset
          required: true
          description: Pagination starting position
        - schema:
            type: string
          in: query
          name: name
          required: false
          description: Filter by Consumer Keychain name
        - schema:
            allOf:
              - $ref: "#/components/schemas/OrganizationId"
          in: query
          name: ownerId
          required: false
          description: Filter by owner Organization ID
        - schema:
            type: string
          in: query
          name: purpose
          required: false
          description: "Filter by Knode ID and Purpose ID. Format: {KnodeId}:{PurposeId}
            (e.g. Orion:00000000-0000-0000-0000-000000000000)"
        - schema:
            allOf:
              - $ref: "#/components/schemas/CorrelationId"
          in: header
          name: x-correlation-id
          required: true
          description: Unique identifier of the request
      responses:
        "200":
          description: Consumer keychains retrieved successfully
          content:
            application/json:
              schema:
                description: Consumer keychains retrieved successfully
                allOf:
                  - $ref: "#/components/schemas/Keychains"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                description: Bad Request
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                description: Unauthorized
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                description: Forbidden
                allOf:
                  - $ref: "#/components/schemas/Problem"
    post:
      operationId: createConsumerKeychain
      tags:
        - consumerKeychain
      description: Create a new Consumer Keychain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsumerKeychainSeed"
      parameters:
        - schema:
            allOf:
              - $ref: "#/components/schemas/CorrelationId"
          in: header
          name: x-correlation-id
          required: true
          description: Unique identifier of the request
      responses:
        "201":
          description: Consumer Keychain created successfully
          content:
            application/json:
              schema:
                description: Consumer Keychain created successfully
                allOf:
                  - $ref: "#/components/schemas/Keychain"
          headers:
            metadata-version:
              required: true
              schema:
                type: string
              description: Metadata version of the resource
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                description: Bad Request
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                description: Unauthorized
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                description: Forbidden
                allOf:
                  - $ref: "#/components/schemas/Problem"
  /consumerKeychains/{consumerKeychainId}:
    get:
      operationId: getConsumerKeychain
      tags:
        - consumerKeychain
      description: Retrieve a Consumer Keychain by its ID
      parameters:
        - schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: path
          name: consumerKeychainId
          required: true
        - schema:
            allOf:
              - $ref: "#/components/schemas/CorrelationId"
          in: header
          name: x-correlation-id
          required: true
          description: Unique identifier of the request
      responses:
        "200":
          description: Consumer Keychain retrieved successfully
          content:
            application/json:
              schema:
                description: Consumer Keychain retrieved successfully
                allOf:
                  - $ref: "#/components/schemas/Keychain"
          headers:
            metadata-version:
              required: true
              schema:
                type: string
              description: Metadata version of the resource
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                description: Bad Request
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                description: Unauthorized
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                description: Forbidden
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "404":
          description: Consumer Keychain not found
          content:
            application/problem+json:
              schema:
                description: Consumer Keychain not found
                allOf:
                  - $ref: "#/components/schemas/Problem"
    patch:
      operationId: updateConsumerKeychain
      tags:
        - consumerKeychain
      description: Update a Consumer Keychain
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/ConsumerKeychainPatch"
      parameters:
        - schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: path
          name: consumerKeychainId
          required: true
        - schema:
            allOf:
              - $ref: "#/components/schemas/CorrelationId"
          in: header
          name: x-correlation-id
          required: true
          description: Unique identifier of the request
      responses:
        "200":
          description: Consumer Keychain updated successfully
          content:
            application/json:
              schema:
                description: Consumer Keychain updated successfully
                allOf:
                  - $ref: "#/components/schemas/Keychain"
          headers:
            metadata-version:
              required: true
              schema:
                type: string
              description: Metadata version of the resource
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                description: Bad Request
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                description: Unauthorized
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                description: Forbidden
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "404":
          description: Consumer Keychain not found
          content:
            application/problem+json:
              schema:
                description: Consumer Keychain not found
                allOf:
                  - $ref: "#/components/schemas/Problem"
    delete:
      operationId: deleteConsumerKeychain
      tags:
        - consumerKeychain
      description: Delete a Consumer Keychain
      parameters:
        - schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: path
          name: consumerKeychainId
          required: true
        - schema:
            allOf:
              - $ref: "#/components/schemas/CorrelationId"
          in: header
          name: x-correlation-id
          required: true
          description: Unique identifier of the request
      responses:
        "204":
          description: Consumer Keychain deleted successfully
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                description: Bad Request
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                description: Unauthorized
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                description: Forbidden
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "404":
          description: Consumer Keychain not found
          content:
            application/problem+json:
              schema:
                description: Consumer Keychain not found
                allOf:
                  - $ref: "#/components/schemas/Problem"
  /consumerKeychains/{consumerKeychainId}/keys:
    get:
      operationId: getConsumerKeychainKeys
      tags:
        - consumerKeychain
      description: Retrieve keys of a Consumer Keychain
      parameters:
        - schema:
            format: int32
            type: number
            minimum: 1
            maximum: 50
          in: query
          name: limit
          required: true
          description: Maximum number of items returned
        - schema:
            format: int32
            type: number
            minimum: 0
          in: query
          name: offset
          required: true
          description: Pagination starting position
        - schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: path
          name: consumerKeychainId
          required: true
        - schema:
            allOf:
              - $ref: "#/components/schemas/CorrelationId"
          in: header
          name: x-correlation-id
          required: true
          description: Unique identifier of the request
      responses:
        "200":
          description: Consumer Keychain keys retrieved successfully
          content:
            application/json:
              schema:
                description: Consumer Keychain keys retrieved successfully
                allOf:
                  - $ref: "#/components/schemas/KeychainKeys"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                description: Bad Request
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                description: Unauthorized
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                description: Forbidden
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "404":
          description: Consumer Keychain not found
          content:
            application/problem+json:
              schema:
                description: Consumer Keychain not found
                allOf:
                  - $ref: "#/components/schemas/Problem"
    post:
      operationId: uploadConsumerKeychainKey
      tags:
        - consumerKeychain
      description: Upload a key to a Consumer Keychain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeychainKeySeed"
      parameters:
        - schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: path
          name: consumerKeychainId
          required: true
        - schema:
            allOf:
              - $ref: "#/components/schemas/CorrelationId"
          in: header
          name: x-correlation-id
          required: true
          description: Unique identifier of the request
      responses:
        "201":
          description: Consumer Keychain Key uploaded successfully
          content:
            application/json:
              schema:
                description: Consumer Keychain Key uploaded successfully
                allOf:
                  - $ref: "#/components/schemas/KeychainKey"
          headers:
            metadata-version:
              required: true
              schema:
                type: string
              description: Metadata version of the resource
        "400":
