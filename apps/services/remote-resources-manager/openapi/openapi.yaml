openapi: 3.0.4
info:
  contact:
    url: https://github.com/pagopa/knodia/issues
  termsOfService: https://knodia.org/
  description: Knodia remote-resources-manager API
  title: Knodia Remote Resources Manager API
  version: 1.0.0
components:
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: A JWT bearer token conforming to the best practices defined in RFC
        8725 (https://www.rfc-editor.org/rfc/rfc8725.html)
      scheme: bearer
      type: http
  schemas:
    ProblemError:
      type: object
      properties:
        code:
          description: Internal code of the error
          example: 123-4567
          pattern: ^[0-9]{3}-[0-9]{4}$
          type: string
          minLength: 8
          maxLength: 8
        detail:
          description: A human readable explanation specific to this occurrence of the
            problem
          example: Parameter not valid
          pattern: ^.{0,1024}$
          type: string
          maxLength: 4096
      required:
        - code
        - detail
      additionalProperties: false
    CorrelationId:
      type: string
      format: uuid
      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
    Problem:
      type: object
      properties:
        correlationId:
          description: Unique identifier of the request
          example: 53af4f2d-0c87-41ef-a645-b726a821852b
          allOf:
            - $ref: "#/components/schemas/CorrelationId"
        errors:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/ProblemError"
        status:
          description: The HTTP status code generated by the origin server for this
            occurrence of the problem
          example: 404
          exclusiveMaximum: true
          format: int32
          type: number
          minimum: 100
          maximum: 600
        title:
          description: A short, summary of the problem type. Written in english and readable
          example: Service Unavailable
          pattern: ^[ -~]{0,64}$
          type: string
          maxLength: 64
      required:
        - correlationId
        - status
        - title
      additionalProperties: false
    KnodeId:
      description: Unique Knode identifier
      type: string
      enum:
        - Orion
        - Lynx
    AgreementState:
      type: string
      enum:
        - Active
        - Suspended
        - Archived
    AgreementConsumer:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        knodeId:
          $ref: "#/components/schemas/KnodeId"
      required:
        - id
        - knodeId
      additionalProperties: false
    Attribute:
      type: object
      properties:
        code:
          type: string
        scheme:
          type: string
      required:
        - code
        - scheme
      additionalProperties: false
    Pagination:
      type: object
      properties:
        limit:
          format: int32
          type: number
          minimum: 1
          maximum: 50
        offset:
          format: int32
          type: number
          minimum: 0
        total:
          format: int32
          type: number
          minimum: 0
      required:
        - limit
        - offset
        - total
      additionalProperties: false
    FileDownload:
      description: Binary file content
      format: binary
      type: string
    OrganizationId:
      description: Unique identifier of the Organization
      type: string
      format: uuid
      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
    AgreementSeed:
      description: Seed data to create a new agreement
      type: object
      properties:
        consumerId:
          $ref: "#/components/schemas/OrganizationId"
        eserviceId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        eserviceVersionId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        knodeId:
          $ref: "#/components/schemas/KnodeId"
      required:
        - consumerId
        - eserviceId
        - eserviceVersionId
        - knodeId
      additionalProperties: false
    CreatedAgreementResource:
      description: Unique identifier of the created Agreement resource along with the
        E-service Producer ID
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        producerId:
          $ref: "#/components/schemas/OrganizationId"
      required:
        - id
        - producerId
      additionalProperties: false
    Agreement:
      description: Agreement between a Consumer and a Producer for an E-service
      type: object
      properties:
        attributes:
          description: Describes the Attributes of the E-service that the Consumer
            possesses when the Agreement is activated (must satisfy at least one
            Attribute for each Required Attribute Group defined by the
            E-service)
          type: array
          items:
            $ref: "#/components/schemas/Attribute"
        consumer:
          $ref: "#/components/schemas/AgreementConsumer"
        eserviceId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        eserviceVersionId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        producerId:
          $ref: "#/components/schemas/OrganizationId"
        state:
          $ref: "#/components/schemas/AgreementState"
        updatedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
      required:
        - attributes
        - consumer
        - eserviceId
        - eserviceVersionId
        - id
        - producerId
        - state
        - updatedAt
      additionalProperties: false
    Agreements:
      type: object
      properties:
        pagination:
          $ref: "#/components/schemas/Pagination"
        results:
          type: array
          items:
            $ref: "#/components/schemas/Agreement"
      required:
        - pagination
        - results
      additionalProperties: false
    EserviceVersionState:
      type: string
      enum:
        - Active
        - Suspended
        - Archived
    LocalizedName:
      description: Name of the E-service
      type: object
      properties:
        en:
          type: string
          minLength: 5
          maxLength: 60
      required:
        - en
      additionalProperties: false
    LocalizedDescription:
      description: Description of the E-service
      type: object
      properties:
        en:
          type: string
          minLength: 10
          maxLength: 250
      required:
        - en
      additionalProperties: false
    EserviceMode:
      type: string
      enum:
        - ProvideData
        - ReceiveData
    EserviceCategory:
      type: object
      properties:
        code:
          type: string
        scheme:
          type: string
      required:
        - code
        - scheme
      additionalProperties: false
    AccessTokenType:
      type: string
      enum:
        - Bearer
        - DPoP
    GetCatalogEserviceSearchParams:
      anyOf:
        - type: object
          properties:
            category:
              $ref: "#/components/schemas/EserviceCategory"
            knodeId:
              $ref: "#/components/schemas/KnodeId"
          required:
            - category
            - knodeId
          additionalProperties: false
        - type: object
          properties:
            keywords:
              type: string
              minLength: 1
            knodeId:
              $ref: "#/components/schemas/KnodeId"
          required:
            - keywords
            - knodeId
          additionalProperties: false
        - type: object
          properties:
            category:
              $ref: "#/components/schemas/EserviceCategory"
            keywords:
              type: string
              minLength: 1
            knodeId:
              $ref: "#/components/schemas/KnodeId"
          required:
            - category
            - keywords
            - knodeId
          additionalProperties: false
    CatalogEserviceSearchResultProducer:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        name:
          type: string
      required:
        - id
        - name
      additionalProperties: false
    CatalogEserviceSearchResult:
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/EserviceCategory"
        description:
          $ref: "#/components/schemas/LocalizedDescription"
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        latestVersionRequiredAttributes:
          type: array
          items:
            type: array
            items:
              $ref: "#/components/schemas/Attribute"
        latestVersionState:
          $ref: "#/components/schemas/EserviceVersionState"
        mode:
          $ref: "#/components/schemas/EserviceMode"
        name:
          $ref: "#/components/schemas/LocalizedName"
        producer:
          $ref: "#/components/schemas/CatalogEserviceSearchResultProducer"
        updatedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
      required:
        - categories
        - description
        - id
        - latestVersionRequiredAttributes
        - latestVersionState
        - mode
        - name
        - producer
        - updatedAt
      additionalProperties: false
    CatalogEserviceSearchResults:
      type: object
      properties:
        pagination:
          $ref: "#/components/schemas/Pagination"
        results:
          type: array
          items:
            $ref: "#/components/schemas/CatalogEserviceSearchResult"
      required:
        - pagination
        - results
      additionalProperties: false
    EserviceId:
      description: Unique identifier of the E-Service
      type: string
      format: uuid
      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
    EserviceDetailsLatestVersion:
      type: object
      properties:
        accessTokenAudience:
          type: array
          items:
            type: string
        accessTokenDuration:
          format: int32
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        accessTokenType:
          $ref: "#/components/schemas/AccessTokenType"
        maxDailyCallsPerConsumer:
          format: int32
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        maxDailyCallsPerKnode:
          format: int32
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        requiredAttributes:
          type: array
          items:
            type: array
            items:
              $ref: "#/components/schemas/Attribute"
        state:
          $ref: "#/components/schemas/EserviceVersionState"
      required:
        - accessTokenAudience
        - accessTokenDuration
        - accessTokenType
        - maxDailyCallsPerConsumer
        - maxDailyCallsPerKnode
        - requiredAttributes
        - state
      additionalProperties: false
    EserviceDetailsInterfaceDocument:
      type: object
      properties:
        checksum:
          type: string
        name:
          type: string
        prettyName:
          $ref: "#/components/schemas/LocalizedName"
      required:
        - checksum
        - name
        - prettyName
      additionalProperties: false
    EserviceDetailsProducer:
      type: object
      properties:
        email:
          type: string
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        knodeName:
          type: string
        name:
          $ref: "#/components/schemas/LocalizedName"
        notes:
          type: string
      required:
        - email
        - id
        - knodeName
        - name
        - notes
      additionalProperties: false
    EserviceDetails:
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/EserviceCategory"
        description:
          $ref: "#/components/schemas/LocalizedDescription"
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        interfaceDocument:
          $ref: "#/components/schemas/EserviceDetailsInterfaceDocument"
        isConsumerOperatorIdentificationRequired:
          type: boolean
        isSignalHubEnabled:
          type: boolean
        latestVersion:
          $ref: "#/components/schemas/EserviceDetailsLatestVersion"
        mode:
          $ref: "#/components/schemas/EserviceMode"
        name:
          $ref: "#/components/schemas/LocalizedName"
        producer:
          $ref: "#/components/schemas/EserviceDetailsProducer"
      required:
        - categories
        - description
        - id
        - interfaceDocument
        - isConsumerOperatorIdentificationRequired
        - isSignalHubEnabled
        - latestVersion
        - mode
        - name
        - producer
      additionalProperties: false
paths:
  /status:
    get:
      operationId: getStatus
      tags:
        - health
      description: Check the health status of the service
      security: []
      responses:
        "200":
          description: Service status OK
          content:
            application/problem+json:
              schema:
                description: Service status OK
                allOf:
                  - $ref: "#/components/schemas/Problem"
  /catalog:
    post:
      operationId: getCatalogEservices
      summary: Search for E-services
      tags:
        - eservice
      description: Search for E-services according to search criteria and considering
        only E-services with an active or suspended Version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetCatalogEserviceSearchParams"
      parameters:
        - schema:
            format: int32
            type: number
            minimum: 1
            maximum: 50
          in: query
          name: limit
          required: true
          description: Maximum number of items returned
        - schema:
            format: int32
            type: number
            minimum: 0
          in: query
          name: offset
          required: true
          description: Pagination starting position
      responses:
        "200":
          description: E-service search results retrieved (sorted by most recently updated
            first)
          content:
            application/json:
              schema:
                description: E-service search results retrieved (sorted by most recently updated
                  first)
                allOf:
                  - $ref: "#/components/schemas/CatalogEserviceSearchResults"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                description: Bad Request
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                description: Unauthorized
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                description: Forbidden
                allOf:
                  - $ref: "#/components/schemas/Problem"
  /eservices/{eserviceId}:
    get:
      operationId: getEserviceDetails
      summary: Get E-service detail
      tags:
        - eservice
      description: Retrieve an E-service with all its details
      parameters:
        - schema:
            $ref: "#/components/schemas/KnodeId"
          in: query
          name: knodeId
          required: true
        - schema:
            $ref: "#/components/schemas/EserviceId"
          in: path
          name: eserviceId
          required: true
      responses:
        "200":
          description: E-service detail retrieved successfully
          content:
            application/json:
              schema:
                description: E-service detail retrieved successfully
                allOf:
                  - $ref: "#/components/schemas/EserviceDetails"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                description: Bad Request
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                description: Unauthorized
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                description: Forbidden
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "404":
          description: E-service not found
          content:
            application/problem+json:
              schema:
                description: E-service not found
                allOf:
                  - $ref: "#/components/schemas/Problem"
  /eservices/{eserviceId}/interface:
    get:
      operationId: downloadEserviceLatestVersionInterface
      summary: Download E-service latest version interface
      tags:
        - eservice
      description: Download the interface document for the latest version of an E-service
      parameters:
        - schema:
            $ref: "#/components/schemas/KnodeId"
          in: query
          name: knodeId
          required: true
        - schema:
            $ref: "#/components/schemas/EserviceId"
          in: path
          name: eserviceId
          required: true
      responses:
        "200":
          description: E-service interface document downloaded successfully
          content:
            application/json: &a1
              schema:
                description: E-service interface document downloaded successfully
                format: binary
                allOf:
                  - $ref: "#/components/schemas/FileDownload"
            application/yaml: *a1
            application/x-yaml: *a1
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                description: Bad Request
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                description: Unauthorized
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                description: Forbidden
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                description: Not Found
                allOf:
                  - $ref: "#/components/schemas/Problem"
  /agreements:
    post:
      operationId: createAgreement
      tags:
        - agreement
      description: Create a new Agreement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgreementSeed"
      responses:
        "201":
          description: Agreement created successfully
          content:
            application/json:
              schema:
                description: Agreement created successfully
                allOf:
                  - $ref: "#/components/schemas/CreatedAgreementResource"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                description: Bad Request
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                description: Unauthorized
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                description: Forbidden
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                description: Not Found
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "409":
          description: Conflict
          content:
            application/problem+json:
              schema:
                description: Conflict
                allOf:
                  - $ref: "#/components/schemas/Problem"
    get:
      operationId: getAgreements
      tags:
        - agreement
      description: Retrieve a list of Agreements
      parameters:
        - schema:
            format: int32
            type: number
            minimum: 1
            maximum: 50
          in: query
          name: limit
          required: true
          description: Maximum number of items returned
        - schema:
            format: int32
            type: number
            minimum: 0
          in: query
          name: offset
          required: true
          description: Pagination starting position
        - schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: query
          name: consumerId
          required: false
          description: Filter by Consumer ID
        - schema:
            allOf:
              - $ref: "#/components/schemas/AgreementState"
          in: query
          name: state
          required: false
          description: Filter by Agreement State
      responses:
        "200":
          description: Agreements retrieved successfully
          content:
            application/json:
              schema:
                description: Agreements retrieved successfully
                allOf:
                  - $ref: "#/components/schemas/Agreements"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                description: Bad Request
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                description: Unauthorized
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                description: Forbidden
                allOf:
                  - $ref: "#/components/schemas/Problem"
servers:
  - description: Remote Resources Manager API
    url: /
security:
  - bearerAuth: []
