openapi: 3.0.4
info:
  contact:
    url: https://github.com/pagopa/knodia/issues
  termsOfService: https://knodia.org/
  description: Knodia remote-resources-manager API
  title: Knodia Remote Resources Manager API
  version: 1.0.0
components:
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: A JWT bearer token conforming to the best practices defined in RFC
        8725 (https://www.rfc-editor.org/rfc/rfc8725.html)
      scheme: bearer
      type: http
  schemas:
    ProblemError:
      type: object
      properties:
        code:
          description: Internal code of the error
          example: 123-4567
          pattern: ^[0-9]{3}-[0-9]{4,5}$
          type: string
          minLength: 8
          maxLength: 9
        detail:
          description: A human readable explanation specific to this occurrence of the
            problem
          example: Parameter not valid
          pattern: ^.{0,1024}$
          type: string
          maxLength: 4096
      required:
        - code
        - detail
      additionalProperties: false
    CorrelationId:
      type: string
      format: uuid
      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
    Problem:
      type: object
      properties:
        correlationId:
          description: Unique identifier of the request
          example: 53af4f2d-0c87-41ef-a645-b726a821852b
          allOf:
            - $ref: "#/components/schemas/CorrelationId"
        errors:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/ProblemError"
        status:
          description: The HTTP status code generated by the origin server for this
            occurrence of the problem
          example: 404
          exclusiveMaximum: true
          format: int32
          type: number
          minimum: 100
          maximum: 600
        title:
          description: A short, summary of the problem type. Written in english and readable
          example: Service Unavailable
          pattern: ^[ -~]{0,64}$
          type: string
          maxLength: 64
      required:
        - correlationId
        - status
        - title
      additionalProperties: false
    KnodeId:
      description: Unique Knode identifier
      type: string
      enum:
        - Orion
        - Lynx
    AgreementState:
      type: string
      enum:
        - Active
        - Suspended
        - Archived
        - PendingConsumerOperatorIdentification
    AgreementConsumer:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        knodeId:
          $ref: "#/components/schemas/KnodeId"
      required:
        - id
        - knodeId
      additionalProperties: false
    MagicLink:
      description: A signed, single-action link a Consumer user can follow to perform
        an action on the Producer Knode's frontend
      type: object
      properties:
        expiresAt:
          description: ISO 8601 timestamp after which the magic link is no longer valid
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        url:
          description: Absolute URL of the target Knode's frontend, carrying a signed
            token for the action
          type: string
          format: uri
      required:
        - expiresAt
        - url
      additionalProperties: false
    Attribute:
      type: object
      properties:
        code:
          type: string
        scheme:
          type: string
      required:
        - code
        - scheme
      additionalProperties: false
    Pagination:
      type: object
      properties:
        limit:
          format: int32
          type: number
          minimum: 1
          maximum: 50
        offset:
          format: int32
          type: number
          minimum: 0
        total:
          format: int32
          type: number
          minimum: 0
      required:
        - limit
        - offset
        - total
      additionalProperties: false
    FileDownload:
      description: Binary file content
      format: binary
      type: string
    OrganizationId:
      description: Unique identifier of the Organization
      type: string
      format: uuid
      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
    CreatedResource:
      description: Unique identifier of the created resource
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
      required:
        - id
      additionalProperties: false
    AgreementSeed:
      description: Seed data to create a new Agreement
      type: object
      properties:
        eserviceId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        eserviceVersionId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        knodeId:
          $ref: "#/components/schemas/KnodeId"
      required:
        - eserviceId
        - eserviceVersionId
        - knodeId
      additionalProperties: false
    CreatedAgreementResource:
      description: Unique identifier of the created Agreement resource along with the
        E-service Producer ID and owning Knode
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        knodeId:
          description: Knode ID of the producer's Knode that owns this Agreement
          allOf:
            - $ref: "#/components/schemas/KnodeId"
        producerId:
          $ref: "#/components/schemas/OrganizationId"
      required:
        - id
        - knodeId
        - producerId
      additionalProperties: false
    Agreement:
      description: Agreement between a Consumer and a Producer for an E-service
      type: object
      properties:
        attributes:
          description: Describes the Attributes of the E-service that the Consumer
            possesses when the Agreement is activated (must satisfy at least one
            Attribute for each Required Attribute Group defined by the
            E-service)
          type: array
          items:
            $ref: "#/components/schemas/Attribute"
        consumer:
          $ref: "#/components/schemas/AgreementConsumer"
        eserviceId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        eserviceVersionId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        knodeId:
          description: Knode ID of the producer's Knode that owns this Agreement
          allOf:
            - $ref: "#/components/schemas/KnodeId"
        producerId:
          $ref: "#/components/schemas/OrganizationId"
        state:
          $ref: "#/components/schemas/AgreementState"
        suspendedByConsumerAt:
          description: Timestamp when the Agreement was suspended by the Consumer
          nullable: true
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        suspendedByProducerAt:
          description: Timestamp when the Agreement was suspended by the Producer
          nullable: true
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        updatedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
      required:
        - attributes
        - consumer
        - eserviceId
        - eserviceVersionId
        - id
        - knodeId
        - producerId
        - state
        - suspendedByConsumerAt
        - suspendedByProducerAt
        - updatedAt
      additionalProperties: false
    Agreements:
      type: object
      properties:
        pagination:
          $ref: "#/components/schemas/Pagination"
        results:
          type: array
          items:
            $ref: "#/components/schemas/Agreement"
      required:
        - pagination
        - results
      additionalProperties: false
    EserviceVersionState:
      type: string
      enum:
        - Active
        - Suspended
        - Archived
    LocalizedName:
      description: Name of the E-service
      type: object
      properties:
        en:
          type: string
          minLength: 5
          maxLength: 60
      required:
        - en
      additionalProperties: false
    LocalizedDescription:
      description: Description of the E-service
      type: object
      properties:
        en:
          type: string
          minLength: 10
          maxLength: 250
      required:
        - en
      additionalProperties: false
    EserviceMode:
      type: string
      enum:
        - ProvideData
        - ReceiveData
    EserviceCategory:
      type: object
      properties:
        code:
          type: string
        scheme:
          type: string
      required:
        - code
        - scheme
      additionalProperties: false
    AccessTokenType:
      type: string
      enum:
        - Bearer
        - DPoP
    CompactProducer:
      description: Producer Organization with id and name; omits knodeId since it is
        always known from the resource this is embedded in
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        name:
          type: string
          minLength: 1
      required:
        - id
        - name
      additionalProperties: false
    GetCatalogEserviceSearchParams:
      anyOf:
        - type: object
          properties:
            category:
              $ref: "#/components/schemas/EserviceCategory"
            knodeId:
              $ref: "#/components/schemas/KnodeId"
          required:
            - category
            - knodeId
          additionalProperties: false
        - type: object
          properties:
            keywords:
              type: string
              minLength: 1
            knodeId:
              $ref: "#/components/schemas/KnodeId"
          required:
            - keywords
            - knodeId
          additionalProperties: false
        - type: object
          properties:
            category:
              $ref: "#/components/schemas/EserviceCategory"
            keywords:
              type: string
              minLength: 1
            knodeId:
              $ref: "#/components/schemas/KnodeId"
          required:
            - category
            - keywords
            - knodeId
          additionalProperties: false
    CatalogEserviceSearchResult:
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/EserviceCategory"
        description:
          $ref: "#/components/schemas/LocalizedDescription"
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        knodeId:
          description: Knode ID of the producer's Knode that owns this E-service
          allOf:
            - $ref: "#/components/schemas/KnodeId"
        latestVersionRequiredAttributes:
          type: array
          items:
            type: array
            items:
              $ref: "#/components/schemas/Attribute"
        latestVersionState:
          $ref: "#/components/schemas/EserviceVersionState"
        mode:
          $ref: "#/components/schemas/EserviceMode"
        name:
          $ref: "#/components/schemas/LocalizedName"
        producer:
          $ref: "#/components/schemas/CompactProducer"
        updatedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
      required:
        - categories
        - description
        - id
        - knodeId
        - latestVersionRequiredAttributes
        - latestVersionState
        - mode
        - name
        - producer
        - updatedAt
      additionalProperties: false
    CatalogEserviceSearchResults:
      type: object
      properties:
        pagination:
          $ref: "#/components/schemas/Pagination"
        results:
          type: array
          items:
            $ref: "#/components/schemas/CatalogEserviceSearchResult"
      required:
        - pagination
        - results
      additionalProperties: false
    EserviceId:
      description: Unique identifier of the E-Service
      type: string
      format: uuid
      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
    EserviceVersionDetails:
      type: object
      properties:
        accessTokenAudience:
          type: array
          items:
            type: string
        accessTokenDuration:
          format: int32
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        accessTokenType:
          $ref: "#/components/schemas/AccessTokenType"
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        maxDailyCallsPerConsumer:
          format: int32
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        maxDailyCallsPerKnode:
          format: int32
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        requiredAttributes:
          type: array
          items:
            type: array
            items:
              $ref: "#/components/schemas/Attribute"
        state:
          $ref: "#/components/schemas/EserviceVersionState"
        updatedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
      required:
        - accessTokenAudience
        - accessTokenDuration
        - accessTokenType
        - id
        - maxDailyCallsPerConsumer
        - maxDailyCallsPerKnode
        - requiredAttributes
        - state
        - updatedAt
      additionalProperties: false
    EserviceDetailsInterfaceDocument:
      type: object
      properties:
        checksum:
          type: string
        name:
          type: string
        prettyName:
          $ref: "#/components/schemas/LocalizedName"
      required:
        - checksum
        - name
        - prettyName
      additionalProperties: false
    EserviceDetailsProducer:
      type: object
      properties:
        email:
          type: string
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        name:
          type: string
        notes:
          type: string
      required:
        - email
        - id
        - name
        - notes
      additionalProperties: false
    EserviceAgreementDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        state:
          $ref: "#/components/schemas/AgreementState"
        suspendedByConsumerAt:
          description: Timestamp when the Agreement was suspended by the Consumer
          nullable: true
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        suspendedByProducerAt:
          description: Timestamp when the Agreement was suspended by the Producer
          nullable: true
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        updatedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
      required:
        - id
        - state
        - suspendedByConsumerAt
        - suspendedByProducerAt
        - updatedAt
      additionalProperties: false
    EserviceDetails:
      type: object
      properties:
        agreement:
          allOf:
            - $ref: "#/components/schemas/EserviceAgreementDetail"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/EserviceCategory"
        description:
          $ref: "#/components/schemas/LocalizedDescription"
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        interfaceDocument:
          $ref: "#/components/schemas/EserviceDetailsInterfaceDocument"
        isConsumerOperatorIdentificationRequired:
          type: boolean
        isSignalHubEnabled:
          type: boolean
        knodeId:
          description: Knode ID of the producer's Knode that owns this E-service
          allOf:
            - $ref: "#/components/schemas/KnodeId"
        latestVersion:
          $ref: "#/components/schemas/EserviceVersionDetails"
        mode:
          $ref: "#/components/schemas/EserviceMode"
        name:
          $ref: "#/components/schemas/LocalizedName"
        producer:
          $ref: "#/components/schemas/EserviceDetailsProducer"
        updatedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
      required:
        - categories
        - description
        - id
        - interfaceDocument
        - isConsumerOperatorIdentificationRequired
        - isSignalHubEnabled
        - knodeId
        - latestVersion
        - mode
        - name
        - producer
        - updatedAt
      additionalProperties: false
    EserviceVersion:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        requiredAttributes:
          type: array
          items:
            type: array
            items:
              $ref: "#/components/schemas/Attribute"
        state:
          $ref: "#/components/schemas/EserviceVersionState"
      required:
        - id
        - requiredAttributes
        - state
      additionalProperties: false
    Eservice:
      type: object
      properties:
        agreement:
          type: object
          properties:
            id:
              type: string
              format: uuid
              pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            state:
              $ref: "#/components/schemas/AgreementState"
            updatedAt:
              type: string
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
          required:
            - id
            - state
            - updatedAt
          additionalProperties: false
        categories:
          type: array
          items:
            $ref: "#/components/schemas/EserviceCategory"
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        knodeId:
          description: Knode ID of the producer's Knode that owns this E-service
          allOf:
            - $ref: "#/components/schemas/KnodeId"
        mode:
          $ref: "#/components/schemas/EserviceMode"
        name:
          $ref: "#/components/schemas/LocalizedName"
        producer:
          $ref: "#/components/schemas/CompactProducer"
        updatedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        version:
          $ref: "#/components/schemas/EserviceVersion"
      required:
        - agreement
        - categories
        - id
        - knodeId
        - mode
        - name
        - producer
        - updatedAt
        - version
      additionalProperties: false
    Eservices:
      type: object
      properties:
        pagination:
          $ref: "#/components/schemas/Pagination"
        results:
          type: array
          items:
            $ref: "#/components/schemas/Eservice"
      required:
        - pagination
        - results
      additionalProperties: false
    Organization:
      type: object
      properties:
        attributes:
          type: array
          items:
            $ref: "#/components/schemas/Attribute"
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        knodeId:
          description: Knode ID of the Knode this Organization belongs to
          allOf:
            - $ref: "#/components/schemas/KnodeId"
        name:
          type: string
      required:
        - attributes
        - id
        - knodeId
        - name
      additionalProperties: false
    Organizations:
      type: object
      properties:
        pagination:
          $ref: "#/components/schemas/Pagination"
        results:
          type: array
          items:
            $ref: "#/components/schemas/Organization"
      required:
        - pagination
        - results
      additionalProperties: false
    PurposeState:
      type: string
      enum:
        - Active
        - Suspended
        - Archived
    PurposeConsumer:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        knodeId:
          $ref: "#/components/schemas/KnodeId"
      required:
        - id
        - knodeId
      additionalProperties: false
    PurposeTemplateReference:
      description: Reference to a Purpose statement template
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        knodeId:
          $ref: "#/components/schemas/KnodeId"
      required:
        - id
        - knodeId
      additionalProperties: false
    LocalizedPurposeName:
      description: Name of the Purpose
      type: object
      properties:
        en:
          type: string
          minLength: 5
          maxLength: 60
      required:
        - en
      additionalProperties: false
    LocalizedPurposeDescription:
      description: Description of the Purpose
      type: object
      properties:
        en:
          type: string
          minLength: 10
          maxLength: 250
      required:
        - en
      additionalProperties: false
    PurposeFormAnswers:
      type: object
      additionalProperties: {}
    PurposeFormTexts:
      type: object
      properties:
        en:
          type: object
          additionalProperties:
            type: string
      required:
        - en
      additionalProperties: false
    PurposeFormUiTexts:
      type: object
      properties:
        en:
          type: object
          additionalProperties:
            type: string
      required:
        - en
      additionalProperties: false
    PurposeFormSchemasResponse:
      description: Current Purpose form schemas (JSON Schema + UI Schema + legal/UI
        texts) with their version identifier
      type: object
      properties:
        schema:
          type: object
          additionalProperties: {}
        texts:
          $ref: "#/components/schemas/PurposeFormTexts"
        uiSchema:
          type: object
          additionalProperties: {}
        uiTexts:
          $ref: "#/components/schemas/PurposeFormUiTexts"
        version:
          description: Version identifier for the Purpose form schema provided by the
            target Knode
          type: string
      required:
        - schema
        - texts
        - uiSchema
        - uiTexts
        - version
      additionalProperties: false
    PurposeSeed:
      description: Seed data to create a new Purpose
      type: object
      properties:
        dailyCalls:
          format: int32
          description: Expected number of daily API calls for this Purpose
          type: integer
          minimum: 0
          maximum: 1000000000
        description:
          $ref: "#/components/schemas/LocalizedPurposeDescription"
        eserviceId:
          description: Identifier of the E-service this Purpose refers to
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        formAnswersJson:
          $ref: "#/components/schemas/PurposeFormAnswers"
        formSchemaVersion:
          description: Version identifier for the Purpose form schema provided by the
            target Knode
          type: string
        knodeId:
          $ref: "#/components/schemas/KnodeId"
        name:
          $ref: "#/components/schemas/LocalizedPurposeName"
        template:
          allOf:
            - $ref: "#/components/schemas/PurposeTemplateReference"
      required:
        - dailyCalls
        - description
        - eserviceId
        - formAnswersJson
        - formSchemaVersion
        - knodeId
        - name
      additionalProperties: false
    CreatedPurposeResource:
      description: Unique identifier of the created Purpose resource
      allOf:
        - $ref: "#/components/schemas/CreatedResource"
    Purpose:
      type: object
      properties:
        consumer:
          $ref: "#/components/schemas/PurposeConsumer"
        dailyCalls:
          format: int32
          type: integer
          minimum: 0
          maximum: 1000000000
        description:
          $ref: "#/components/schemas/LocalizedPurposeDescription"
        eserviceId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        knodeId:
          description: Knode ID of the producer's Knode that owns this Purpose
          allOf:
            - $ref: "#/components/schemas/KnodeId"
        name:
          $ref: "#/components/schemas/LocalizedPurposeName"
        state:
          $ref: "#/components/schemas/PurposeState"
        suspendedByConsumerAt:
          description: Timestamp when the Purpose was suspended by the Consumer
          nullable: true
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        suspendedByProducerAt:
          description: Timestamp when the Purpose was suspended by the Producer
          nullable: true
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        template:
          allOf:
            - $ref: "#/components/schemas/PurposeTemplateReference"
        updatedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
      required:
        - consumer
        - dailyCalls
        - description
        - eserviceId
        - id
        - knodeId
        - name
        - state
        - suspendedByConsumerAt
        - suspendedByProducerAt
        - updatedAt
      additionalProperties: false
    Purposes:
      type: object
      properties:
        pagination:
          $ref: "#/components/schemas/Pagination"
        results:
          type: array
          items:
            $ref: "#/components/schemas/Purpose"
      required:
        - pagination
        - results
      additionalProperties: false
paths:
  /status:
    get:
      operationId: getStatus
      tags:
        - health
      description: Check the health status of the service
      security: []
      responses:
        "200":
          description: Service status OK
          content:
            application/problem+json:
              schema:
                description: Service status OK
                allOf:
                  - $ref: "#/components/schemas/Problem"
  /catalog:
    post:
      operationId: getCatalogEservices
      summary: Search for E-services
      tags:
        - eservice
      description: Search for E-services according to search criteria and considering
        only E-services with an active or suspended Version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetCatalogEserviceSearchParams"
      parameters:
        - schema:
            format: int32
            type: number
            minimum: 1
            maximum: 50
          in: query
          name: limit
          required: true
          description: Maximum number of items returned
        - schema:
            format: int32
            type: number
            minimum: 0
          in: query
          name: offset
          required: true
          description: Pagination starting position
      responses:
        "200":
          description: E-service search results retrieved (sorted by most recently updated
            first)
          content:
            application/json:
              schema:
                description: E-service search results retrieved (sorted by most recently updated
                  first)
                allOf:
                  - $ref: "#/components/schemas/CatalogEserviceSearchResults"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                description: Bad Request
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                description: Unauthorized
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                description: Forbidden
                allOf:
                  - $ref: "#/components/schemas/Problem"
  /eservices/{eserviceId}:
    get:
      operationId: getEserviceDetails
      summary: Get E-service detail
      tags:
        - eservice
      description: Retrieve an E-service with all its details
      parameters:
        - schema:
            $ref: "#/components/schemas/KnodeId"
          in: query
          name: knodeId
          required: true
        - schema:
            $ref: "#/components/schemas/EserviceId"
          in: path
          name: eserviceId
          required: true
      responses:
        "200":
          description: E-service detail retrieved successfully
          content:
            application/json:
              schema:
                description: E-service detail retrieved successfully
                allOf:
                  - $ref: "#/components/schemas/EserviceDetails"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                description: Bad Request
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                description: Unauthorized
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                description: Forbidden
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "404":
          description: E-service not found
          content:
            application/problem+json:
              schema:
                description: E-service not found
                allOf:
                  - $ref: "#/components/schemas/Problem"
  /eservices:
    get:
      operationId: getEservices
      summary: Get E-services
      tags:
        - eservice
      description: Retrieve E-services
      parameters:
        - schema:
            format: int32
            type: number
            minimum: 1
            maximum: 50
          in: query
          name: limit
          required: true
          description: Maximum number of items returned
        - schema:
            format: int32
            type: number
            minimum: 0
          in: query
          name: offset
          required: true
          description: Pagination starting position
        - schema:
            type: array
            items:
              $ref: "#/components/schemas/AgreementState"
          in: query
          name: agreementState
          required: false
          description: Filter by Agreement State
      responses:
        "200":
          description: E-services retrieved successfully
          content:
            application/json:
              schema:
                description: E-services retrieved successfully
                allOf:
                  - $ref: "#/components/schemas/Eservices"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                description: Bad Request
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                description: Unauthorized
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                description: Forbidden
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                description: Not Found
                allOf:
                  - $ref: "#/components/schemas/Problem"
  /eservices/{eserviceId}/interface:
    get:
      operationId: downloadEserviceLatestVersionInterface
      summary: Download E-service latest version interface
      tags:
        - eservice
      description: Download the interface document for the latest version of an E-service
      parameters:
        - schema:
            $ref: "#/components/schemas/KnodeId"
          in: query
          name: knodeId
          required: true
        - schema:
            $ref: "#/components/schemas/EserviceId"
          in: path
          name: eserviceId
          required: true
      responses:
        "200":
          description: E-service interface document downloaded successfully
          content:
            application/json: &a1
              schema:
                description: E-service interface document downloaded successfully
                format: binary
                allOf:
                  - $ref: "#/components/schemas/FileDownload"
            application/yaml: *a1
            application/x-yaml: *a1
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                description: Bad Request
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                description: Unauthorized
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                description: Forbidden
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                description: Not Found
                allOf:
                  - $ref: "#/components/schemas/Problem"
  /agreements:
    post:
      operationId: createAgreement
      summary: Create an Agreement
      tags:
        - agreement
      description: Create a new Agreement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgreementSeed"
      responses:
        "201":
          description: Agreement created successfully
          content:
            application/json:
              schema:
                description: Agreement created successfully
                allOf:
                  - $ref: "#/components/schemas/CreatedAgreementResource"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                description: Bad Request
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                description: Unauthorized
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                description: Forbidden
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                description: Not Found
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "409":
          description: Conflict
          content:
            application/problem+json:
              schema:
                description: Conflict
                allOf:
                  - $ref: "#/components/schemas/Problem"
    get:
      operationId: getAgreements
      summary: List Agreements
      tags:
        - agreement
      description: Retrieve a list of Agreements
      parameters:
        - schema:
            format: int32
            type: number
            minimum: 1
            maximum: 50
          in: query
          name: limit
          required: true
          description: Maximum number of items returned
        - schema:
            format: int32
            type: number
            minimum: 0
          in: query
          name: offset
          required: true
          description: Pagination starting position
        - schema:
            type: array
            items:
              $ref: "#/components/schemas/AgreementState"
          in: query
          name: state
          required: false
          description: Filter by Agreement State
      responses:
        "200":
          description: Agreements retrieved successfully
          content:
            application/json:
              schema:
                description: Agreements retrieved successfully
                allOf:
                  - $ref: "#/components/schemas/Agreements"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                description: Bad Request
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                description: Unauthorized
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                description: Forbidden
                allOf:
                  - $ref: "#/components/schemas/Problem"
  /agreements/{agreementId}/reactivate:
    post:
      operationId: reactivateAgreement
      summary: Reactivate an Agreement
      tags:
        - agreement
      description: Reactivate an Agreement on behalf of its Consumer; the Consumer
        must be the caller organization
      parameters:
        - schema:
            $ref: "#/components/schemas/KnodeId"
          in: query
          name: knodeId
          required: true
        - schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: path
          name: agreementId
          required: true
      responses:
        "200":
          description: Agreement reactivated successfully
          content:
            application/json:
              schema:
                description: Agreement reactivated successfully
                allOf:
                  - $ref: "#/components/schemas/Agreement"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                description: Bad Request
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                description: Unauthorized
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                description: Forbidden
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "404":
          description: Agreement not found
          content:
            application/problem+json:
              schema:
                description: Agreement not found
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "409":
          description: Conflict
          content:
            application/problem+json:
              schema:
                description: Conflict
                allOf:
                  - $ref: "#/components/schemas/Problem"
  /agreements/{agreementId}/suspend:
    post:
      operationId: suspendAgreement
      summary: Suspend an Agreement
      tags:
        - agreement
      description: Suspend an Agreement on behalf of its Consumer; the Consumer must
        be the caller organization
      parameters:
        - schema:
            $ref: "#/components/schemas/KnodeId"
          in: query
          name: knodeId
          required: true
        - schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: path
          name: agreementId
          required: true
      responses:
        "200":
          description: Agreement suspended successfully
          content:
            application/json:
              schema:
