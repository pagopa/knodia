openapi: 3.0.4
info:
  contact:
    url: https://github.com/pagopa/knodia/issues
  termsOfService: https://knodia.org/
  description: API for managing Knodia E-services
  title: Knodia E-service Process API
  version: 1.0.0
components:
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: A JWT bearer token conforming to the best practices defined in RFC
        8725 (https://www.rfc-editor.org/rfc/rfc8725.html)
      scheme: bearer
      type: http
  schemas:
    ProblemError:
      type: object
      properties:
        code:
          description: Internal code of the error
          example: 123-4567
          pattern: ^[0-9]{3}-[0-9]{4,5}$
          type: string
          minLength: 8
          maxLength: 9
        detail:
          description: A human readable explanation specific to this occurrence of the
            problem
          example: Parameter not valid
          pattern: ^.{0,1024}$
          type: string
          maxLength: 4096
      required:
        - code
        - detail
      additionalProperties: false
    CorrelationId:
      type: string
      format: uuid
      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
    Problem:
      type: object
      properties:
        correlationId:
          description: Unique identifier of the request
          example: 53af4f2d-0c87-41ef-a645-b726a821852b
          allOf:
            - $ref: "#/components/schemas/CorrelationId"
        errors:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/ProblemError"
        status:
          description: The HTTP status code generated by the origin server for this
            occurrence of the problem
          example: 404
          exclusiveMaximum: true
          format: int32
          type: number
          minimum: 100
          maximum: 600
        title:
          description: A short, summary of the problem type. Written in english and readable
          example: Service Unavailable
          pattern: ^[ -~]{0,64}$
          type: string
          maxLength: 64
      required:
        - correlationId
        - status
        - title
      additionalProperties: false
    KnodeId:
      description: Unique Knode identifier
      type: string
      enum:
        - Orion
        - Lynx
    EserviceVersionState:
      type: string
      enum:
        - Active
        - Suspended
        - Archived
    LocalizedName:
      description: Name of the E-service
      type: object
      properties:
        en:
          type: string
          minLength: 5
          maxLength: 60
      required:
        - en
      additionalProperties: false
    LocalizedDescription:
      description: Description of the E-service
      type: object
      properties:
        en:
          type: string
          minLength: 10
          maxLength: 250
      required:
        - en
      additionalProperties: false
    LocalizedInterfacePrettyName:
      description: Pretty name of the E-service interface document
      type: object
      properties:
        en:
          type: string
          minLength: 5
          maxLength: 60
      required:
        - en
      additionalProperties: false
    EserviceMode:
      type: string
      enum:
        - ProvideData
        - ReceiveData
    EserviceCategory:
      type: object
      properties:
        code:
          type: string
        scheme:
          type: string
      required:
        - code
        - scheme
      additionalProperties: false
    AccessTokenType:
      type: string
      enum:
        - Bearer
        - DPoP
    EserviceTemplateId:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        knodeId:
          $ref: "#/components/schemas/KnodeId"
      required:
        - id
        - knodeId
      additionalProperties: false
    EserviceTemplateReference:
      description: Reference to an E-service template
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        knodeId:
          $ref: "#/components/schemas/KnodeId"
      required:
        - id
        - knodeId
      additionalProperties: false
    Attribute:
      type: object
      properties:
        code:
          type: string
        scheme:
          type: string
      required:
        - code
        - scheme
      additionalProperties: false
    Pagination:
      type: object
      properties:
        limit:
          format: int32
          type: number
          minimum: 1
          maximum: 50
        offset:
          format: int32
          type: number
          minimum: 0
        total:
          format: int32
          type: number
          minimum: 0
      required:
        - limit
        - offset
        - total
      additionalProperties: false
    EserviceVersionInterfaceDocument:
      type: object
      properties:
        checksum:
          description: SHA-256 checksum of the interface document
          type: string
        contentType:
          description: MIME type of the interface document
          type: string
        createdAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        id:
          description: Unique identifier of the interface document
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        name:
          description: Name of the interface document, with extension
          type: string
        path:
          description: Path where the interface document is stored in the bucket
          type: string
        prettyName:
          $ref: "#/components/schemas/LocalizedInterfacePrettyName"
        updatedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
      required:
        - checksum
        - contentType
        - createdAt
        - id
        - name
        - path
        - prettyName
        - updatedAt
      additionalProperties: false
    Eservice:
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/EserviceCategory"
        createdAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        description:
          $ref: "#/components/schemas/LocalizedDescription"
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        isConsumerOperatorIdentificationRequired:
          type: boolean
        isSignalHubEnabled:
          type: boolean
        mode:
          $ref: "#/components/schemas/EserviceMode"
        name:
          $ref: "#/components/schemas/LocalizedName"
        producerId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        template:
          allOf:
            - $ref: "#/components/schemas/EserviceTemplateId"
        updatedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
      required:
        - categories
        - createdAt
        - description
        - id
        - isConsumerOperatorIdentificationRequired
        - isSignalHubEnabled
        - mode
        - name
        - producerId
        - updatedAt
      additionalProperties: false
    Eservices:
      type: object
      properties:
        pagination:
          $ref: "#/components/schemas/Pagination"
        results:
          type: array
          items:
            $ref: "#/components/schemas/Eservice"
      required:
        - pagination
        - results
      additionalProperties: false
    EserviceVersion:
      type: object
      properties:
        accessTokenAudience:
          description: Audience for the access token
          type: array
          items:
            type: string
        accessTokenDuration:
          description: Duration of the access token in seconds
          format: int32
          type: integer
          minimum: 1
          maximum: 86400
        accessTokenType:
          description: Type of the access token
          allOf:
            - $ref: "#/components/schemas/AccessTokenType"
        createdAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        id:
          description: Unique identifier of the E-service version
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        maxDailyCallsPerConsumer:
          description: Maximum daily calls per consumer
          format: int32
          type: integer
          minimum: 1
          maximum: 1000000000
        maxDailyCallsPerKnode:
          description: Maximum daily calls per Knode
          format: int32
          type: integer
          minimum: 1
          maximum: 1000000000
        requiredAttributes:
          description: Required attributes for the E-service
          type: array
          items:
            type: array
            items:
              $ref: "#/components/schemas/Attribute"
        state:
          description: State of the version
          allOf:
            - $ref: "#/components/schemas/EserviceVersionState"
        updatedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        versionNumber:
          description: Version number
          format: int32
          type: integer
          minimum: 1
          maximum: 9007199254740991
      required:
        - accessTokenAudience
        - accessTokenDuration
        - accessTokenType
        - createdAt
        - id
        - maxDailyCallsPerConsumer
        - maxDailyCallsPerKnode
        - requiredAttributes
        - state
        - updatedAt
        - versionNumber
      additionalProperties: false
    InterfaceDocumentSeed:
      type: object
      properties:
        checksum:
          description: SHA-256 checksum of the uploaded E-service interface document
          type: string
        contentType:
          description: MIME type of the uploaded E-service interface document
          type: string
        id:
          description: Unique identifier of the E-service interface document
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        name:
          description: Name of the uploaded E-service interface document, with extension
          type: string
        path:
          description: Path where the E-service interface document is stored
          type: string
        prettyName:
          $ref: "#/components/schemas/LocalizedInterfacePrettyName"
      required:
        - checksum
        - contentType
        - id
        - name
        - path
        - prettyName
      additionalProperties: false
    EserviceFromScratchSeed:
      type: object
      properties:
        accessTokenAudience:
          description: Audience for the access token
          type: array
          items:
            type: string
        accessTokenDuration:
          description: Duration of the access token in seconds
          format: int32
          default: 3600
          type: integer
          minimum: 1
          maximum: 86400
        accessTokenType:
          description: Type of the access token
          default: Bearer
          allOf:
            - $ref: "#/components/schemas/AccessTokenType"
        description:
          $ref: "#/components/schemas/LocalizedDescription"
        interfaceDocument:
          description: Interface document
          allOf:
            - $ref: "#/components/schemas/InterfaceDocumentSeed"
        isSignalHubEnabled:
          description: Whether SignalHub is enabled for the E-service
          type: boolean
        maxDailyCallsPerConsumer:
          description: Maximum daily calls per consumer (must be less than or equal to
            maxDailyCallsPerKnode)
          format: int32
          type: integer
          minimum: 1
          maximum: 1000000000
        maxDailyCallsPerKnode:
          description: Maximum daily calls per Knode (must be greater than or equal to
            maxDailyCallsPerConsumer)
          format: int32
          type: integer
          minimum: 1
          maximum: 1000000000
        name:
          $ref: "#/components/schemas/LocalizedName"
        categories:
          description: Categories of the E-service
          type: array
          items:
            $ref: "#/components/schemas/EserviceCategory"
        mode:
          description: Mode of the E-service
          allOf:
            - $ref: "#/components/schemas/EserviceMode"
        requiredAttributes:
          description: Required attributes for the E-service
          type: array
          items:
            type: array
            items:
              $ref: "#/components/schemas/Attribute"
      required:
        - accessTokenAudience
        - accessTokenDuration
        - accessTokenType
        - description
        - interfaceDocument
        - maxDailyCallsPerConsumer
        - maxDailyCallsPerKnode
        - name
        - requiredAttributes
      additionalProperties: false
    EserviceFromTemplateSeed:
      type: object
      properties:
        accessTokenAudience:
          description: Audience for the access token
          type: array
          items:
            type: string
        accessTokenDuration:
          description: Duration of the access token in seconds
          format: int32
          default: 3600
          type: integer
          minimum: 1
          maximum: 86400
        accessTokenType:
          description: Type of the access token
          default: Bearer
          allOf:
            - $ref: "#/components/schemas/AccessTokenType"
        description:
          $ref: "#/components/schemas/LocalizedDescription"
        interfaceDocument:
          description: Interface document
          allOf:
            - $ref: "#/components/schemas/InterfaceDocumentSeed"
        isSignalHubEnabled:
          description: Whether SignalHub is enabled for the E-service
          type: boolean
        maxDailyCallsPerConsumer:
          description: Maximum daily calls per consumer (must be less than or equal to
            maxDailyCallsPerKnode)
          format: int32
          type: integer
          minimum: 1
          maximum: 1000000000
        maxDailyCallsPerKnode:
          description: Maximum daily calls per Knode (must be greater than or equal to
            maxDailyCallsPerConsumer)
          format: int32
          type: integer
          minimum: 1
          maximum: 1000000000
        name:
          $ref: "#/components/schemas/LocalizedName"
        template:
          $ref: "#/components/schemas/EserviceTemplateReference"
      required:
        - accessTokenAudience
        - accessTokenDuration
        - accessTokenType
        - description
        - interfaceDocument
        - maxDailyCallsPerConsumer
        - maxDailyCallsPerKnode
        - name
        - template
      additionalProperties: false
    EserviceSeed:
      anyOf:
        - $ref: "#/components/schemas/EserviceFromScratchSeed"
        - $ref: "#/components/schemas/EserviceFromTemplateSeed"
    EservicePatch:
      type: object
      properties:
        categories:
          description: Categories of the E-service
          type: array
          items:
            $ref: "#/components/schemas/EserviceCategory"
        description:
          allOf:
            - $ref: "#/components/schemas/LocalizedDescription"
        name:
          allOf:
            - $ref: "#/components/schemas/LocalizedName"
      additionalProperties: false
    GetCatalogEserviceSearchParams:
      anyOf:
        - type: object
          properties:
            keywords:
              description: Search by name or description
              type: string
              minLength: 1
          required:
            - keywords
          additionalProperties: false
        - type: object
          properties:
            category:
              description: Include only E-services belonging to the specified category
              allOf:
                - $ref: "#/components/schemas/EserviceCategory"
          required:
            - category
          additionalProperties: false
        - type: object
          properties:
            keywords:
              description: Search by name or description
              type: string
              minLength: 1
            category:
              description: Include only E-services belonging to the specified category
              allOf:
                - $ref: "#/components/schemas/EserviceCategory"
          required:
            - keywords
            - category
          additionalProperties: false
paths:
  /status:
    get:
      operationId: getStatus
      summary: Get status
      tags:
        - health
      description: Check the health status of the service
      security: []
      responses:
        "200":
          description: Service status OK
          content:
            application/problem+json:
              schema:
                description: Service status OK
                allOf:
                  - $ref: "#/components/schemas/Problem"
  /eservices:
    get:
      operationId: getEservices
      summary: List E-services
      tags:
        - eservice
      description: Retrieve a list of E-services
      parameters:
        - schema:
            format: int32
            type: number
            minimum: 1
            maximum: 50
          in: query
          name: limit
          required: true
          description: Maximum number of items returned
        - schema:
            format: int32
            type: number
            minimum: 0
          in: query
          name: offset
          required: true
          description: Pagination starting position
        - schema:
            type: array
            items:
              type: string
              format: uuid
              pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: query
          name: eserviceId
          required: false
          description: Filter by E-service ID
        - schema:
            allOf:
              - $ref: "#/components/schemas/EserviceMode"
          in: query
          name: mode
          required: false
          description: Filter by E-service data mode
        - schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: query
          name: producerId
          required: false
          description: Filter by producer organization ID
        - schema:
            type: string
          in: query
          name: q
          required: false
          description: Search by name, description or categories
        - schema:
            default: name
            type: string
            enum:
              - name
          in: query
          name: sortBy
          required: false
          description: Field to sort by
        - schema:
            default: asc
            type: string
            enum:
              - asc
              - desc
          in: query
          name: sortOrder
          required: false
          description: Sort direction
        - schema:
            type: array
            items:
              $ref: "#/components/schemas/EserviceVersionState"
          in: query
          name: state
          required: false
          description: Filter by E-service state
        - schema:
            allOf:
              - $ref: "#/components/schemas/CorrelationId"
          in: header
          name: x-correlation-id
          required: true
          description: Unique identifier of the request
      responses:
        "200":
          description: E-services retrieved successfully
          content:
            application/json:
              schema:
                description: E-services retrieved successfully
                allOf:
                  - $ref: "#/components/schemas/Eservices"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                description: Bad Request
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                description: Unauthorized
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                description: Forbidden
                allOf:
                  - $ref: "#/components/schemas/Problem"
    post:
      operationId: createEservice
      summary: Create an E-service
      tags:
        - eservice
      description: Create a new E-service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EserviceSeed"
      parameters:
        - schema:
            allOf:
              - $ref: "#/components/schemas/CorrelationId"
          in: header
          name: x-correlation-id
          required: true
          description: Unique identifier of the request
      responses:
        "201":
          description: E-service created successfully
          content:
            application/json:
              schema:
                description: E-service created successfully
                allOf:
                  - $ref: "#/components/schemas/Eservice"
          headers:
            metadata-version:
              required: true
              schema:
                type: string
              description: Metadata version of the resource
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                description: Bad Request
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                description: Unauthorized
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                description: Forbidden
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "404":
          description: E-service template not found
          content:
            application/problem+json:
              schema:
                description: E-service template not found
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "409":
          description: Conflict
          content:
            application/problem+json:
              schema:
                description: Conflict
                allOf:
                  - $ref: "#/components/schemas/Problem"
  /eservices/{eserviceId}:
    get:
      operationId: getEservice
      summary: Get an E-service
      tags:
        - eservice
      description: Retrieve an E-service by its ID
      parameters:
        - schema:
            type: string
            format: uuid
