openapi: 3.0.4
info:
  contact:
    url: https://github.com/pagopa/knodia/issues
  description: API for managing Knodia E-services
  termsOfService: https://github.com/pagopa/knodia
  title: Knodia E-service Process API
  version: 1.0.0
components:
  schemas:
    PaginationInput:
      type: object
      properties:
        limit:
          format: int32
          type: number
          minimum: 1
          maximum: 50
        offset:
          format: int32
          type: number
          minimum: 0
        total:
          format: int32
          type: number
          minimum: 0
      required:
        - limit
        - offset
        - total
      additionalProperties: false
    EserviceInput:
      type: object
      properties:
        id:
          type: string
      required:
        - id
      additionalProperties: false
    EservicesInput:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EserviceInput"
        pagination:
          $ref: "#/components/schemas/PaginationInput"
      required:
        - items
        - pagination
      additionalProperties: false
    EserviceSeedInput:
      type: object
      properties:
        name:
          description: Name of the E-service
          type: string
          minLength: 4
      required:
        - name
      additionalProperties: false
    Pagination:
      type: object
      properties:
        limit:
          format: int32
          type: number
          minimum: 1
          maximum: 50
        offset:
          format: int32
          type: number
          minimum: 0
        total:
          format: int32
          type: number
          minimum: 0
      required:
        - limit
        - offset
        - total
      additionalProperties: false
    Eservice:
      type: object
      properties:
        id:
          type: string
      required:
        - id
      additionalProperties: false
    Eservices:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Eservice"
        pagination:
          $ref: "#/components/schemas/Pagination"
      required:
        - items
        - pagination
      additionalProperties: false
    EserviceSeed:
      type: object
      properties:
        name:
          description: Name of the E-service
          type: string
          minLength: 4
      required:
        - name
      additionalProperties: false
paths:
  /status:
    get:
      operationId: getStatus
      tags:
        - health
      description: Check the health status of the service
      responses:
        "200":
          description: Service status OK
          content:
            application/json:
              schema:
                description: Service status OK
  /eservices:
    get:
      operationId: getEservices
      tags:
        - eservice
      description: Retrieve a list of E-services
      parameters:
        - schema:
            format: int32
            type: number
            minimum: 1
            maximum: 50
          in: query
          name: limit
          required: true
          description: Maximum number of items returned
        - schema:
            format: int32
            type: number
            minimum: 0
          in: query
          name: offset
          required: true
          description: Pagination starting position
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Eservices"
    post:
      operationId: createEservice
      tags:
        - eservice
      description: Create a new E-service
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EserviceSeedInput"
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Eservice"
servers:
  - description: E-service Process API
    url: /
tags:
  - description: Health check routes
    name: health
  - description: E-services routes
    name: eservice
