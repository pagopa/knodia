openapi: 3.0.4
info:
  contact:
    url: https://github.com/pagopa/knodia/issues
  termsOfService: https://knodia.org/
  description: API for managing Knodia E-services
  title: Knodia E-service Process API
  version: 1.0.0
components:
  schemas:
    Pagination:
      type: object
      properties:
        limit:
          format: int32
          type: number
          minimum: 1
          maximum: 50
        offset:
          format: int32
          type: number
          minimum: 0
        total:
          format: int32
          type: number
          minimum: 0
      required:
        - limit
        - offset
        - total
      additionalProperties: false
    ProblemError:
      type: object
      properties:
        code:
          example: 123-4567
          pattern: ^[0-9]{3}-[0-9]{4}$
          description: Internal code of the error
          type: string
          minLength: 8
          maxLength: 8
        detail:
          example: Parameter not valid
          pattern: ^.{0,1024}$
          description: A human readable explanation specific to this occurrence of the
            problem
          type: string
          maxLength: 4096
      required:
        - code
        - detail
      additionalProperties: false
    Problem:
      type: object
      properties:
        correlationId:
          example: 53af4f2d-0c87-41ef-a645-b726a821852b
          description: Unique identifier of the request
          type: string
          maxLength: 64
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        errors:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/ProblemError"
        status:
          example: 404
          exclusiveMaximum: true
          format: int32
          description: The HTTP status code generated by the origin server for this
            occurrence of the problem
          type: number
          minimum: 100
          maximum: 600
        title:
          example: Service Unavailable
          pattern: ^[ -~]{0,64}$
          description: A short, summary of the problem type. Written in english and readable
          type: string
          maxLength: 64
      required:
        - correlationId
        - errors
        - status
        - title
      additionalProperties: false
    Eservice:
      type: object
      properties:
        id:
          type: string
      required:
        - id
      additionalProperties: false
    Eservices:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Eservice"
        pagination:
          $ref: "#/components/schemas/Pagination"
      required:
        - items
        - pagination
      additionalProperties: false
    EserviceSeed:
      type: object
      properties:
        name:
          description: Name of the E-service
          type: string
          minLength: 4
      required:
        - name
      additionalProperties: false
paths:
  /status:
    get:
      operationId: getStatus
      tags:
        - health
      description: Check the health status of the service
      responses:
        "200":
          description: Service status OK
          content:
            application/problem+json:
              schema:
                description: Service status OK
                allOf:
                  - $ref: "#/components/schemas/Problem"
  /eservices:
    get:
      operationId: getEservices
      tags:
        - eservice
      description: Retrieve a list of E-services
      parameters:
        - schema:
            format: int32
            type: number
            minimum: 1
            maximum: 50
          in: query
          name: limit
          required: true
          description: Maximum number of items returned
        - schema:
            format: int32
            type: number
            minimum: 0
          in: query
          name: offset
          required: true
          description: Pagination starting position
        - schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: header
          name: x-correlation-id
          required: true
      responses:
        "200":
          description: E-services retrieved successfully
          content:
            application/json:
              schema:
                description: E-services retrieved successfully
                allOf:
                  - $ref: "#/components/schemas/Eservices"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                description: Bad Request
                allOf:
                  - $ref: "#/components/schemas/Problem"
    post:
      operationId: createEservice
      tags:
        - eservice
      description: Create a new E-service
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EserviceSeed"
      parameters:
        - schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: header
          name: x-correlation-id
          required: true
      responses:
        "201":
          description: E-service created successfully
          content:
            application/json:
              schema:
                description: E-service created successfully
                allOf:
                  - $ref: "#/components/schemas/Eservice"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                description: Bad Request
                allOf:
                  - $ref: "#/components/schemas/Problem"
servers:
  - description: E-service Process API
    url: /
tags:
  - description: Health check routes
    name: health
  - description: E-services routes
    name: eservice
