openapi: 3.0.4
info:
  contact:
    url: https://github.com/pagopa/knodia/issues
  description: API for managing Knodia E-services
  title: Knodia E-service Process API
  version: 1.0.0
components:
  schemas:
    Pagination:
      type: object
      properties:
        limit:
          format: int32
          type: number
          minimum: 1
          maximum: 50
        offset:
          format: int32
          type: number
          minimum: 0
        total:
          format: int32
          type: number
          minimum: 0
      required:
        - limit
        - offset
        - total
      additionalProperties: false
    Eservice:
      type: object
      properties:
        id:
          type: string
      required:
        - id
      additionalProperties: false
    Eservices:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Eservice"
        pagination:
          $ref: "#/components/schemas/Pagination"
      required:
        - items
        - pagination
      additionalProperties: false
paths:
  /status:
    get:
      responses:
        "200":
          description: Default Response
          content:
            application/problem+json:
              schema: {}
  /eservices:
    get:
      parameters:
        - schema:
            format: int32
            type: number
            minimum: 1
            maximum: 50
          in: query
          name: limit
          required: true
          description: Maximum number of items returned
        - schema:
            format: int32
            type: number
            minimum: 0
          in: query
          name: offset
          required: true
          description: Pagination starting position
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Eservices"
