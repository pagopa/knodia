openapi: 3.0.4
info:
  contact:
    url: https://github.com/pagopa/knodia/issues
  termsOfService: https://knodia.org/
  description: API for managing Knodia Purposes
  title: Knodia Purpose Process API
  version: 1.0.0
components:
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: A JWT bearer token conforming to the best practices defined in RFC
        8725 (https://www.rfc-editor.org/rfc/rfc8725.html)
      scheme: bearer
      type: http
  schemas:
    ProblemError:
      type: object
      properties:
        code:
          description: Internal code of the error
          example: 123-4567
          pattern: ^[0-9]{3}-[0-9]{4}$
          type: string
          minLength: 8
          maxLength: 8
        detail:
          description: A human readable explanation specific to this occurrence of the
            problem
          example: Parameter not valid
          pattern: ^.{0,1024}$
          type: string
          maxLength: 4096
      required:
        - code
        - detail
      additionalProperties: false
    CorrelationId:
      type: string
      format: uuid
      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
    Problem:
      type: object
      properties:
        correlationId:
          description: Unique identifier of the request
          example: 53af4f2d-0c87-41ef-a645-b726a821852b
          allOf:
            - $ref: "#/components/schemas/CorrelationId"
        errors:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/ProblemError"
        status:
          description: The HTTP status code generated by the origin server for this
            occurrence of the problem
          example: 404
          exclusiveMaximum: true
          format: int32
          type: number
          minimum: 100
          maximum: 600
        title:
          description: A short, summary of the problem type. Written in english and readable
          example: Service Unavailable
          pattern: ^[ -~]{0,64}$
          type: string
          maxLength: 64
      required:
        - correlationId
        - status
        - title
      additionalProperties: false
    KnodeId:
      description: Unique Knode identifier
      type: string
      enum:
        - Orion
        - Lynx
    PurposeState:
      type: string
      enum:
        - Active
        - Suspended
        - Archived
    PurposeConsumer:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        knodeId:
          $ref: "#/components/schemas/KnodeId"
      required:
        - id
        - knodeId
      additionalProperties: false
    LocalizedPurposeName:
      description: Name of the Purpose
      type: object
      properties:
        en:
          type: string
          minLength: 5
          maxLength: 60
      required:
        - en
      additionalProperties: false
    LocalizedPurposeDescription:
      description: Description of the Purpose
      type: object
      properties:
        en:
          type: string
          minLength: 10
          maxLength: 250
      required:
        - en
      additionalProperties: false
    PurposeFormAnswers:
      type: object
      additionalProperties: {}
    PurposeFormSchemaVersion:
      type: string
      enum:
        - "1.0"
    PurposeFormSchema:
      type: object
      additionalProperties: {}
    PurposeFormTexts:
      type: object
      properties:
        en:
          type: object
          additionalProperties: {}
      required:
        - en
      additionalProperties: false
    PurposeFormUiSchema:
      type: object
      additionalProperties: {}
    Pagination:
      type: object
      properties:
        limit:
          format: int32
          type: number
          minimum: 1
          maximum: 50
        offset:
          format: int32
          type: number
          minimum: 0
        total:
          format: int32
          type: number
          minimum: 0
      required:
        - limit
        - offset
        - total
      additionalProperties: false
    OrganizationId:
      description: Unique identifier of the Organization
      type: string
      format: uuid
      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
    PurposeSeed:
      type: object
      properties:
        consumer:
          $ref: "#/components/schemas/PurposeConsumer"
        dailyCalls:
          format: int32
          type: integer
          minimum: 0
          maximum: 1000000000
        description:
          $ref: "#/components/schemas/LocalizedPurposeDescription"
        eserviceId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        formAnswersJson:
          $ref: "#/components/schemas/PurposeFormAnswers"
        formSchemaVersion:
          $ref: "#/components/schemas/PurposeFormSchemaVersion"
        name:
          $ref: "#/components/schemas/LocalizedPurposeName"
      required:
        - consumer
        - dailyCalls
        - description
        - eserviceId
        - formAnswersJson
        - formSchemaVersion
        - name
      additionalProperties: false
    Purpose:
      type: object
      properties:
        consumer:
          $ref: "#/components/schemas/PurposeConsumer"
        createdAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        dailyCalls:
          format: int32
          type: integer
          minimum: 0
          maximum: 1000000000
        description:
          $ref: "#/components/schemas/LocalizedPurposeDescription"
        eserviceId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        name:
          $ref: "#/components/schemas/LocalizedPurposeName"
        state:
          $ref: "#/components/schemas/PurposeState"
        updatedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
      required:
        - consumer
        - createdAt
        - dailyCalls
        - description
        - eserviceId
        - id
        - name
        - state
        - updatedAt
      additionalProperties: false
    Purposes:
      type: object
      properties:
        pagination:
          $ref: "#/components/schemas/Pagination"
        results:
          type: array
          items:
            $ref: "#/components/schemas/Purpose"
      required:
        - pagination
        - results
      additionalProperties: false
    CurrentPurposeFormSchemasResponse:
      type: object
      properties:
        schema:
          $ref: "#/components/schemas/PurposeFormSchema"
        texts:
          $ref: "#/components/schemas/PurposeFormTexts"
        uiSchema:
          $ref: "#/components/schemas/PurposeFormUiSchema"
        version:
          $ref: "#/components/schemas/PurposeFormSchemaVersion"
      required:
        - schema
        - texts
        - uiSchema
        - version
      additionalProperties: false
paths:
  /status:
    get:
      operationId: getStatus
      tags:
        - health
      description: Check the health status of the service
      security: []
      responses:
        "200":
          description: Service status OK
          content:
            application/problem+json:
              schema:
                description: Service status OK
                allOf:
                  - $ref: "#/components/schemas/Problem"
  /purposes:
    post:
      operationId: createPurpose
      summary: Create Purpose
      tags:
        - purpose
      description: Create a new Purpose for an E-service on behalf of a consumer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurposeSeed"
      parameters:
        - schema:
            allOf:
              - $ref: "#/components/schemas/CorrelationId"
          in: header
          name: x-correlation-id
          required: true
          description: Unique identifier of the request
      responses:
        "201":
          description: Purpose created successfully
          content:
            application/json:
              schema:
                description: Purpose created successfully
                allOf:
                  - $ref: "#/components/schemas/Purpose"
          headers:
            metadata-version:
              required: true
              schema:
                type: string
              description: Metadata version of the resource
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                description: Bad Request
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                description: Unauthorized
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                description: Forbidden
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                description: Not Found
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "409":
          description: Conflict
          content:
            application/problem+json:
              schema:
                description: Conflict
                allOf:
                  - $ref: "#/components/schemas/Problem"
    get:
      operationId: getPurposes
      summary: List Purposes
      tags:
        - purpose
      description: Retrieve a list of Purposes
      parameters:
        - schema:
            format: int32
            type: number
            minimum: 1
            maximum: 50
          in: query
          name: limit
          required: true
          description: Maximum number of items returned
        - schema:
            format: int32
            type: number
            minimum: 0
          in: query
          name: offset
          required: true
          description: Pagination starting position
        - schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: query
          name: agreementId
          required: false
          description: Filter by Agreement ID
        - schema:
            allOf:
              - $ref: "#/components/schemas/OrganizationId"
          in: query
          name: consumerId
          required: false
          description: Filter by Consumer Organization ID
        - schema:
            allOf:
              - $ref: "#/components/schemas/KnodeId"
          in: query
          name: consumerKnodeId
          required: false
          description: Filter by Consumer Knode ID
        - schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: query
          name: eserviceId
          required: false
          description: Filter by E-service ID
        - schema:
            allOf:
              - $ref: "#/components/schemas/OrganizationId"
          in: query
          name: producerId
          required: false
          description: Filter by Producer Organization ID
        - schema:
            type: array
            items:
              $ref: "#/components/schemas/PurposeState"
          in: query
          name: state
          required: false
          description: Filter by Purpose State
        - schema:
            allOf:
              - $ref: "#/components/schemas/CorrelationId"
          in: header
          name: x-correlation-id
          required: true
          description: Unique identifier of the request
      responses:
        "200":
          description: Purposes retrieved successfully
          content:
            application/json:
              schema:
                description: Purposes retrieved successfully
                allOf:
                  - $ref: "#/components/schemas/Purposes"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                description: Bad Request
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                description: Unauthorized
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                description: Forbidden
                allOf:
                  - $ref: "#/components/schemas/Problem"
  /purposes/{purposeId}:
    get:
      operationId: getPurpose
      summary: Get Purpose
      tags:
        - purpose
      description: Retrieve a Purpose by its ID
      parameters:
        - schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: path
          name: purposeId
          required: true
        - schema:
            allOf:
              - $ref: "#/components/schemas/CorrelationId"
          in: header
          name: x-correlation-id
          required: true
          description: Unique identifier of the request
      responses:
        "200":
          description: Purpose retrieved successfully
          content:
            application/json:
              schema:
                description: Purpose retrieved successfully
                allOf:
                  - $ref: "#/components/schemas/Purpose"
          headers:
            metadata-version:
              required: true
              schema:
                type: string
              description: Metadata version of the resource
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                description: Bad Request
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                description: Unauthorized
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                description: Forbidden
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "404":
          description: Purpose not found
          content:
            application/problem+json:
              schema:
                description: Purpose not found
                allOf:
                  - $ref: "#/components/schemas/Problem"
  /purposes/formSchemas/current:
    get:
      operationId: getCurrentPurposeFormSchemas
      summary: Get current Purpose form schemas
      tags:
        - purpose
      description: Retrieve the current Purpose form schemas (JSON Schema + UI Schema)
        with their version
      parameters:
        - schema:
            allOf:
              - $ref: "#/components/schemas/CorrelationId"
          in: header
          name: x-correlation-id
          required: true
          description: Unique identifier of the request
      responses:
        "200":
          description: Current Purpose form schemas retrieved successfully
          content:
            application/json:
              schema:
                description: Current Purpose form schemas retrieved successfully
                allOf:
                  - $ref: "#/components/schemas/CurrentPurposeFormSchemasResponse"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                description: Unauthorized
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                description: Forbidden
                allOf:
                  - $ref: "#/components/schemas/Problem"
servers:
  - description: Purpose Process API
    url: /
security:
  - bearerAuth: []
tags:
  - description: Health check routes
    name: health
  - description: Purpose routes
    name: purpose
