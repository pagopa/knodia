openapi: 3.0.4
info:
  contact:
    url: https://github.com/pagopa/knodia/issues
  termsOfService: https://knodia.org/
  description: "API for issuing access tokens: E-service access tokens and Knode
    API access tokens"
  title: Knodia Authorization Server API
  version: 1.0.0
components:
  schemas:
    ProblemError:
      type: object
      properties:
        code:
          description: Internal code of the error
          example: 123-4567
          pattern: ^[0-9]{3}-[0-9]{4,5}$
          type: string
          minLength: 8
          maxLength: 9
        detail:
          description: A human readable explanation specific to this occurrence of the
            problem
          example: Parameter not valid
          pattern: ^.{0,1024}$
          type: string
          maxLength: 4096
      required:
        - code
        - detail
      additionalProperties: false
    CorrelationId:
      type: string
      format: uuid
      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
    Problem:
      type: object
      properties:
        correlationId:
          description: Unique identifier of the request
          example: 53af4f2d-0c87-41ef-a645-b726a821852b
          allOf:
            - $ref: "#/components/schemas/CorrelationId"
        errors:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/ProblemError"
        status:
          description: The HTTP status code generated by the origin server for this
            occurrence of the problem
          example: 404
          exclusiveMaximum: true
          format: int32
          type: number
          minimum: 100
          maximum: 600
        title:
          description: A short, summary of the problem type. Written in english and readable
          example: Service Unavailable
          pattern: ^[ -~]{0,64}$
          type: string
          maxLength: 64
      required:
        - correlationId
        - status
        - title
      additionalProperties: false
    EserviceAccessTokenRequest:
      type: object
      properties:
        client_assertion:
          type: string
          format: jwt
        client_assertion_type:
          type: string
          enum:
            - urn:ietf:params:oauth:client-assertion-type:jwt-bearer
        grant_type:
          type: string
          enum:
            - client_credentials
        client_id:
          description: Unique identifier of the Consumer Keychain
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
      required:
        - client_assertion
        - client_assertion_type
        - grant_type
        - client_id
      additionalProperties: false
    EserviceAccessTokenResponse:
      type: object
      properties:
        access_token:
          type: string
        expires_in:
          format: int32
          type: number
        token_type:
          type: string
          enum:
            - Bearer
            - DPoP
      required:
        - access_token
        - expires_in
        - token_type
      additionalProperties: false
    KnodeApiTokenRequest:
      type: object
      properties:
        client_assertion:
          type: string
          format: jwt
        client_assertion_type:
          type: string
          enum:
            - urn:ietf:params:oauth:client-assertion-type:jwt-bearer
        grant_type:
          type: string
          enum:
            - client_credentials
        client_id:
          description: Unique identifier of the Knode API Keychain
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
      required:
        - client_assertion
        - client_assertion_type
        - grant_type
        - client_id
      additionalProperties: false
    KnodeApiTokenResponse:
      type: object
      properties:
        access_token:
          type: string
        expires_in:
          format: int32
          type: number
        token_type:
          type: string
          enum:
            - Bearer
      required:
        - access_token
        - expires_in
        - token_type
      additionalProperties: false
paths:
  /status:
    get:
      operationId: getStatus
      tags:
        - health
      description: Check the health status of the service
      security: []
      responses:
        "200":
          description: Service status OK
          content:
            application/problem+json:
              schema:
                description: Service status OK
                allOf:
                  - $ref: "#/components/schemas/Problem"
  /token:
    post:
      operationId: createEserviceAccessToken
      summary: Create E-service Access Token
      tags:
        - e-service-access-token
      description: Issue an E-service access token
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/EserviceAccessTokenRequest"
      parameters:
        - schema:
            type: string
          in: header
          name: dpop
          required: false
          description: DPoP proof JWT
      security: []
      responses:
        "200":
          description: Token issued successfully
          content:
            application/json:
              schema:
                description: Token issued successfully
                allOf:
                  - $ref: "#/components/schemas/EserviceAccessTokenResponse"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                description: Bad Request
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                description: Unauthorized
                allOf:
                  - $ref: "#/components/schemas/Problem"
  /knodeApiToken:
    post:
      operationId: createKnodeApiToken
      summary: Create Knode API Token
      tags:
        - knode-api-token
      description: Issue a Knode API access token
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/KnodeApiTokenRequest"
      security: []
      responses:
        "200":
          description: Token issued successfully
          content:
            application/json:
              schema:
                description: Token issued successfully
                allOf:
                  - $ref: "#/components/schemas/KnodeApiTokenResponse"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                description: Bad Request
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                description: Unauthorized
                allOf:
                  - $ref: "#/components/schemas/Problem"
servers:
  - description: Authorization Server API
    url: /
tags:
  - description: Health check routes
    name: health
  - description: E-service access token issuance
    name: e-service-access-token
  - description: Knode API access token issuance
    name: knode-api-token
