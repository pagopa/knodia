openapi: 3.0.4
info:
  contact:
    url: https://github.com/pagopa/knodia/issues
  termsOfService: https://knodia.org/
  description: Knodia backend-for-frontend API
  title: Knodia BFF API
  version: 1.0.0
components:
  schemas:
    ProblemError:
      type: object
      properties:
        code:
          description: Internal code of the error
          example: 123-4567
          pattern: ^[0-9]{3}-[0-9]{4}$
          type: string
          minLength: 8
          maxLength: 8
        detail:
          description: A human readable explanation specific to this occurrence of the
            problem
          example: Parameter not valid
          pattern: ^.{0,1024}$
          type: string
          maxLength: 4096
      required:
        - code
        - detail
      additionalProperties: false
    CorrelationId:
      type: string
      format: uuid
      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
    Problem:
      type: object
      properties:
        correlationId:
          description: Unique identifier of the request
          example: 53af4f2d-0c87-41ef-a645-b726a821852b
          allOf:
            - $ref: "#/components/schemas/CorrelationId"
        errors:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/ProblemError"
        status:
          description: The HTTP status code generated by the origin server for this
            occurrence of the problem
          example: 404
          exclusiveMaximum: true
          format: int32
          type: number
          minimum: 100
          maximum: 600
        title:
          description: A short, summary of the problem type. Written in english and readable
          example: Service Unavailable
          pattern: ^[ -~]{0,64}$
          type: string
          maxLength: 64
      required:
        - correlationId
        - status
        - title
      additionalProperties: false
    Pagination:
      type: object
      properties:
        limit:
          format: int32
          type: number
          minimum: 1
          maximum: 50
        offset:
          format: int32
          type: number
          minimum: 0
        total:
          format: int32
          type: number
          minimum: 0
      required:
        - limit
        - offset
        - total
      additionalProperties: false
    KnodeId:
      description: Unique Knode identifier
      type: string
      enum:
        - Orion
        - Lynx
    EserviceVersionState:
      type: string
      enum:
        - Active
        - Suspended
        - Archived
    LocalizedName:
      description: Name of the E-service
      type: object
      properties:
        en:
          type: string
          minLength: 5
          maxLength: 60
      required:
        - en
      additionalProperties: false
    LocalizedDescription:
      description: Description of the E-service
      type: object
      properties:
        en:
          type: string
          minLength: 10
          maxLength: 250
      required:
        - en
      additionalProperties: false
    LocalizedInterfacePrettyName:
      description: Pretty name of the E-service interface document
      type: object
      properties:
        en:
          type: string
          minLength: 5
          maxLength: 60
      required:
        - en
      additionalProperties: false
    EserviceMode:
      type: string
      enum:
        - ProvideData
        - ReceiveData
    EserviceCategory:
      type: object
      properties:
        code:
          type: string
        scheme:
          type: string
      required:
        - code
        - scheme
      additionalProperties: false
    AccessTokenType:
      type: string
      enum:
        - Bearer
        - DPoP
    EserviceAttribute:
      type: object
      properties:
        code:
          type: string
        scheme:
          type: string
      required:
        - code
        - scheme
      additionalProperties: false
    InterfaceDocumentSeed:
      type: object
      properties:
        checksum:
          description: SHA-256 checksum of the uploaded E-service interface document
          type: string
        content:
          description: Base64-encoded file content
          type: string
          format: base64
          pattern: ^$|^(?:[0-9a-zA-Z+/]{4})*(?:(?:[0-9a-zA-Z+/]{2}==)|(?:[0-9a-zA-Z+/]{3}=))?$
        contentType:
          description: MIME type of the uploaded E-service interface document
          type: string
        name:
          description: Name of the uploaded E-service interface document, with extension
          type: string
        prettyName:
          $ref: "#/components/schemas/LocalizedInterfacePrettyName"
      required:
        - checksum
        - content
        - contentType
        - name
        - prettyName
      additionalProperties: false
    EserviceSeed:
      type: object
      properties:
        accessTokenAudience:
          description: Audience for the access token
          type: array
          items:
            type: string
        accessTokenDuration:
          description: Duration of the access token in seconds
          format: int32
          default: 3600
          type: integer
          minimum: 1
          maximum: 86400
        accessTokenType:
          description: Type of the access token
          default: Bearer
          allOf:
            - $ref: "#/components/schemas/AccessTokenType"
        categories:
          description: Categories of the E-service
          type: array
          items:
            $ref: "#/components/schemas/EserviceCategory"
        description:
          $ref: "#/components/schemas/LocalizedDescription"
        interfaceDocument:
          description: Interface document for the E-service
          allOf:
            - $ref: "#/components/schemas/InterfaceDocumentSeed"
        isConsumerOperatorIdentificationRequired:
          description: Whether consumer operator identification is required
          type: boolean
        isSignalHubEnabled:
          description: Whether SignalHub is enabled for the E-service
          type: boolean
        maxDailyCallsPerConsumer:
          description: Maximum daily calls per consumer
          format: int32
          type: integer
          minimum: 1
          maximum: 1000000000
        maxDailyCallsPerKnode:
          description: Maximum daily calls per Knode
          format: int32
          type: integer
          minimum: 1
          maximum: 1000000000
        mode:
          description: Mode of the E-service
          allOf:
            - $ref: "#/components/schemas/EserviceMode"
        name:
          $ref: "#/components/schemas/LocalizedName"
        requiredAttributes:
          description: Required attributes for the E-service
          type: array
          items:
            type: array
            items:
              $ref: "#/components/schemas/EserviceAttribute"
      required:
        - accessTokenAudience
        - accessTokenDuration
        - accessTokenType
        - description
        - interfaceDocument
        - maxDailyCallsPerConsumer
        - maxDailyCallsPerKnode
        - name
        - requiredAttributes
      additionalProperties: false
    CreatedResource:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
      required:
        - id
      additionalProperties: false
    ProducerEservice:
      type: object
      properties:
        activeAgreements:
          description: Number of active agreements
          format: int32
          type: integer
          minimum: 0
          maximum: 9007199254740991
        activePurposes:
          description: Number of active purposes
          format: int32
          type: integer
          minimum: 0
          maximum: 9007199254740991
        categories:
          type: array
          items:
            $ref: "#/components/schemas/EserviceCategory"
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        mode:
          $ref: "#/components/schemas/EserviceMode"
        name:
          $ref: "#/components/schemas/LocalizedName"
        state:
          $ref: "#/components/schemas/EserviceVersionState"
      required:
        - activeAgreements
        - activePurposes
        - categories
        - id
        - mode
        - name
        - state
      additionalProperties: false
    ProducerEservices:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProducerEservice"
        pagination:
          $ref: "#/components/schemas/Pagination"
      required:
        - items
        - pagination
      additionalProperties: false
    ProducerEserviceVersionDetails:
      type: object
      properties:
        accessTokenAudience:
          description: Audience for the access token
          type: array
          items:
            type: string
        accessTokenDuration:
          description: Duration of the access token in seconds
          format: int32
          type: integer
          minimum: 1
          maximum: 86400
        accessTokenType:
          description: Type of the access token
          allOf:
            - $ref: "#/components/schemas/AccessTokenType"
        createdAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        id:
          description: Unique identifier of the E-service version
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        interfaceDocument:
          description: Interface document details
          type: object
          properties:
            checksum:
              description: SHA-256 checksum of the E-service interface document
              type: string
            prettyName:
              description: Localized pretty name of the E-service interface
              allOf:
                - $ref: "#/components/schemas/LocalizedInterfacePrettyName"
          required:
            - checksum
            - prettyName
          additionalProperties: false
        maxDailyCallsPerConsumer:
          description: Maximum daily calls per consumer
          format: int32
          type: integer
          minimum: 1
          maximum: 1000000000
        maxDailyCallsPerKnode:
          description: Maximum daily calls per Knode
          format: int32
          type: integer
          minimum: 1
          maximum: 1000000000
        requiredAttributes:
          description: Required attributes for the E-service
          type: array
          items:
            type: array
            items:
              $ref: "#/components/schemas/EserviceAttribute"
        state:
          description: State of the version
          allOf:
            - $ref: "#/components/schemas/EserviceVersionState"
        updatedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        versionNumber:
          description: Version number
          format: int32
          type: integer
          minimum: 1
          maximum: 9007199254740991
      required:
        - accessTokenAudience
        - accessTokenDuration
        - accessTokenType
        - createdAt
        - id
        - interfaceDocument
        - maxDailyCallsPerConsumer
        - maxDailyCallsPerKnode
        - requiredAttributes
        - state
        - updatedAt
        - versionNumber
      additionalProperties: false
    ProducerEserviceDetailsCounters:
      type: object
      properties:
        active:
          description: Number of active items
          format: int32
          type: integer
          minimum: 0
          maximum: 9007199254740991
        total:
          description: Total number of items
          format: int32
          type: integer
          minimum: 0
          maximum: 9007199254740991
      required:
        - active
        - total
      additionalProperties: false
    ProducerEserviceDetailsPurposeCounters:
      type: object
      properties:
        active:
          description: Number of active items
          format: int32
          type: integer
          minimum: 0
          maximum: 9007199254740991
        total:
          description: Total number of items
          format: int32
          type: integer
          minimum: 0
          maximum: 9007199254740991
        totalApiCallsPerDay:
          description: Total API calls per day across all purposes
          format: int32
          type: integer
          minimum: 0
          maximum: 9007199254740991
      required:
        - active
        - total
        - totalApiCallsPerDay
      additionalProperties: false
    ProducerEserviceDetails:
      type: object
      properties:
        agreements:
          description: Agreement counters
          allOf:
            - $ref: "#/components/schemas/ProducerEserviceDetailsCounters"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/EserviceCategory"
        createdAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        description:
          $ref: "#/components/schemas/LocalizedDescription"
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        isConsumerOperatorIdentificationRequired:
          type: boolean
        isSignalHubEnabled:
          type: boolean
        mode:
          $ref: "#/components/schemas/EserviceMode"
        name:
          $ref: "#/components/schemas/LocalizedName"
        producerId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        purposes:
          description: Purpose counters
          allOf:
            - $ref: "#/components/schemas/ProducerEserviceDetailsPurposeCounters"
        updatedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        version:
          description: Latest version details
          allOf:
            - $ref: "#/components/schemas/ProducerEserviceVersionDetails"
      required:
        - agreements
        - categories
        - createdAt
        - description
        - id
        - isConsumerOperatorIdentificationRequired
        - isSignalHubEnabled
        - mode
        - name
        - producerId
        - purposes
        - updatedAt
        - version
      additionalProperties: false
    GetConsumerCatalogEserviceSearchParams:
      anyOf:
        - type: object
          properties:
            category:
              $ref: "#/components/schemas/EserviceCategory"
            knodeId:
              $ref: "#/components/schemas/KnodeId"
          required:
            - category
            - knodeId
          additionalProperties: false
        - type: object
          properties:
            keywords:
              type: string
              minLength: 1
            knodeId:
              $ref: "#/components/schemas/KnodeId"
          required:
            - keywords
            - knodeId
          additionalProperties: false
        - type: object
          properties:
            category:
              $ref: "#/components/schemas/EserviceCategory"
            keywords:
              type: string
              minLength: 1
            knodeId:
              $ref: "#/components/schemas/KnodeId"
          required:
            - category
            - keywords
            - knodeId
          additionalProperties: false
    CompactOrganization:
      description: Organization with only id and name
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        name:
          $ref: "#/components/schemas/LocalizedName"
      required:
        - id
        - name
      additionalProperties: false
    ConsumerCatalogEserviceSearchResult:
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/EserviceCategory"
        description:
          $ref: "#/components/schemas/LocalizedDescription"
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        hasRequiredAttributes:
          type: boolean
        latestVersionState:
          $ref: "#/components/schemas/EserviceVersionState"
        mode:
          $ref: "#/components/schemas/EserviceMode"
        name:
          $ref: "#/components/schemas/LocalizedName"
        producer:
          $ref: "#/components/schemas/CompactOrganization"
      required:
        - categories
        - description
        - id
        - hasRequiredAttributes
        - latestVersionState
        - mode
        - name
        - producer
      additionalProperties: false
    ConsumerCatalogEserviceSearchResults:
      type: object
      properties:
        pagination:
          $ref: "#/components/schemas/Pagination"
        results:
          type: array
          items:
            $ref: "#/components/schemas/ConsumerCatalogEserviceSearchResult"
      required:
        - pagination
        - results
      additionalProperties: false
paths:
  /status:
    get:
      operationId: getStatus
      tags:
        - health
      description: Check the health status of the service
      responses:
        "200":
          description: Service status OK
          content:
            application/problem+json:
              schema:
                description: Service status OK
                allOf:
                  - $ref: "#/components/schemas/Problem"
  /producer/eservices:
    post:
      operationId: createEservice
      tags:
        - eservice
      description: Create a new E-service
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EserviceSeed"
        required: true
      responses:
        "201":
          description: E-service created successfully
          content:
            application/json:
              schema:
                description: E-service created successfully
                allOf:
                  - $ref: "#/components/schemas/CreatedResource"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                description: Bad Request
                allOf:
                  - $ref: "#/components/schemas/Problem"
    get:
      operationId: getProducerEservices
      tags:
        - eservice
      description: Retrieve a paginated list of E-services produced by the logged-in
        user's organization
      parameters:
        - schema:
            format: int32
            type: number
            minimum: 1
            maximum: 50
          in: query
          name: limit
          required: true
          description: Maximum number of items returned
        - schema:
            format: int32
            type: number
            minimum: 0
          in: query
          name: offset
          required: true
          description: Pagination starting position
        - schema:
            allOf:
              - $ref: "#/components/schemas/EserviceMode"
          in: query
          name: mode
          required: false
          description: Filter by E-service data mode
        - schema:
            type: string
          in: query
          name: q
          required: false
          description: Search by name, description or categories
        - schema:
            default: name
            type: string
            enum:
              - name
          in: query
          name: sortBy
          required: false
          description: Field to sort by
        - schema:
            default: asc
            type: string
            enum:
              - asc
              - desc
          in: query
          name: sortOrder
          required: false
          description: Sort direction
        - schema:
            type: array
            items:
              $ref: "#/components/schemas/EserviceVersionState"
          in: query
          name: state
          required: false
          description: Filter by E-service state
      responses:
        "200":
          description: Producer E-services retrieved successfully
          content:
            application/json:
              schema:
                description: Producer E-services retrieved successfully
                allOf:
                  - $ref: "#/components/schemas/ProducerEservices"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                description: Bad Request
                allOf:
                  - $ref: "#/components/schemas/Problem"
  /producer/eservices/{eserviceId}:
    get:
      operationId: getProducerEserviceDetails
      tags:
        - eservice
      description: Retrieve an E-service with all its details
      parameters:
        - schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: path
          name: eserviceId
          required: true
      responses:
        "200":
          description: E-service details retrieved successfully
          content:
            application/json:
              schema:
                description: E-service details retrieved successfully
                allOf:
                  - $ref: "#/components/schemas/ProducerEserviceDetails"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                description: Bad Request
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "404":
          description: E-service not found
          content:
            application/problem+json:
              schema:
                description: E-service not found
                allOf:
                  - $ref: "#/components/schemas/Problem"
  /producer/eservices/{eserviceId}/interface:
    get:
      operationId: getProducerEserviceLatestVersionInterface
      tags:
        - eservice
      description: Download the interface document for the latest version of an E-service
      parameters:
        - schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: path
          name: eserviceId
          required: true
      responses:
        "200":
          description: E-service interface document downloaded successfully
          content:
            application/octet-stream:
              schema:
                format: binary
                description: E-service interface document downloaded successfully
                type: string
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                description: Bad Request
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                description: Not Found
                allOf:
                  - $ref: "#/components/schemas/Problem"
  /consumer/catalog:
    post:
      operationId: getConsumerCatalogEservices
      summary: Search for E-services
      tags:
        - eservice
      description: Search for E-services according to search criteria and considering
        only E-services with an active or suspended Version
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetConsumerCatalogEserviceSearchParams"
        required: true
      parameters:
        - schema:
            format: int32
            type: number
            minimum: 1
            maximum: 50
          in: query
          name: limit
          required: true
          description: Maximum number of items returned
        - schema:
            format: int32
            type: number
            minimum: 0
          in: query
          name: offset
          required: true
          description: Pagination starting position
      responses:
        "200":
          description: E-service search results retrieved (sorted by most recently updated
            first)
          content:
            application/json:
              schema:
                description: E-service search results retrieved (sorted by most recently updated
                  first)
                allOf:
                  - $ref: "#/components/schemas/ConsumerCatalogEserviceSearchResults"
