openapi: 3.0.4
info:
  contact:
    url: https://github.com/pagopa/knodia/issues
  termsOfService: https://knodia.org/
  description: Knodia backend-for-frontend API
  title: Knodia BFF API
  version: 1.0.0
components:
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: A JWT bearer token conforming to the best practices defined in RFC
        8725 (https://www.rfc-editor.org/rfc/rfc8725.html)
      scheme: bearer
      type: http
  schemas:
    ProblemError:
      type: object
      properties:
        code:
          description: Internal code of the error
          example: 123-4567
          pattern: ^[0-9]{3}-[0-9]{4,5}$
          type: string
          minLength: 8
          maxLength: 9
        detail:
          description: A human readable explanation specific to this occurrence of the
            problem
          example: Parameter not valid
          pattern: ^.{0,1024}$
          type: string
          maxLength: 4096
      required:
        - code
        - detail
      additionalProperties: false
    CorrelationId:
      type: string
      format: uuid
      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
    Problem:
      type: object
      properties:
        correlationId:
          description: Unique identifier of the request
          example: 53af4f2d-0c87-41ef-a645-b726a821852b
          allOf:
            - $ref: "#/components/schemas/CorrelationId"
        errors:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/ProblemError"
        status:
          description: The HTTP status code generated by the origin server for this
            occurrence of the problem
          example: 404
          exclusiveMaximum: true
          format: int32
          type: number
          minimum: 100
          maximum: 600
        title:
          description: A short, summary of the problem type. Written in english and readable
          example: Service Unavailable
          pattern: ^[ -~]{0,64}$
          type: string
          maxLength: 64
      required:
        - correlationId
        - status
        - title
      additionalProperties: false
    Pagination:
      type: object
      properties:
        limit:
          format: int32
          type: number
          minimum: 1
          maximum: 50
        offset:
          format: int32
          type: number
          minimum: 0
        total:
          format: int32
          type: number
          minimum: 0
      required:
        - limit
        - offset
        - total
      additionalProperties: false
    FileDownload:
      description: Binary file content
      format: binary
      type: string
    UserId:
      description: Unique identifier of the User
      type: string
      format: uuid
      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
    KeyId:
      description: Unique identifier of the Key
      type: string
      format: base64url
      pattern: ^[A-Za-z0-9_-]*$
    CreatedResource:
      description: Unique identifier of the created resource
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
      required:
        - id
      additionalProperties: false
    KnodeId:
      description: Unique Knode identifier
      type: string
      enum:
        - Orion
        - Lynx
    AgreementState:
      type: string
      enum:
        - Active
        - Suspended
        - Archived
        - PendingConsumerOperatorIdentification
    EserviceVersionState:
      type: string
      enum:
        - Active
        - Suspended
        - Archived
    LocalizedName:
      description: Name of the E-service
      type: object
      properties:
        en:
          type: string
          minLength: 5
          maxLength: 60
      required:
        - en
      additionalProperties: false
    LocalizedDescription:
      description: Description of the E-service
      type: object
      properties:
        en:
          type: string
          minLength: 10
          maxLength: 250
      required:
        - en
      additionalProperties: false
    LocalizedInterfacePrettyName:
      description: Pretty name of the E-service interface document
      type: object
      properties:
        en:
          type: string
          minLength: 5
          maxLength: 60
      required:
        - en
      additionalProperties: false
    EserviceMode:
      type: string
      enum:
        - ProvideData
        - ReceiveData
    EserviceCategory:
      type: object
      properties:
        code:
          type: string
        scheme:
          type: string
      required:
        - code
        - scheme
      additionalProperties: false
    AccessTokenType:
      type: string
      enum:
        - Bearer
        - DPoP
    CompactOrganization:
      description: Organization with only id, knodeId, and name
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        knodeId:
          $ref: "#/components/schemas/KnodeId"
        name:
          type: string
          minLength: 1
      required:
        - id
        - knodeId
        - name
      additionalProperties: false
    Attribute:
      type: object
      properties:
        code:
          type: string
        scheme:
          type: string
      required:
        - code
        - scheme
      additionalProperties: false
    InterfaceDocumentSeed:
      type: object
      properties:
        checksum:
          description: SHA-256 checksum of the uploaded E-service interface document
          type: string
        content:
          description: Base64-encoded file content
          type: string
          format: base64
          pattern: ^$|^(?:[0-9a-zA-Z+/]{4})*(?:(?:[0-9a-zA-Z+/]{2}==)|(?:[0-9a-zA-Z+/]{3}=))?$
        contentType:
          description: MIME type of the uploaded E-service interface document
          type: string
        name:
          description: Name of the uploaded E-service interface document, with extension
          type: string
        prettyName:
          $ref: "#/components/schemas/LocalizedInterfacePrettyName"
      required:
        - checksum
        - content
        - contentType
        - name
        - prettyName
      additionalProperties: false
    EserviceSeed:
      type: object
      properties:
        accessTokenAudience:
          description: Audience for the access token
          type: array
          items:
            type: string
        accessTokenDuration:
          description: Duration of the access token in seconds
          format: int32
          default: 3600
          type: integer
          minimum: 1
          maximum: 86400
        accessTokenType:
          description: Type of the access token
          default: Bearer
          allOf:
            - $ref: "#/components/schemas/AccessTokenType"
        categories:
          description: Categories of the E-service
          type: array
          items:
            $ref: "#/components/schemas/EserviceCategory"
        description:
          $ref: "#/components/schemas/LocalizedDescription"
        interfaceDocument:
          description: Interface document for the E-service
          allOf:
            - $ref: "#/components/schemas/InterfaceDocumentSeed"
        isSignalHubEnabled:
          description: Whether SignalHub is enabled for the E-service
          type: boolean
        maxDailyCallsPerConsumer:
          description: Maximum daily calls per consumer (must be less than or equal to
            maxDailyCallsPerKnode)
          format: int32
          type: integer
          minimum: 1
          maximum: 1000000000
        maxDailyCallsPerKnode:
          description: Maximum daily calls per Knode (must be greater than or equal to
            maxDailyCallsPerConsumer)
          format: int32
          type: integer
          minimum: 1
          maximum: 1000000000
        mode:
          description: Mode of the E-service
          allOf:
            - $ref: "#/components/schemas/EserviceMode"
        name:
          $ref: "#/components/schemas/LocalizedName"
        requiredAttributes:
          description: Required attributes for the E-service
          type: array
          items:
            type: array
            items:
              $ref: "#/components/schemas/Attribute"
      required:
        - accessTokenAudience
        - accessTokenDuration
        - accessTokenType
        - description
        - interfaceDocument
        - maxDailyCallsPerConsumer
        - maxDailyCallsPerKnode
        - name
        - requiredAttributes
      additionalProperties: false
    EservicePatch:
      type: object
      properties:
        categories:
          description: Categories of the E-service
          type: array
          items:
            $ref: "#/components/schemas/EserviceCategory"
        description:
          allOf:
            - $ref: "#/components/schemas/LocalizedDescription"
        name:
          allOf:
            - $ref: "#/components/schemas/LocalizedName"
      additionalProperties: false
    ProducerEservice:
      type: object
      properties:
        activeAgreements:
          description: Number of active agreements
          format: int32
          type: integer
          minimum: 0
          maximum: 9007199254740991
        activePurposes:
          description: Number of active purposes
          format: int32
          type: integer
          minimum: 0
          maximum: 9007199254740991
        categories:
          type: array
          items:
            $ref: "#/components/schemas/EserviceCategory"
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        mode:
          $ref: "#/components/schemas/EserviceMode"
        name:
          $ref: "#/components/schemas/LocalizedName"
        state:
          $ref: "#/components/schemas/EserviceVersionState"
      required:
        - activeAgreements
        - activePurposes
        - categories
        - id
        - mode
        - name
        - state
      additionalProperties: false
    ProducerEservices:
      type: object
      properties:
        pagination:
          $ref: "#/components/schemas/Pagination"
        results:
          type: array
          items:
            $ref: "#/components/schemas/ProducerEservice"
      required:
        - pagination
        - results
      additionalProperties: false
    ProducerEserviceVersionDetails:
      type: object
      properties:
        accessTokenAudience:
          description: Audience for the access token
          type: array
          items:
            type: string
        accessTokenDuration:
          description: Duration of the access token in seconds
          format: int32
          type: integer
          minimum: 1
          maximum: 86400
        accessTokenType:
          description: Type of the access token
          allOf:
            - $ref: "#/components/schemas/AccessTokenType"
        createdAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        id:
          description: Unique identifier of the E-service version
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        interfaceDocument:
          description: Interface document details
          type: object
          properties:
            checksum:
              description: SHA-256 checksum of the E-service interface document
              type: string
            prettyName:
              description: Localized pretty name of the E-service interface
              allOf:
                - $ref: "#/components/schemas/LocalizedInterfacePrettyName"
          required:
            - checksum
            - prettyName
          additionalProperties: false
        maxDailyCallsPerConsumer:
          description: Maximum daily calls per consumer
          format: int32
          type: integer
          minimum: 1
          maximum: 1000000000
        maxDailyCallsPerKnode:
          description: Maximum daily calls per Knode
          format: int32
          type: integer
          minimum: 1
          maximum: 1000000000
        requiredAttributes:
          description: Required attributes for the E-service
          type: array
          items:
            type: array
            items:
              $ref: "#/components/schemas/Attribute"
        state:
          description: State of the version
          allOf:
            - $ref: "#/components/schemas/EserviceVersionState"
        updatedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        versionNumber:
          description: Version number
          format: int32
          type: integer
          minimum: 1
          maximum: 9007199254740991
      required:
        - accessTokenAudience
        - accessTokenDuration
        - accessTokenType
        - createdAt
        - id
        - interfaceDocument
        - maxDailyCallsPerConsumer
        - maxDailyCallsPerKnode
        - requiredAttributes
        - state
        - updatedAt
        - versionNumber
      additionalProperties: false
    ProducerEserviceDetailsCounters:
      type: object
      properties:
        active:
          description: Number of active items
          format: int32
          type: integer
          minimum: 0
          maximum: 9007199254740991
        total:
          description: Total number of items
          format: int32
          type: integer
          minimum: 0
          maximum: 9007199254740991
      required:
        - active
        - total
      additionalProperties: false
    ProducerEserviceDetailsPurposeCounters:
      type: object
      properties:
        active:
          description: Number of active items
          format: int32
          type: integer
          minimum: 0
          maximum: 9007199254740991
        total:
          description: Total number of items
          format: int32
          type: integer
          minimum: 0
          maximum: 9007199254740991
        totalApiCallsPerDay:
          description: Total API calls per day across all Active purposes
          format: int64
          type: integer
          minimum: 0
          maximum: 9007199254740991
      required:
        - active
        - total
        - totalApiCallsPerDay
      additionalProperties: false
    ProducerEserviceDetails:
      type: object
      properties:
        agreements:
          description: Agreement counters
          allOf:
            - $ref: "#/components/schemas/ProducerEserviceDetailsCounters"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/EserviceCategory"
        createdAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        description:
          $ref: "#/components/schemas/LocalizedDescription"
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        isConsumerOperatorIdentificationRequired:
          type: boolean
        isSignalHubEnabled:
          type: boolean
        mode:
          $ref: "#/components/schemas/EserviceMode"
        name:
          $ref: "#/components/schemas/LocalizedName"
        producerId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        purposes:
          description: Purpose counters
          allOf:
            - $ref: "#/components/schemas/ProducerEserviceDetailsPurposeCounters"
        updatedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        version:
          description: Latest version details
          allOf:
            - $ref: "#/components/schemas/ProducerEserviceVersionDetails"
      required:
        - agreements
        - categories
        - createdAt
        - description
        - id
        - isConsumerOperatorIdentificationRequired
        - isSignalHubEnabled
        - mode
        - name
        - producerId
        - purposes
        - updatedAt
        - version
      additionalProperties: false
    GetConsumerCatalogEserviceSearchParams:
      anyOf:
        - type: object
          properties:
            category:
              $ref: "#/components/schemas/EserviceCategory"
            knodeId:
              $ref: "#/components/schemas/KnodeId"
          required:
            - category
            - knodeId
          additionalProperties: false
        - type: object
          properties:
            keywords:
              type: string
              minLength: 1
            knodeId:
              $ref: "#/components/schemas/KnodeId"
          required:
            - keywords
            - knodeId
          additionalProperties: false
        - type: object
          properties:
            category:
              $ref: "#/components/schemas/EserviceCategory"
            keywords:
              type: string
              minLength: 1
            knodeId:
              $ref: "#/components/schemas/KnodeId"
          required:
            - category
            - keywords
            - knodeId
          additionalProperties: false
    ConsumerCatalogEserviceSearchResult:
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/EserviceCategory"
        description:
          $ref: "#/components/schemas/LocalizedDescription"
        hasRequiredAttributes:
          type: boolean
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        latestVersionState:
          $ref: "#/components/schemas/EserviceVersionState"
        mode:
          $ref: "#/components/schemas/EserviceMode"
        name:
          $ref: "#/components/schemas/LocalizedName"
        producer:
          $ref: "#/components/schemas/CompactOrganization"
      required:
        - categories
        - description
        - hasRequiredAttributes
        - id
        - latestVersionState
        - mode
        - name
        - producer
      additionalProperties: false
    ConsumerCatalogEserviceSearchResults:
      type: object
      properties:
        pagination:
          $ref: "#/components/schemas/Pagination"
        results:
          type: array
          items:
            $ref: "#/components/schemas/ConsumerCatalogEserviceSearchResult"
      required:
        - pagination
        - results
      additionalProperties: false
    ConsumerEserviceDetailsProducer:
      type: object
      properties:
        email:
          type: string
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        knodeId:
          $ref: "#/components/schemas/KnodeId"
        name:
          type: string
        notes:
          type: string
      required:
        - email
        - id
        - knodeId
        - name
        - notes
      additionalProperties: false
    ConsumerRequiredAttribute:
      type: object
      properties:
        code:
          type: string
        scheme:
          type: string
        possessed:
          type: boolean
      required:
        - code
        - scheme
        - possessed
      additionalProperties: false
    EserviceAgreementDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        state:
          $ref: "#/components/schemas/AgreementState"
      required:
        - id
        - state
      additionalProperties: false
    ConsumerEserviceDetailsAccessToken:
      type: object
      properties:
        audience:
          type: array
          items:
            type: string
        duration:
          description: Duration of the access token in seconds
          format: int32
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        type:
          $ref: "#/components/schemas/AccessTokenType"
      required:
        - audience
        - duration
        - type
      additionalProperties: false
    ConsumerEserviceDetailsInterfaceDocument:
      type: object
      properties:
        checksum:
          type: string
        name:
          type: string
      required:
        - checksum
        - name
      additionalProperties: false
    ConsumerEserviceDetailsMaxDailyCalls:
      type: object
      properties:
        perConsumer:
          format: int32
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        perKnode:
          format: int32
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
      required:
        - perConsumer
        - perKnode
      additionalProperties: false
    ConsumerEserviceDetails:
      type: object
      properties:
        accessToken:
          $ref: "#/components/schemas/ConsumerEserviceDetailsAccessToken"
        agreement:
          allOf:
            - $ref: "#/components/schemas/EserviceAgreementDetail"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/EserviceCategory"
        description:
          $ref: "#/components/schemas/LocalizedDescription"
        hasRecentlyBeenUpdated:
          description: Indicates whether the E-service, its Agreement, or any of its
            Purposes have been recently updated
          type: boolean
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        identificationRequired:
          type: boolean
        interfaceDocument:
          $ref: "#/components/schemas/ConsumerEserviceDetailsInterfaceDocument"
        isSignalHubEnabled:
          type: boolean
        latestVersionId:
          description: Unique identifier of the latest E-service version
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        maxDailyCalls:
          $ref: "#/components/schemas/ConsumerEserviceDetailsMaxDailyCalls"
        mode:
          $ref: "#/components/schemas/EserviceMode"
        name:
          $ref: "#/components/schemas/LocalizedName"
        producer:
          $ref: "#/components/schemas/ConsumerEserviceDetailsProducer"
        requiredAttributes:
          type: array
          items:
            type: array
            items:
              $ref: "#/components/schemas/ConsumerRequiredAttribute"
        state:
          $ref: "#/components/schemas/EserviceVersionState"
      required:
        - accessToken
        - categories
        - description
        - hasRecentlyBeenUpdated
        - id
        - identificationRequired
        - interfaceDocument
        - isSignalHubEnabled
        - latestVersionId
        - maxDailyCalls
        - mode
        - name
        - producer
        - requiredAttributes
        - state
      additionalProperties: false
