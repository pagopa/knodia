openapi: 3.1.2
info:
  description: Knodia backend-for-frontend API
  title: Knodia BFF API
  version: 1.0.0
components:
  schemas:
    ProblemError:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: "#/components/schemas/ProblemError"
      type: object
      properties:
        code:
          type: string
        detail:
          type: string
      required:
        - code
        - detail
      additionalProperties: false
    Problem:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: "#/components/schemas/Problem"
      type: object
      properties:
        correlationId:
          type: string
        detail:
          type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ProblemError"
        status:
          type: number
        title:
          type: string
        type:
          type: string
      required:
        - correlationId
        - detail
        - errors
        - status
        - title
        - type
      additionalProperties: false
    Pagination:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: "#/components/schemas/Pagination"
      type: object
      properties:
        limit:
          type: number
          minimum: 1
          maximum: 50
        offset:
          type: number
          minimum: 0
        total:
          type: number
          minimum: 0
      required:
        - limit
        - offset
        - total
      additionalProperties: false
    Eservice:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: "#/components/schemas/Eservice"
      type: object
      properties:
        id:
          type: string
      required:
        - id
      additionalProperties: false
    Eservices:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: "#/components/schemas/Eservices"
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Eservice"
        pagination:
          $ref: "#/components/schemas/Pagination"
      required:
        - items
        - pagination
      additionalProperties: false
paths:
  /eservices:
    get:
      operationId: getEservices
      tags:
        - eservice
      parameters:
        - schema:
            type: number
            minimum: 1
            maximum: 50
          in: query
          name: limit
          required: true
          description: Maximum number of items returned
        - schema:
            type: number
            minimum: 0
          in: query
          name: offset
          required: true
          description: Pagination starting position
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Eservices"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
