openapi: 3.0.4
info:
  contact:
    url: https://github.com/pagopa/knodia/issues
  termsOfService: https://knodia.org/
  description: Knodia backend-for-frontend API
  title: Knodia BFF API
  version: 1.0.0
components:
  schemas:
    Pagination:
      type: object
      properties:
        limit:
          format: int32
          type: number
          minimum: 1
          maximum: 50
        offset:
          format: int32
          type: number
          minimum: 0
        total:
          format: int32
          type: number
          minimum: 0
      required:
        - limit
        - offset
        - total
      additionalProperties: false
    ProblemError:
      type: object
      properties:
        code:
          example: 123-4567
          pattern: ^[0-9]{3}-[0-9]{4}$
          description: Internal code of the error
          type: string
          minLength: 8
          maxLength: 8
        detail:
          example: Parameter not valid
          pattern: ^.{0,1024}$
          description: A human readable explanation specific to this occurrence of the
            problem
          type: string
          maxLength: 4096
      required:
        - code
        - detail
      additionalProperties: false
    CorrelationId:
      type: string
      format: uuid
      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
    Problem:
      type: object
      properties:
        correlationId:
          example: 53af4f2d-0c87-41ef-a645-b726a821852b
          description: Unique identifier of the request
          allOf:
            - $ref: "#/components/schemas/CorrelationId"
        errors:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/ProblemError"
        status:
          example: 404
          exclusiveMaximum: true
          format: int32
          description: The HTTP status code generated by the origin server for this
            occurrence of the problem
          type: number
          minimum: 100
          maximum: 600
        title:
          example: Service Unavailable
          pattern: ^[ -~]{0,64}$
          description: A short, summary of the problem type. Written in english and readable
          type: string
          maxLength: 64
      required:
        - correlationId
        - status
        - title
      additionalProperties: false
    LocalizedName:
      description: Name of the E-service
      type: object
      properties:
        en:
          type: string
          minLength: 5
          maxLength: 60
      required:
        - en
      additionalProperties: false
    LocalizedDescription:
      description: Description of the E-service
      type: object
      properties:
        en:
          type: string
          minLength: 10
          maxLength: 250
      required:
        - en
      additionalProperties: false
    EserviceMode:
      type: string
      enum:
        - ProvideData
        - ReceiveData
    EserviceCategory:
      type: object
      properties:
        code:
          type: string
        scheme:
          type: string
      required:
        - code
        - scheme
      additionalProperties: false
    AccessTokenType:
      type: string
      enum:
        - Bearer
        - DPoP
    EserviceAttribute:
      type: object
      properties:
        code:
          type: string
        scheme:
          type: string
      required:
        - code
        - scheme
      additionalProperties: false
    EserviceVersionState:
      type: string
      enum:
        - Active
        - Suspended
        - Archived
    LocalizedText:
      type: object
      properties:
        en:
          type: string
      required:
        - en
      additionalProperties: false
    EserviceInterface:
      type: object
      properties:
        checksum:
          type: string
        contentType:
          type: string
        createdAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        name:
          type: string
        path:
          type: string
        prettyName:
          $ref: "#/components/schemas/LocalizedText"
        updatedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
      required:
        - checksum
        - contentType
        - createdAt
        - id
        - name
        - path
        - prettyName
        - updatedAt
      additionalProperties: false
    EserviceVersion:
      type: object
      properties:
        accessTokenAudience:
          type: array
          items:
            type: string
        accessTokenDuration:
          format: int32
          type: number
        accessTokenType:
          $ref: "#/components/schemas/AccessTokenType"
        createdAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        interfaceDocument:
          $ref: "#/components/schemas/EserviceInterface"
        maxDailyCallsPerConsumer:
          format: int32
          type: number
        maxDailyCallsPerKnode:
          format: int32
          type: number
        requiredAttributes:
          type: array
          items:
            type: array
            items:
              $ref: "#/components/schemas/EserviceAttribute"
        state:
          $ref: "#/components/schemas/EserviceVersionState"
        updatedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        versionNumber:
          format: int32
          type: number
      required:
        - accessTokenAudience
        - accessTokenDuration
        - accessTokenType
        - createdAt
        - id
        - interfaceDocument
        - maxDailyCallsPerConsumer
        - maxDailyCallsPerKnode
        - requiredAttributes
        - state
        - updatedAt
        - versionNumber
      additionalProperties: false
    Eservice:
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/EserviceCategory"
        createdAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        description:
          $ref: "#/components/schemas/LocalizedDescription"
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        isConsumerOperatorIdentificationRequired:
          type: boolean
        isSignalHubEnabled:
          type: boolean
        mode:
          $ref: "#/components/schemas/EserviceMode"
        name:
          $ref: "#/components/schemas/LocalizedName"
        producerId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        updatedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
      required:
        - categories
        - createdAt
        - description
        - id
        - isConsumerOperatorIdentificationRequired
        - isSignalHubEnabled
        - mode
        - name
        - producerId
        - updatedAt
      additionalProperties: false
    Eservices:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Eservice"
        pagination:
          $ref: "#/components/schemas/Pagination"
      required:
        - items
        - pagination
      additionalProperties: false
    EserviceSeed:
      type: object
      properties:
        accessTokenAudience:
          description: Audience for the access token
          type: array
          items:
            type: string
        accessTokenDuration:
          description: Duration of the access token in seconds
          format: int32
          default: 3600
          type: integer
          minimum: 1
          maximum: 86400
        accessTokenType:
          description: Type of the access token
          default: Bearer
          allOf:
            - $ref: "#/components/schemas/AccessTokenType"
        categories:
          description: Categories of the E-service
          type: array
          items:
            $ref: "#/components/schemas/EserviceCategory"
        description:
          $ref: "#/components/schemas/LocalizedDescription"
        isConsumerOperatorIdentificationRequired:
          description: Whether consumer operator identification is required
          type: boolean
        isSignalHubEnabled:
          description: Whether SignalHub is enabled for the E-service
          type: boolean
        maxDailyCallsPerConsumer:
          description: Maximum daily calls per consumer
          format: int32
          type: integer
          minimum: 1
          maximum: 1000000000
        maxDailyCallsPerKnode:
          description: Maximum daily calls per Knode
          format: int32
          type: integer
          minimum: 1
          maximum: 1000000000
        mode:
          description: Mode of the E-service
          allOf:
            - $ref: "#/components/schemas/EserviceMode"
        name:
          $ref: "#/components/schemas/LocalizedName"
        requiredAttributes:
          description: Required attributes for the E-service
          type: array
          items:
            type: array
            items:
              $ref: "#/components/schemas/EserviceAttribute"
      required:
        - accessTokenAudience
        - accessTokenDuration
        - accessTokenType
        - description
        - maxDailyCallsPerConsumer
        - maxDailyCallsPerKnode
        - name
        - requiredAttributes
      additionalProperties: false
    CreatedResource:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
      required:
        - id
      additionalProperties: false
    EserviceDetails:
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/EserviceCategory"
        createdAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        description:
          $ref: "#/components/schemas/LocalizedDescription"
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        isConsumerOperatorIdentificationRequired:
          type: boolean
        isSignalHubEnabled:
          type: boolean
        mode:
          $ref: "#/components/schemas/EserviceMode"
        name:
          $ref: "#/components/schemas/LocalizedName"
        producerId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        updatedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        versions:
          type: array
          items:
            $ref: "#/components/schemas/EserviceVersion"
      required:
        - categories
        - createdAt
        - description
        - id
        - isConsumerOperatorIdentificationRequired
        - isSignalHubEnabled
        - mode
        - name
        - producerId
        - updatedAt
        - versions
      additionalProperties: false
paths:
  /status:
    get:
      operationId: getStatus
      tags:
        - health
      description: Check the health status of the service
      responses:
        "200":
          description: Service status OK
          content:
            application/problem+json:
              schema:
                description: Service status OK
                allOf:
                  - $ref: "#/components/schemas/Problem"
  /eservices:
    get:
      operationId: getEservices
      tags:
        - eservice
      description: Retrieve a list of E-services
      parameters:
        - schema:
            format: int32
            type: number
            minimum: 1
            maximum: 50
          in: query
          name: limit
          required: true
          description: Maximum number of items returned
        - schema:
            format: int32
            type: number
            minimum: 0
          in: query
          name: offset
          required: true
          description: Pagination starting position
      responses:
        "200":
          description: E-services retrieved successfully
          content:
            application/json:
              schema:
                description: E-services retrieved successfully
                allOf:
                  - $ref: "#/components/schemas/Eservices"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                description: Bad Request
                allOf:
                  - $ref: "#/components/schemas/Problem"
    post:
      operationId: createEservice
      tags:
        - eservice
      description: Create a new E-service
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EserviceSeed"
        required: true
      responses:
        "201":
          description: E-service created successfully
          content:
            application/json:
              schema:
                description: E-service created successfully
                allOf:
                  - $ref: "#/components/schemas/CreatedResource"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                description: Bad Request
                allOf:
                  - $ref: "#/components/schemas/Problem"
  /eservices/{eserviceId}:
    get:
      operationId: getEserviceById
      tags:
        - eservice
      description: Retrieve the details of an E-service by its ID
      parameters:
        - schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: path
          name: eserviceId
          required: true
      responses:
        "200":
          description: E-service details retrieved successfully
          content:
            application/json:
              schema:
                description: E-service details retrieved successfully
                allOf:
                  - $ref: "#/components/schemas/EserviceDetails"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                description: Bad Request
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "404":
          description: E-service not found
          content:
            application/problem+json:
              schema:
                description: E-service not found
                allOf:
                  - $ref: "#/components/schemas/Problem"
servers:
  - description: BFF API
    url: /
tags:
  - description: Health check routes
    name: health
  - description: E-services routes
    name: eservice
