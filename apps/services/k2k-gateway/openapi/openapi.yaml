                allOf:
                  - $ref: "#/components/schemas/ConsumerClientAssertionVerificationResponse"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                description: Bad Request
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "404":
          description: Not Found
          content:
