openapi: 3.0.4
info:
  contact:
    url: https://github.com/pagopa/knodia/issues
  termsOfService: https://knodia.org/
  description: API for communicating with other Knodes
  title: Knode to Knode API
  version: 1.0.0
components:
  schemas:
    ProblemError:
      type: object
      properties:
        code:
          description: Internal code of the error
          example: 123-4567
          pattern: ^[0-9]{3}-[0-9]{4}$
          type: string
          minLength: 8
          maxLength: 8
        detail:
          description: A human readable explanation specific to this occurrence of the
            problem
          example: Parameter not valid
          pattern: ^.{0,1024}$
          type: string
          maxLength: 4096
      required:
        - code
        - detail
      additionalProperties: false
    CorrelationId:
      type: string
      format: uuid
      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
    Problem:
      type: object
      properties:
        correlationId:
          description: Unique identifier of the request
          example: 53af4f2d-0c87-41ef-a645-b726a821852b
          allOf:
            - $ref: "#/components/schemas/CorrelationId"
        errors:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/ProblemError"
        status:
          description: The HTTP status code generated by the origin server for this
            occurrence of the problem
          example: 404
          exclusiveMaximum: true
          format: int32
          type: number
          minimum: 100
          maximum: 600
        title:
          description: A short, summary of the problem type. Written in english and readable
          example: Service Unavailable
          pattern: ^[ -~]{0,64}$
          type: string
          maxLength: 64
      required:
        - correlationId
        - status
        - title
      additionalProperties: false
    ExternalKnodeId:
      description: Unique identifier for an external Knode
      type: string
      enum:
        - ORION
        - LYNX
    AgreementState:
      type: string
      enum:
        - ACTIVE
        - SUSPENDED
        - ARCHIVED
    AgreementConsumer:
      description: External consumer of the agreement
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        knodeId:
          $ref: "#/components/schemas/ExternalKnodeId"
      required:
        - id
        - knodeId
      additionalProperties: false
    AgreementAttribute:
      description: Attribute associated to the agreement
      type: object
      properties:
        code:
          type: string
        scheme:
          type: string
      required:
        - code
        - scheme
      additionalProperties: false
    Agreement:
      description: Agreement between a consumer and a producer for an e-service
      type: object
      properties:
        attributes:
          description: Attributes for the Agreement
          type: array
          items:
            $ref: "#/components/schemas/AgreementAttribute"
        consumer:
          $ref: "#/components/schemas/AgreementConsumer"
        createdAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        eserviceId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        eserviceVersionId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        producerId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        state:
          $ref: "#/components/schemas/AgreementState"
        updatedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
      required:
        - attributes
        - consumer
        - createdAt
        - eserviceId
        - eserviceVersionId
        - id
        - producerId
        - state
        - updatedAt
      additionalProperties: false
    AgreementSeed:
      description: Seed data to create a new agreement
      type: object
      properties:
        consumerId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        consumerKnodeId:
          $ref: "#/components/schemas/ExternalKnodeId"
        eserviceId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        eserviceVersionId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
      required:
        - consumerId
        - consumerKnodeId
        - eserviceId
        - eserviceVersionId
      additionalProperties: false
    Pagination:
      type: object
      properties:
        limit:
          format: int32
          type: number
          minimum: 1
          maximum: 50
        offset:
          format: int32
          type: number
          minimum: 0
        total:
          format: int32
          type: number
          minimum: 0
      required:
        - limit
        - offset
        - total
      additionalProperties: false
    EserviceCategory:
      description: Identifies a category of data, standardized within Knodia, which
        the E-Service provides or receives
      type: object
      properties:
        code:
          type: string
        scheme:
          type: string
      required:
        - code
        - scheme
      additionalProperties: false
    GetCatalogEserviceSearchParams:
      anyOf:
        - type: object
          properties:
            keywords:
              description: Search by name or description
              type: string
              minLength: 1
          required:
            - keywords
          additionalProperties: false
        - type: object
          properties:
            category:
              description: Include only E-services belonging to the specified category
              allOf:
                - $ref: "#/components/schemas/EserviceCategory"
          required:
            - category
          additionalProperties: false
        - type: object
          properties:
            keywords:
              description: Search by name or description
              type: string
              minLength: 1
            category:
              description: Include only E-services belonging to the specified category
              allOf:
                - $ref: "#/components/schemas/EserviceCategory"
          required:
            - keywords
            - category
          additionalProperties: false
    EserviceVersionState:
      type: string
      enum:
        - ACTIVE
        - SUSPENDED
        - ARCHIVED
    EserviceMode:
      description: Indicates if the E-Service is intended to provide or receive data
      type: string
      enum:
        - PROVIDE_DATA
        - RECEIVE_DATA
    Attribute:
      description: Identifies an Attribute standardized within Knodia
      type: object
      properties:
        code:
          type: string
          minLength: 1
        scheme:
          type: string
          minLength: 1
      required:
        - code
        - scheme
      additionalProperties: false
    RequiredAttributeGroup:
      description: Describes a group of required Attributes (consumers must possess at
        least one Attribute among them in order to satisfy the requirement)
      type: array
      items:
        $ref: "#/components/schemas/Attribute"
    RequiredAttributes:
      description: Describes the Attributes which a consumer must possess to request
        an Agreement for the E-Service (at least one Attribute for each
        Attribute Group)
      type: array
      items:
        $ref: "#/components/schemas/RequiredAttributeGroup"
    EserviceId:
      description: Unique identifier of the E-Service
      type: string
      format: uuid
      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
    OrganizationId:
      description: Unique identifier of the Organization
      type: string
      format: uuid
      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
    CatalogEserviceSearchResult:
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/EserviceCategory"
        description:
          type: object
          properties:
            en:
              type: string
          required:
            - en
          additionalProperties: false
        id:
          $ref: "#/components/schemas/EserviceId"
        latestVersionRequiredAttributes:
          $ref: "#/components/schemas/RequiredAttributes"
        latestVersionState:
          $ref: "#/components/schemas/EserviceVersionState"
        mode:
          $ref: "#/components/schemas/EserviceMode"
        name:
          type: object
          properties:
            en:
              type: string
          required:
            - en
          additionalProperties: false
        producerId:
          $ref: "#/components/schemas/OrganizationId"
      required:
        - categories
        - description
        - id
        - latestVersionRequiredAttributes
        - latestVersionState
        - mode
        - name
        - producerId
      additionalProperties: false
    CatalogEserviceSearchResults:
      type: object
      properties:
        pagination:
          $ref: "#/components/schemas/Pagination"
        results:
          type: array
          items:
            $ref: "#/components/schemas/CatalogEserviceSearchResult"
      required:
        - pagination
        - results
      additionalProperties: false
paths:
  /status:
    get:
      operationId: getStatus
      tags:
        - health
      description: Check the health status of the service
      responses:
        "200":
          description: Service status OK
          content:
            application/problem+json:
              schema:
                description: Service status OK
                allOf:
                  - $ref: "#/components/schemas/Problem"
  /catalog:
    post:
      operationId: getCatalogEservices
      summary: Search for E-services
      tags:
        - operation
        - eservice
      description: Search for E-services according to search criteria and considering
        only E-services with an active or suspended Version
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetCatalogEserviceSearchParams"
        required: true
      parameters:
        - schema:
            format: int32
            type: number
            minimum: 1
            maximum: 50
          in: query
          name: limit
          required: true
          description: Maximum number of items returned
        - schema:
            format: int32
            type: number
            minimum: 0
          in: query
          name: offset
          required: true
          description: Pagination starting position
      responses:
        "200":
          description: E-service search results retrieved (sorted by most recently updated
            first)
          content:
            application/json:
              schema:
                description: E-service search results retrieved (sorted by most recently updated
                  first)
                allOf:
                  - $ref: "#/components/schemas/CatalogEserviceSearchResults"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                description: Bad Request
                allOf:
                  - $ref: "#/components/schemas/Problem"
  /agreements:
    post:
      operationId: createAgreement
      tags:
        - operation
        - agreement
      description: Create a new Agreement
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgreementSeed"
        required: true
      responses:
        "201":
          description: Agreement created successfully
          content:
            application/json:
              schema:
                description: Agreement created successfully
                allOf:
                  - $ref: "#/components/schemas/Agreement"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                description: Bad Request
                allOf:
                  - $ref: "#/components/schemas/Problem"
servers:
  - description: Knode to Knode API
    url: /
tags:
  - description: Health check routes
    name: health
  - description: Routes to access resources following RESTful conventions
    name: resource
  - description: Ad-hoc routes to simplify frequent use cases
    name: operation
