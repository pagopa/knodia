openapi: 3.0.4
info:
  contact:
    url: https://github.com/pagopa/knodia/issues
  termsOfService: https://knodia.org/
  description: API for communicating with other Knodes
  title: Knode to Knode Gateway API
  version: 1.0.0
components:
  schemas:
    ProblemError:
      type: object
      properties:
        code:
          description: Internal code of the error
          example: 123-4567
          pattern: ^[0-9]{3}-[0-9]{4}$
          type: string
          minLength: 8
          maxLength: 8
        detail:
          description: A human readable explanation specific to this occurrence of the
            problem
          example: Parameter not valid
          pattern: ^.{0,1024}$
          type: string
          maxLength: 4096
      required:
        - code
        - detail
      additionalProperties: false
    CorrelationId:
      type: string
      format: uuid
      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
    Problem:
      type: object
      properties:
        correlationId:
          description: Unique identifier of the request
          example: 53af4f2d-0c87-41ef-a645-b726a821852b
          allOf:
            - $ref: "#/components/schemas/CorrelationId"
        errors:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/ProblemError"
        status:
          description: The HTTP status code generated by the origin server for this
            occurrence of the problem
          example: 404
          exclusiveMaximum: true
          format: int32
          type: number
          minimum: 100
          maximum: 600
        title:
          description: A short, summary of the problem type. Written in english and readable
          example: Service Unavailable
          pattern: ^[ -~]{0,64}$
          type: string
          maxLength: 64
      required:
        - correlationId
        - status
        - title
      additionalProperties: false
    Pagination:
      type: object
      properties:
        limit:
          format: int32
          type: number
          minimum: 1
          maximum: 50
        offset:
          format: int32
          type: number
          minimum: 0
        total:
          format: int32
          type: number
          minimum: 0
      required:
        - limit
        - offset
        - total
      additionalProperties: false
    LocalizedName:
      description: Name of the E-service
      type: object
      properties:
        en:
          type: string
          minLength: 5
          maxLength: 60
      required:
        - en
      additionalProperties: false
    LocalizedDescription:
      description: Description of the E-service
      type: object
      properties:
        en:
          type: string
          minLength: 10
          maxLength: 250
      required:
        - en
      additionalProperties: false
    LocalizedInterfacePrettyName:
      description: Pretty name of the E-service interface document
      type: object
      properties:
        en:
          type: string
          minLength: 5
          maxLength: 60
      required:
        - en
      additionalProperties: false
    EserviceMode:
      description: Indicates if the E-Service is intended to provide or receive data
      type: string
      enum:
        - PROVIDE_DATA
        - RECEIVE_DATA
    EserviceCategory:
      description: Identifies a category of data, standardized within Knodia, which
        the E-Service provides or receives
      type: object
      properties:
        code:
          type: string
        scheme:
          type: string
      required:
        - code
        - scheme
      additionalProperties: false
    AccessTokenType:
      type: string
      enum:
        - BEARER
        - DPOP
    EserviceAttribute:
      type: object
      properties:
        code:
          type: string
        scheme:
          type: string
      required:
        - code
        - scheme
      additionalProperties: false
    EServiceRequiredAttributeGroup:
      description: Described a group of required Attributes (consumers must possess at
        least one Attribute among them in order to satisfy the requirement)
      type: array
      items:
        $ref: "#/components/schemas/EserviceAttribute"
    EserviceRequiredAttributes:
      description: Describes the Attributes which a consumer must possess to request
        an Agreement for the E-Service (at least one Attribute for each
        Attribute Group)
      type: array
      items:
        $ref: "#/components/schemas/EServiceRequiredAttributeGroup"
    EserviceVersionState:
      type: string
      enum:
        - ACTIVE
        - SUSPENDED
        - ARCHIVED
    GetCatalogEserviceSearchParams:
      anyOf:
        - type: object
          properties:
            keywords:
              type: string
              minLength: 1
          required:
            - keywords
          additionalProperties: false
        - type: object
          properties:
            category:
              $ref: "#/components/schemas/EserviceCategory"
          required:
            - category
          additionalProperties: false
        - allOf:
            - type: object
              properties:
                keywords:
                  type: string
                  minLength: 1
              required:
                - keywords
              additionalProperties: false
            - type: object
              properties:
                category:
                  $ref: "#/components/schemas/EserviceCategory"
              required:
                - category
              additionalProperties: false
    EserviceId:
      description: Unique identifier of the E-Service
      type: string
      format: uuid
      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
    OrganizationId:
      description: Unique identifier of the Organization
      type: string
      format: uuid
      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
    CatalogEserviceSearchResult:
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/EserviceCategory"
        description:
          $ref: "#/components/schemas/LocalizedDescription"
        id:
          $ref: "#/components/schemas/EserviceId"
        latestVersionRequiredAttributes:
          $ref: "#/components/schemas/EserviceRequiredAttributes"
        latestVersionState:
          $ref: "#/components/schemas/EserviceVersionState"
        mode:
          $ref: "#/components/schemas/EserviceMode"
        name:
          $ref: "#/components/schemas/LocalizedName"
        producerId:
          $ref: "#/components/schemas/OrganizationId"
      required:
        - categories
        - description
        - id
        - latestVersionRequiredAttributes
        - latestVersionState
        - mode
        - name
        - producerId
      additionalProperties: false
    CatalogEserviceSearchResults:
      type: object
      properties:
        pagination:
          $ref: "#/components/schemas/Pagination"
        results:
          type: array
          items:
            $ref: "#/components/schemas/CatalogEserviceSearchResult"
      required:
        - pagination
        - results
      additionalProperties: false
paths:
  /status:
    get:
      operationId: getStatus
      tags:
        - health
      description: Check the health status of the service
      responses:
        "200":
          description: Service status OK
          content:
            application/problem+json:
              schema:
                description: Service status OK
                allOf:
                  - $ref: "#/components/schemas/Problem"
  /catalog:
    post:
      operationId: getCatalogEservices
      summary: Search for E-Services
      tags:
        - operations
      description: Search for E-Services according to search criteria and considering
        only E-Services with an active or suspended Version
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetCatalogEserviceSearchParams"
        required: true
      parameters:
        - schema:
            format: int32
            type: number
            minimum: 1
            maximum: 50
          in: query
          name: limit
          required: true
          description: Maximum number of items returned
        - schema:
            format: int32
            type: number
            minimum: 0
          in: query
          name: offset
          required: true
          description: Pagination starting position
      responses:
        "200":
          description: E-Service search results retrieved (sorted by most recently updated
            first)
          content:
            application/json:
              schema:
                description: E-Service search results retrieved (sorted by most recently updated
                  first)
                allOf:
                  - $ref: "#/components/schemas/CatalogEserviceSearchResults"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                description: Bad Request
                allOf:
                  - $ref: "#/components/schemas/Problem"
servers:
  - description: Knode to Knode Gateway
    url: /
tags:
  - description: Health check routes
    name: health
  - description: Routes to access resources following RESTful conventions
    name: resources
  - description: Ad-hoc routes to simplify frequent use cases
    name: operations
