openapi: 3.0.4
info:
  contact:
    url: https://github.com/pagopa/knodia/issues
  termsOfService: https://knodia.org/
  description: API for communicating with other Knodes
  title: Knode to Knode API
  version: 1.0.0
components:
  schemas:
    ProblemError:
      type: object
      properties:
        code:
          description: Internal code of the error
          example: 123-4567
          pattern: ^[0-9]{3}-[0-9]{4}$
          type: string
          minLength: 8
          maxLength: 8
        detail:
          description: A human readable explanation specific to this occurrence of the
            problem
          example: Parameter not valid
          pattern: ^.{0,1024}$
          type: string
          maxLength: 4096
      required:
        - code
        - detail
      additionalProperties: false
    CorrelationId:
      type: string
      format: uuid
      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
    Problem:
      type: object
      properties:
        correlationId:
          description: Unique identifier of the request
          example: 53af4f2d-0c87-41ef-a645-b726a821852b
          allOf:
            - $ref: "#/components/schemas/CorrelationId"
        errors:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/ProblemError"
        status:
          description: The HTTP status code generated by the origin server for this
            occurrence of the problem
          example: 404
          exclusiveMaximum: true
          format: int32
          type: number
          minimum: 100
          maximum: 600
        title:
          description: A short, summary of the problem type. Written in english and readable
          example: Service Unavailable
          pattern: ^[ -~]{0,64}$
          type: string
          maxLength: 64
      required:
        - correlationId
        - status
        - title
      additionalProperties: false
    Pagination:
      type: object
      properties:
        limit:
          format: int32
          type: number
          minimum: 1
          maximum: 50
        offset:
          format: int32
          type: number
          minimum: 0
        total:
          format: int32
          type: number
          minimum: 0
      required:
        - limit
        - offset
        - total
      additionalProperties: false
    OrganizationId:
      description: Unique identifier of the Organization
      type: string
      format: uuid
      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
    EserviceCategory:
      description: Identifies a category of data, standardized within Knodia, which
        the E-Service provides or receives
      type: object
      properties:
        code:
          type: string
        scheme:
          type: string
      required:
        - code
        - scheme
      additionalProperties: false
    GetCatalogEserviceSearchParams:
      anyOf:
        - type: object
          properties:
            keywords:
              description: Search by name or description
              type: string
              minLength: 1
          required:
            - keywords
          additionalProperties: false
        - type: object
          properties:
            category:
              description: Include only E-services belonging to the specified category
              allOf:
                - $ref: "#/components/schemas/EserviceCategory"
          required:
            - category
          additionalProperties: false
        - type: object
          properties:
            keywords:
              description: Search by name or description
              type: string
              minLength: 1
            category:
              description: Include only E-services belonging to the specified category
              allOf:
                - $ref: "#/components/schemas/EserviceCategory"
          required:
            - keywords
            - category
          additionalProperties: false
    EserviceVersionState:
      type: string
      enum:
        - ACTIVE
        - SUSPENDED
        - ARCHIVED
    AccessTokenType:
      description: Type of the access token
      type: string
      enum:
        - BEARER
        - DPOP
    EserviceMode:
      description: Indicates if the E-Service is intended to provide or receive data
      type: string
      enum:
        - PROVIDE_DATA
        - RECEIVE_DATA
    Attribute:
      description: Identifies an Attribute standardized within Knodia
      type: object
      properties:
        code:
          type: string
          minLength: 1
        scheme:
          type: string
          minLength: 1
      required:
        - code
        - scheme
      additionalProperties: false
    RequiredAttributeGroup:
      description: Describes a group of required Attributes (consumers must possess at
        least one Attribute among them in order to satisfy the requirement)
      type: array
      items:
        $ref: "#/components/schemas/Attribute"
    RequiredAttributes:
      description: Describes the Attributes which a consumer must possess to request
        an Agreement for the E-Service (at least one Attribute for each
        Attribute Group)
      type: array
      items:
        $ref: "#/components/schemas/RequiredAttributeGroup"
    EserviceId:
      description: Unique identifier of the E-service
      type: string
      format: uuid
      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
    CatalogEserviceSearchResult:
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/EserviceCategory"
        description:
          type: object
          properties:
            en:
              type: string
          required:
            - en
          additionalProperties: false
        id:
          $ref: "#/components/schemas/EserviceId"
        latestVersionRequiredAttributes:
          $ref: "#/components/schemas/RequiredAttributes"
        latestVersionState:
          $ref: "#/components/schemas/EserviceVersionState"
        mode:
          $ref: "#/components/schemas/EserviceMode"
        name:
          type: object
          properties:
            en:
              type: string
          required:
            - en
          additionalProperties: false
        producerId:
          $ref: "#/components/schemas/OrganizationId"
      required:
        - categories
        - description
        - id
        - latestVersionRequiredAttributes
        - latestVersionState
        - mode
        - name
        - producerId
      additionalProperties: false
    CatalogEserviceSearchResults:
      type: object
      properties:
        pagination:
          $ref: "#/components/schemas/Pagination"
        results:
          type: array
          items:
            $ref: "#/components/schemas/CatalogEserviceSearchResult"
      required:
        - pagination
        - results
      additionalProperties: false
    Eservice:
      type: object
      properties:
        categories:
          description: Categories of data the E-service provides or receives
          type: array
          items:
            $ref: "#/components/schemas/EserviceCategory"
        description:
          description: Human-readable description of the E-service
          type: object
          properties:
            en:
              type: string
          required:
            - en
          additionalProperties: false
        id:
          $ref: "#/components/schemas/EserviceId"
        isConsumerOperatorIdentificationRequired:
          description: Indicates whether a consumer operator must log in to the producer
            Knode directly to confirm Agreement submission
          type: boolean
        isSignalHubEnabled:
          description: Whether the E-service supports Signal Hub notifications
          type: boolean
        mode:
          $ref: "#/components/schemas/EserviceMode"
        name:
          description: Human-readable name of the E-service
          type: object
          properties:
            en:
              type: string
          required:
            - en
          additionalProperties: false
        producerId:
          $ref: "#/components/schemas/OrganizationId"
        updatedAt:
          description: Last update timestamp of the E-service
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
      required:
        - categories
        - description
        - id
        - isConsumerOperatorIdentificationRequired
        - isSignalHubEnabled
        - mode
        - name
        - producerId
        - updatedAt
      additionalProperties: false
    EserviceVersionInterfaceDocument:
      type: object
      properties:
        checksum:
          description: Integrity checksum of the file
          type: string
        contentType:
          description: The content type of the file
          type: string
        id:
          description: Unique identifier of the Interface Document
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        name:
          description: The name of the file
          type: string
        prettyName:
          description: A human-readable name for the file
          type: object
          properties:
            en:
              type: string
          required:
            - en
          additionalProperties: false
        updatedAt:
          description: The date and time when the file was last updated
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
      required:
        - checksum
        - contentType
        - id
        - name
        - prettyName
        - updatedAt
      additionalProperties: false
    EserviceVersion:
      type: object
      properties:
        accessTokenAudience:
          description: List of audiences for the access token
          type: array
          items:
            type: string
        accessTokenDuration:
          description: Duration of the access token in seconds
          format: int32
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        accessTokenType:
          $ref: "#/components/schemas/AccessTokenType"
        id:
          description: Unique identifier of the E-service Version
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        interfaceDocument:
          description: Metadata of the Interface Document associated with this Version
          allOf:
            - $ref: "#/components/schemas/EserviceVersionInterfaceDocument"
        maxDailyCallsPerConsumer:
          description: Maximum number of daily calls that this Version can afford per
            consumer
          format: int32
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        maxDailyCallsPerKnode:
          description: Maximum number of daily calls that this Version can afford per Knode
          format: int32
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        requiredAttributes:
          $ref: "#/components/schemas/RequiredAttributes"
        state:
          description: Current state of the Version
          allOf:
            - $ref: "#/components/schemas/EserviceVersionState"
        updatedAt:
          description: Last update timestamp of the Version
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        versionNumber:
          description: Progressive version number
          format: int32
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
      required:
        - accessTokenAudience
        - accessTokenDuration
        - accessTokenType
        - id
        - interfaceDocument
        - maxDailyCallsPerConsumer
        - maxDailyCallsPerKnode
        - requiredAttributes
        - state
        - updatedAt
        - versionNumber
      additionalProperties: false
paths:
  /status:
    get:
      operationId: getStatus
      tags:
        - health
      description: Check the health status of the service
      responses:
        "200":
          description: Service status OK
          content:
            application/problem+json:
              schema:
                description: Service status OK
                allOf:
                  - $ref: "#/components/schemas/Problem"
  /catalog:
    post:
      operationId: getCatalogEservices
      summary: Search for E-services
      tags:
        - operation
        - eservice
      description: Search for E-services according to search criteria and considering
        only E-services with an active or suspended Version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetCatalogEserviceSearchParams"
      parameters:
        - schema:
            format: int32
            type: number
            minimum: 1
            maximum: 50
          in: query
          name: limit
          required: true
          description: Maximum number of items returned
        - schema:
            format: int32
            type: number
            minimum: 0
          in: query
          name: offset
          required: true
          description: Pagination starting position
      responses:
        "200":
          description: E-service search results retrieved (sorted by most recently updated
            first)
          content:
            application/json:
              schema:
                description: E-service search results retrieved (sorted by most recently updated
                  first)
                allOf:
                  - $ref: "#/components/schemas/CatalogEserviceSearchResults"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                description: Bad Request
                allOf:
                  - $ref: "#/components/schemas/Problem"
  /eservices/{eserviceId}:
    get:
      operationId: getEservice
      summary: Get E-service
      tags:
        - resource
        - eservice
      description: Retrieve an E-service
      parameters:
        - schema:
            $ref: "#/components/schemas/EserviceId"
          in: path
          name: eserviceId
          required: true
      responses:
        "200":
          description: E-service retrieved successfully
          content:
            application/json:
              schema:
                description: E-service retrieved successfully
                allOf:
                  - $ref: "#/components/schemas/Eservice"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                description: Bad Request
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "404":
          description: E-service not found
          content:
            application/problem+json:
              schema:
                description: E-service not found
                allOf:
                  - $ref: "#/components/schemas/Problem"
  /eservices/{eserviceId}/versions/latest:
    get:
      operationId: getEserviceLatestVersion
      summary: Get E-service latest version
      tags:
        - resource
        - eservice
      description: Retrieve the latest Version of an E-service
      parameters:
        - schema:
            $ref: "#/components/schemas/EserviceId"
          in: path
          name: eserviceId
          required: true
      responses:
        "200":
          description: E-service latest Version retrieved successfully
          content:
            application/json:
              schema:
                description: E-service latest Version retrieved successfully
                allOf:
                  - $ref: "#/components/schemas/EserviceVersion"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                description: Bad Request
                allOf:
                  - $ref: "#/components/schemas/Problem"
        "404":
          description: E-service not found
          content:
            application/problem+json:
              schema:
                description: E-service not found
                allOf:
                  - $ref: "#/components/schemas/Problem"
servers:
  - description: Knode to Knode API
    url: /
tags:
  - description: Health check routes
    name: health
  - description: Routes to access resources following RESTful conventions
    name: resource
  - description: Ad-hoc routes to simplify frequent use cases
    name: operation
  - description: Routes related to E-services
    name: eservice
