openapi: 3.0.4
info:
  contact:
    url: https://github.com/pagopa/knodia/issues
  termsOfService: https://knodia.org/
  description: API for communicating with a Knode
  title: Knode to Knode API
  version: 1.0.0
components:
  schemas:
    ProblemError:
      type: object
      properties:
        code:
          type: string
          minLength: 8
          maxLength: 9
          description: Internal code of the error
          example: 123-4567
          pattern: ^[0-9]{3}-[0-9]{4,5}$
        detail:
          type: string
          maxLength: 4096
          description: A human readable explanation specific to this occurrence of the
            problem
          example: Parameter not valid
          pattern: ^.{0,1024}$
      required:
        - code
        - detail
      additionalProperties: false
    CorrelationId:
      type: string
      format: uuid
      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
    Problem:
      type: object
      properties:
        correlationId:
          description: Unique identifier of the request
          example: 53af4f2d-0c87-41ef-a645-b726a821852b
          allOf:
            - $ref: "#/components/schemas/CorrelationId"
        errors:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/ProblemError"
        status:
          type: number
          minimum: 100
          maximum: 600
          description: The HTTP status code generated by the origin server for this
            occurrence of the problem
          example: 404
          exclusiveMaximum: true
          format: int32
        title:
          type: string
          maxLength: 64
          description: A short, summary of the problem type. Written in english and readable
          example: Service Unavailable
          pattern: ^[ -~]{0,64}$
      required:
        - correlationId
        - status
        - title
      additionalProperties: false
    Pagination:
      type: object
      properties:
        limit:
          type: number
          minimum: 1
          maximum: 50
          format: int32
        offset:
          type: number
          minimum: 0
          format: int32
        total:
          type: number
          minimum: 0
          format: int32
      required:
        - limit
        - offset
        - total
      additionalProperties: false
    FileDownload:
      type: string
      description: Binary file content
      format: binary
    OrganizationId:
      type: string
      format: uuid
      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
      description: Unique identifier of the Organization
    KeyId:
      type: string
      format: base64url
      pattern: ^[A-Za-z0-9_-]*$
      description: Unique identifier of the Key
    CreatedResource:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
      required:
        - id
      additionalProperties: false
      description: Unique identifier of the created resource
    Attribute:
      type: object
      properties:
        code:
          type: string
          minLength: 1
        scheme:
          type: string
          minLength: 1
      required:
        - code
        - scheme
      additionalProperties: false
      description: Identifies an Attribute standardized within Knodia
    EserviceCategory:
      type: object
      properties:
        code:
          type: string
        scheme:
          type: string
      required:
        - code
        - scheme
      additionalProperties: false
      description: Identifies a category of data, standardized within Knodia, which
        the E-service provides or receives
    GetCatalogEserviceSearchParams:
      anyOf:
        - type: object
          properties:
            keywords:
              type: string
              minLength: 1
              description: Search by name or description
          required:
            - keywords
          additionalProperties: false
        - type: object
          properties:
            category:
              description: Include only E-services belonging to the specified category
              allOf:
                - $ref: "#/components/schemas/EserviceCategory"
          required:
            - category
          additionalProperties: false
        - type: object
          properties:
            keywords:
              type: string
              minLength: 1
              description: Search by name or description
            category:
              description: Include only E-services belonging to the specified category
              allOf:
                - $ref: "#/components/schemas/EserviceCategory"
          required:
            - keywords
            - category
          additionalProperties: false
    EserviceVersionState:
      type: string
      enum:
        - ACTIVE
        - SUSPENDED
        - ARCHIVED
    AccessTokenType:
      type: string
      enum:
        - BEARER
        - DPOP
      description: Type of the access token
    EserviceMode:
      type: string
      enum:
        - PROVIDE_DATA
        - RECEIVE_DATA
      description: Indicates if the E-service is intended to provide or receive data
    RequiredAttributeGroup:
      type: array
      items:
        $ref: "#/components/schemas/Attribute"
      description: Describes a group of required Attributes (Consumers must possess at
        least one Attribute among them in order to satisfy the requirement)
    RequiredAttributes:
      type: array
      items:
        $ref: "#/components/schemas/RequiredAttributeGroup"
      description: Describes the Attributes which a consumer must possess to request
        an Agreement for the E-service (at least one Attribute for each
        Attribute Group)
    EserviceId:
      type: string
      format: uuid
      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
      description: Unique identifier of the E-service
    EserviceVersionId:
      type: string
      format: uuid
      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
      description: Unique identifier of the E-service version
    CatalogEserviceSearchResult:
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/EserviceCategory"
          description: Categories of data the E-service provides or receives
        description:
          type: object
          properties:
            en:
              type: string
          required:
            - en
          additionalProperties: false
          description: Human-readable description of the E-service
        id:
          $ref: "#/components/schemas/EserviceId"
        latestVersionRequiredAttributes:
          description: Attributes required by the latest version of the E-service
          allOf:
            - $ref: "#/components/schemas/RequiredAttributes"
        latestVersionState:
          description: Current state of the latest version of the E-service
          allOf:
            - $ref: "#/components/schemas/EserviceVersionState"
        mode:
          $ref: "#/components/schemas/EserviceMode"
        name:
          type: object
          properties:
            en:
              type: string
          required:
            - en
          additionalProperties: false
          description: Human-readable name of the E-service
        producerId:
          $ref: "#/components/schemas/OrganizationId"
        updatedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
          description: Last update timestamp of the E-service
      required:
        - categories
        - description
        - id
        - latestVersionRequiredAttributes
        - latestVersionState
        - mode
        - name
        - producerId
        - updatedAt
      additionalProperties: false
    CatalogEserviceSearchResults:
      type: object
      properties:
        pagination:
          $ref: "#/components/schemas/Pagination"
        results:
          type: array
          items:
            $ref: "#/components/schemas/CatalogEserviceSearchResult"
      required:
        - pagination
        - results
      additionalProperties: false
    Eservice:
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/EserviceCategory"
          description: Categories of data the E-service provides or receives
        description:
          type: object
          properties:
            en:
              type: string
          required:
            - en
          additionalProperties: false
          description: Human-readable description of the E-service
        id:
          $ref: "#/components/schemas/EserviceId"
        isConsumerOperatorIdentificationRequired:
          type: boolean
          description: Indicates whether a consumer operator must log in to the producer
            Knode directly to confirm Agreement submission
        isSignalHubEnabled:
          type: boolean
          description: Whether the E-service supports Signal Hub notifications
        mode:
          $ref: "#/components/schemas/EserviceMode"
        name:
          type: object
          properties:
            en:
              type: string
          required:
            - en
          additionalProperties: false
          description: Human-readable name of the E-service
        producerId:
          $ref: "#/components/schemas/OrganizationId"
        updatedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
          description: Last update timestamp of the E-service
      required:
        - categories
        - description
        - id
        - isConsumerOperatorIdentificationRequired
        - isSignalHubEnabled
        - mode
        - name
        - producerId
        - updatedAt
      additionalProperties: false
    EserviceVersionInterfaceDocument:
      type: object
      properties:
        checksum:
          type: string
          description: SHA-256 integrity checksum of the file
        contentType:
          type: string
          description: The MIME content type of the file
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          description: Unique identifier of the Interface Document
        name:
          type: string
          description: The name of the file
        prettyName:
          type: object
          properties:
            en:
              type: string
          required:
            - en
          additionalProperties: false
          description: A human-readable name for the file
        updatedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
          description: Last update timestamp of the Interface Document
      required:
        - checksum
        - contentType
        - id
        - name
        - prettyName
        - updatedAt
      additionalProperties: false
    EserviceVersion:
      type: object
      properties:
        accessTokenAudience:
          type: array
          items:
            type: string
          description: List of audiences for the access token
        accessTokenDuration:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: Duration of the access token in seconds
          format: int32
        accessTokenType:
          $ref: "#/components/schemas/AccessTokenType"
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          description: Unique identifier of the E-service Version
        interfaceDocument:
          description: Metadata of the Interface Document associated with this Version
          allOf:
            - $ref: "#/components/schemas/EserviceVersionInterfaceDocument"
        maxDailyCallsPerConsumer:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: Maximum number of daily calls that this Version can afford per
            consumer
          format: int32
        maxDailyCallsPerKnode:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: Maximum number of daily calls that this Version can afford per Knode
          format: int32
        requiredAttributes:
          $ref: "#/components/schemas/RequiredAttributes"
        state:
          description: Current state of the Version
          allOf:
            - $ref: "#/components/schemas/EserviceVersionState"
        updatedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
          description: Last update timestamp of the Version
        versionNumber:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: Progressive version number
          format: int32
      required:
        - accessTokenAudience
        - accessTokenDuration
        - accessTokenType
        - id
        - interfaceDocument
        - maxDailyCallsPerConsumer
        - maxDailyCallsPerKnode
        - requiredAttributes
        - state
        - updatedAt
        - versionNumber
      additionalProperties: false
    Eservices:
      type: object
      properties:
        pagination:
          $ref: "#/components/schemas/Pagination"
        results:
          type: array
          items:
            $ref: "#/components/schemas/Eservice"
      required:
        - pagination
        - results
      additionalProperties: false
    KnodeId:
      type: string
      enum:
        - ORION
        - LYNX
      description: Unique Knode identifier
    AgreementId:
      type: string
      format: uuid
      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
      description: Unique identifier of the Agreement
    AgreementConsumer:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/OrganizationId"
        knodeId:
          $ref: "#/components/schemas/KnodeId"
      required:
        - id
        - knodeId
      additionalProperties: false
      description: Consumer Organization of the Agreement
    AgreementSeed:
      type: object
      properties:
        consumerAttributes:
          type: array
          items:
            $ref: "#/components/schemas/Attribute"
          description: Consumer Organization Attributes
        consumerId:
          $ref: "#/components/schemas/OrganizationId"
        eserviceId:
          $ref: "#/components/schemas/EserviceId"
        eserviceVersionId:
          $ref: "#/components/schemas/EserviceVersionId"
      required:
        - consumerAttributes
        - consumerId
        - eserviceId
        - eserviceVersionId
      additionalProperties: false
      description: Seed data to create a new Agreement
    AgreementState:
      type: string
      enum:
        - ACTIVE
        - SUSPENDED
        - ARCHIVED
        - PENDING_CONSUMER_OPERATOR_IDENTIFICATION
      description: Describes the states an Agreement can be in
    Agreement:
      type: object
      properties:
        attributes:
          type: array
          items:
            $ref: "#/components/schemas/Attribute"
          description: Describes the Attributes of the E-service that the Consumer
            possesses when the Agreement is activated (must satisfy at least one
            Attribute for each Required Attribute Group defined by the
            E-service)
        consumer:
          $ref: "#/components/schemas/AgreementConsumer"
        eserviceId:
          $ref: "#/components/schemas/EserviceId"
        eserviceVersionId:
          $ref: "#/components/schemas/EserviceVersionId"
        id:
          $ref: "#/components/schemas/AgreementId"
        producerId:
          $ref: "#/components/schemas/OrganizationId"
        state:
          $ref: "#/components/schemas/AgreementState"
        suspendedByConsumerAt:
          nullable: true
          description: Timestamp when the Agreement was suspended by the Consumer
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        suspendedByProducerAt:
          nullable: true
          description: Timestamp when the Agreement was suspended by the Producer
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        updatedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
      required:
        - attributes
        - consumer
        - eserviceId
        - eserviceVersionId
        - id
        - producerId
        - state
        - suspendedByConsumerAt
        - suspendedByProducerAt
        - updatedAt
      additionalProperties: false
      description: Agreement between a Consumer and a Producer for an E-service
    CreatedAgreementResource:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        producerId:
          $ref: "#/components/schemas/OrganizationId"
      required:
        - id
        - producerId
      additionalProperties: false
      description: Unique identifier of the created Agreement resource along with the
        E-service Producer ID
    Agreements:
      type: object
      properties:
        pagination:
          $ref: "#/components/schemas/Pagination"
        results:
          type: array
          items:
            $ref: "#/components/schemas/Agreement"
      required:
        - pagination
        - results
      additionalProperties: false
    MagicLink:
      type: object
      properties:
        expiresAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
          description: ISO 8601 timestamp after which the magic link is no longer valid
        url:
          type: string
          format: uri
          description: Absolute URL of the target Knode's frontend, carrying a signed
            token for the action
      required:
        - expiresAt
        - url
      additionalProperties: false
      description: A signed, single-action link a Consumer user can follow to perform
        an action on the Producer Knode's frontend
    ConsumerClientAssertionVerificationRequest:
      type: object
      properties:
        keychainId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          description: Unique identifier of the Consumer Keychain
        kid:
          $ref: "#/components/schemas/KeyId"
        purposeId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          description: Unique identifier of the Purpose
      required:
        - keychainId
        - kid
        - purposeId
      additionalProperties: false
    KnodeApiClientAssertionVerificationRequest:
      type: object
      properties:
        keychainId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          description: Unique identifier of the Knode API Keychain
        kid:
          $ref: "#/components/schemas/KeyId"
      required:
        - keychainId
        - kid
      additionalProperties: false
    PublicKeyForVerification:
      type: object
      properties:
        algorithm:
          type: string
        encodedPem:
          type: string
        format:
          type: string
        kid:
          $ref: "#/components/schemas/KeyId"
      required:
        - algorithm
        - encodedPem
        - format
        - kid
      additionalProperties: false
    ConsumerClientAssertionVerificationResponse:
      type: object
      properties:
        consumerAttributes:
          type: array
          items:
            $ref: "#/components/schemas/Attribute"
          description: Attributes of the Consumer organization
        publicKey:
          $ref: "#/components/schemas/PublicKeyForVerification"
      required:
        - consumerAttributes
        - publicKey
      additionalProperties: false
    KnodeApiClientAssertionVerificationResponse:
      type: object
      properties:
        ownerId:
          description: Organization that owns the Knode API Keychain
          allOf:
            - $ref: "#/components/schemas/OrganizationId"
        publicKey:
          $ref: "#/components/schemas/PublicKeyForVerification"
      required:
        - ownerId
        - publicKey
      additionalProperties: false
    Organization:
      type: object
      properties:
        attributes:
          type: array
          items:
            $ref: "#/components/schemas/Attribute"
          description: Attributes associated with the Organization
        id:
          $ref: "#/components/schemas/OrganizationId"
        name:
          type: string
          description: Human-readable name of the Organization
      required:
        - attributes
        - id
        - name
      additionalProperties: false
    Organizations:
      type: object
      properties:
        pagination:
          $ref: "#/components/schemas/Pagination"
        results:
          type: array
          items:
            $ref: "#/components/schemas/Organization"
      required:
        - pagination
        - results
      additionalProperties: false
    PurposeId:
      type: string
      format: uuid
      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
      description: Unique identifier of the Purpose
    PurposeFormSchemaVersion:
      type: string
      description: Version identifier for the Purpose form schema provided by this
        Knode (e.g., "1.0")
    LocalizedPurposeName:
      type: object
      properties:
        en:
          type: string
          minLength: 5
          maxLength: 60
      required:
        - en
      additionalProperties: false
      description: Name of the Purpose
    LocalizedPurposeDescription:
      type: object
      properties:
        en:
          type: string
          minLength: 10
          maxLength: 250
      required:
        - en
      additionalProperties: false
      description: Description of the Purpose
    PurposeFormAnswers:
      type: object
      additionalProperties: {}
      description: Key-value pairs representing the Consumer's answers to the Knode's
        purpose form
    PurposeTemplateReference:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        knodeId:
          $ref: "#/components/schemas/KnodeId"
      required:
        - id
        - knodeId
      additionalProperties: false
      description: Reference to a Purpose statement template
    PurposeSeed:
      type: object
      properties:
        consumerId:
          description: Identifier of the Consumer Organization creating the Purpose
          allOf:
            - $ref: "#/components/schemas/OrganizationId"
        dailyCalls:
          type: integer
          minimum: 0
          maximum: 1000000000
          description: Expected number of daily API calls for this Purpose
          format: int32
        description:
          $ref: "#/components/schemas/LocalizedPurposeDescription"
        eserviceId:
          description: Identifier of the E-service this Purpose refers to
          allOf:
            - $ref: "#/components/schemas/EserviceId"
        formAnswersJson:
          $ref: "#/components/schemas/PurposeFormAnswers"
        formSchemaVersion:
          $ref: "#/components/schemas/PurposeFormSchemaVersion"
        name:
          $ref: "#/components/schemas/LocalizedPurposeName"
        template:
          allOf:
            - $ref: "#/components/schemas/PurposeTemplateReference"
      required:
        - consumerId
        - dailyCalls
        - description
        - eserviceId
        - formAnswersJson
        - formSchemaVersion
        - name
      additionalProperties: false
      description: Seed data to create a new Purpose
    CreatedPurposeResource:
      description: Unique identifier of the created Purpose resource
      allOf:
        - $ref: "#/components/schemas/CreatedResource"
    PurposeConsumer:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/OrganizationId"
        knodeId:
          $ref: "#/components/schemas/KnodeId"
      required:
        - id
        - knodeId
      additionalProperties: false
      description: Consumer Organization of the Purpose
    PurposeState:
      type: string
      enum:
        - ACTIVE
        - SUSPENDED
        - ARCHIVED
      description: State of the Purpose
    Purpose:
      type: object
      properties:
        consumer:
          $ref: "#/components/schemas/PurposeConsumer"
        dailyCalls:
          type: integer
          minimum: 0
          maximum: 1000000000
          description: Expected number of daily API calls for this Purpose
          format: int32
        description:
          $ref: "#/components/schemas/LocalizedPurposeDescription"
        eserviceId:
          $ref: "#/components/schemas/EserviceId"
        id:
          $ref: "#/components/schemas/PurposeId"
        name:
          $ref: "#/components/schemas/LocalizedPurposeName"
        state:
          $ref: "#/components/schemas/PurposeState"
        suspendedByConsumerAt:
          nullable: true
          description: Timestamp when the Purpose was suspended by the Consumer
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        suspendedByProducerAt:
          nullable: true
          description: Timestamp when the Purpose was suspended by the Producer
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        template:
          allOf:
            - $ref: "#/components/schemas/PurposeTemplateReference"
        updatedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
      required:
        - consumer
        - dailyCalls
        - description
        - eserviceId
        - id
        - name
        - state
        - suspendedByConsumerAt
        - suspendedByProducerAt
        - updatedAt
      additionalProperties: false
      description: A Consumer's Purpose to access an E-service
    PurposeFormTexts:
      type: object
      properties:
        en:
          type: object
          additionalProperties:
            type: string
      required:
        - en
      additionalProperties: false
    PurposeFormUiTexts:
      type: object
      properties:
        en:
          type: object
          additionalProperties:
            type: string
      required:
        - en
      additionalProperties: false
    PurposeFormSchemasResponse:
      type: object
      properties:
        schema:
          type: object
          additionalProperties: {}
        texts:
          $ref: "#/components/schemas/PurposeFormTexts"
        uiSchema:
          type: object
          additionalProperties: {}
        uiTexts:
          $ref: "#/components/schemas/PurposeFormUiTexts"
        version:
          $ref: "#/components/schemas/PurposeFormSchemaVersion"
      required:
        - schema
        - texts
        - uiSchema
        - uiTexts
        - version
      additionalProperties: false
      description: Current Purpose form schemas (JSON Schema + UI Schema + legal/UI
        texts) with their version identifier
    Purposes:
      type: object
      properties:
        pagination:
          $ref: "#/components/schemas/Pagination"
        results:
          type: array
          items:
            $ref: "#/components/schemas/Purpose"
      required:
        - pagination
        - results
      additionalProperties: false
paths:
  /status:
    get:
