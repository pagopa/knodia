syntax = "proto3";

package keychain.v1;

message KeychainV1 {
  string id = 1;
  LocalizedTextV1 name = 2;
  optional LocalizedTextV1 description = 3;
  KeychainKindV1 kind = 4;
  string ownerId = 5;
  repeated string users = 6;
  repeated string purposes = 7;
  repeated KeychainKeyV1 keys = 8;
  int64 createdAt = 9;
  int64 updatedAt = 10;
}

message KeychainKeyV1 {
  string kid = 1;
  LocalizedTextV1 name = 2;
  string algorithm = 3;
  string encodedPem = 4;
  KeyFormatV1 format = 5;
  KeyUseV1 use = 6;
  string userId = 7;
  int64 createdAt = 8;
}

enum KeychainKindV1 {
  PRODUCER = 0;
  CONSUMER = 1;
  API = 2;
}

enum KeyFormatV1 {
  JWK = 0;
  X509 = 1;
}

enum KeyUseV1 {
  SIG = 0;
  ENC = 1;
}

message LocalizedTextV1 {
  // TODO find a way to share this in common models and make proto gen work
  string en = 1;
}
