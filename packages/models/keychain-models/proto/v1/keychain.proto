syntax = "proto3";

package keychain.v1;

message ConsumerKeychainV1 {
  string id = 1;
  LocalizedTextV1 name = 2;
  optional LocalizedTextV1 description = 3;
  string ownerId = 4;
  repeated KeychainUserV1 users = 5;
  repeated KeychainKeyV1 keys = 6;
  int64 createdAt = 7;
  int64 updatedAt = 8;
}

message KeychainKeyV1 {
  string kid = 1;
  LocalizedTextV1 name = 2;
  KeyAlgorithmV1 algorithm = 3;
  string encodedPem = 4;
  KeyFormatV1 format = 5;
  string userId = 6;
  int64 createdAt = 7;
}

message KeychainUserV1 {
  string userId = 1;
  int64 addedAt = 2;
}

enum KeyFormatV1 {
  PublicKey = 0;
  X509Certificate = 1;
}

enum KeyAlgorithmV1 {
  RS256 = 0;
}

message LocalizedTextV1 {
  // TODO find a way to share this in common models and make proto gen work
  string en = 1;
}

message ConsumerKeychainLinkedPurposeV1 {
  string id = 1;
  string knodeId = 2;
}

message KnodeApiKeychainV1 {
  string id = 1;
  LocalizedTextV1 name = 2;
  optional LocalizedTextV1 description = 3;
  string ownerId = 4;
  repeated KeychainUserV1 users = 5;
  repeated KeychainKeyV1 keys = 6;
  int64 createdAt = 7;
  int64 updatedAt = 8;
}

message ProducerKeychainV1 {
  string id = 1;
  LocalizedTextV1 name = 2;
  optional LocalizedTextV1 description = 3;
  string ownerId = 4;
  repeated KeychainUserV1 users = 5;
  repeated KeychainKeyV1 keys = 6;
  int64 createdAt = 7;
  int64 updatedAt = 8;
}
