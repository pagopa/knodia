syntax = "proto3";

package keychain.v1;

import "v1/keychain.proto";

message ConsumerKeychainCreatedV1 {
  ConsumerKeychainV1 consumerKeychain = 1;
}

message ConsumerKeychainDeletedV1 {
  ConsumerKeychainV1 consumerKeychain = 1;
}

message ConsumerKeychainUpdatedV1 {
  ConsumerKeychainV1 consumerKeychain = 1;
}

message ConsumerKeychainPurposeLinkedV1 {
  ConsumerKeychainV1 consumerKeychain = 1;
  ConsumerKeychainLinkedPurposeV1 purpose = 2;
  int64 linkedAt = 3;
}

message ConsumerKeychainPurposeUnlinkedV1 {
  ConsumerKeychainV1 consumerKeychain = 1;
  ConsumerKeychainLinkedPurposeV1 purpose = 2;
}

message ConsumerKeychainMemberAddedV1 {
  ConsumerKeychainV1 consumerKeychain = 1;
  string userId = 2;
}

message ConsumerKeychainMemberRemovedV1 {
  ConsumerKeychainV1 consumerKeychain = 1;
  string userId = 2;
}

message ConsumerKeychainKeyAddedV1 {
  ConsumerKeychainV1 consumerKeychain = 1;
  string kid = 2;
}

message ConsumerKeychainKeyRemovedV1 {
  ConsumerKeychainV1 consumerKeychain = 1;
  string kid = 2;
}

message KnodiaApiKeychainCreatedV1 {
  KnodiaApiKeychainV1 knodiaApiKeychain = 1;
}

message KnodiaApiKeychainDeletedV1 {
  KnodiaApiKeychainV1 knodiaApiKeychain = 1;
}

message KnodiaApiKeychainUpdatedV1 {
  KnodiaApiKeychainV1 knodiaApiKeychain = 1;
}

message KnodiaApiKeychainMemberAddedV1 {
  KnodiaApiKeychainV1 knodiaApiKeychain = 1;
  string userId = 2;
}

message KnodiaApiKeychainMemberRemovedV1 {
  KnodiaApiKeychainV1 knodiaApiKeychain = 1;
  string userId = 2;
}

message KnodiaApiKeychainKeyAddedV1 {
  KnodiaApiKeychainV1 knodiaApiKeychain = 1;
  string kid = 2;
}

message KnodiaApiKeychainKeyRemovedV1 {
  KnodiaApiKeychainV1 knodiaApiKeychain = 1;
  string kid = 2;
}
