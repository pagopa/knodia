syntax = "proto3";

package purpose.v1;

message PurposeV1 {
  string id = 1;
  string eserviceId = 2;
  PurposeConsumerV1 consumer = 3;
  LocalizedTextV1 name = 4;
  LocalizedTextV1 description = 5;
  int32 dailyCalls = 6;
  PurposeStateV1 state = 7;
  string formAnswersJson = 8;
  int64 createdAt = 9;
  int64 updatedAt = 10;
  PurposeFormSchemaVersionV1 formSchemaVersion = 11;
  optional int64 suspendedByConsumerAt = 12;
  optional int64 suspendedByProducerAt = 13;
  optional int64 archivedAt = 14;
}

enum PurposeStateV1 {
  ACTIVE = 0;
  SUSPENDED = 1;
  ARCHIVED = 2;
}

enum PurposeFormSchemaVersionV1 {
  V1_0 = 0;
}

message PurposeConsumerV1 {
  string id = 1;
  string knodeId = 2;
}

message LocalizedTextV1 {
  string en = 1;
}
