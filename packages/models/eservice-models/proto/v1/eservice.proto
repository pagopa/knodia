syntax = "proto3";

package eservice.v1;

message EserviceV1 {
  string id = 1;
  string producerId = 2;
  string name = 3;
  string description = 4;
  EServiceModeV1 mode = 5;
  bool isSignalHubEnabled = 6;
  repeated string categories = 7;
  repeated EserviceVersionV1 versions = 8;
  int64 createdAt = 9;
  int64 updatedAt = 10;
}

enum EServiceModeV1 {
  PROVIDE_DATA = 0;
  RECEIVE_DATA = 1;
}

enum EserviceAccessTokenTypeV1 {
  BEARER = 0;
  DPOP = 1;
}

message EserviceVersionV1 {
  string id = 1;
  int32 versionNumber = 2;
  EserviceVersionStateV1 state = 3;
  EserviceInterfaceV1 interfaceDocument = 4;
  EserviceAccessTokenTypeV1 accessTokenType = 5;
  repeated string accessTokenAudience = 6;
  int32 accessTokenDuration = 7;
  int32 maxDailyCallsPerKnode = 8;
  int32 maxDailyCallsPerConsumer = 9;
  repeated EserviceVersionAttributeGroupV1 attributeGroups = 10;
  int64 createdAt = 11;
  int64 updatedAt = 12;
}

enum EserviceVersionStateV1 {
  ACTIVE = 0;
  SUSPENDED = 1;
  ARCHIVED = 2;
}

message EserviceInterfaceV1 {
  string id = 1;
  string name = 2;
  string prettyName = 3;
  string contentType = 4;
  string path = 5;
  string checksum = 6;
  string createdAt = 7;
  string updatedAt = 8;
}
message EserviceVersionAttributeGroupV1 {
  int32 groupId = 1;
  repeated string attributeIds = 2;
}
