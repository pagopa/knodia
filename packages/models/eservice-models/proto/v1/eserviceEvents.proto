syntax = "proto3";

package eservice.v1;

import "v1/eservice.proto";


message EserviceVersionActivatedV1 {
  EserviceV1 eservice = 1;
  string eserviceVersionId = 2;
  optional string templateId = 3;
  optional string templateKnodeId = 4;
}

message EserviceVersionSuspendedV1 {
  EserviceV1 eservice = 1;
  string eserviceVersionId = 2;
}

message EserviceVersionReactivatedV1 {
  EserviceV1 eservice = 1;
  string eserviceVersionId = 2;
}

message EserviceVersionArchivedV1 {
  EserviceV1 eservice = 1;
  string eserviceVersionId = 2;
}

message EserviceUpdatedV1 {
  EserviceV1 eservice = 1;
}
