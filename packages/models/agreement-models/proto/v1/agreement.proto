syntax = "proto3";

package agreement.v1;

message AgreementV1 {
  string id = 1;
  string eserviceId = 2;
  string eserviceVersionId = 3;
  AgreementConsumerV1 consumer = 4;
  string producerId = 5;
  AgreementStateV1 state = 6;
  repeated AgreementRequiredAttributeGroupV1 requiredAttributes = 7;
  int64 createdAt = 8;
  int64 updatedAt = 9;
}

enum AgreementStateV1 {
  ACTIVE = 0;
  SUSPENDED = 1;
  ARCHIVED = 2;
}

message AgreementRequiredAttributeGroupV1 {
  int32 groupId = 1;
  repeated AgreementAttributeV1 attributes = 2;
}

message AgreementAttributeV1 {
  string scheme = 1;
  string code = 2;
}

message AgreementConsumerV1 {
  string id = 1;
  string knodeId = 2;
}
