syntax = "proto3";

package consumerKeychain.v1;

message ConsumerKeychainV1 {
  string id = 1;
  LocalizedTextV1 name = 2;
  optional LocalizedTextV1 description = 3;
  string ownerId = 4;
  repeated string users = 5;
  repeated string purposes = 6;
  repeated ConsumerKeychainKeyV1 keys = 7;
  int64 createdAt = 8;
  int64 updatedAt = 9;
}

message ConsumerKeychainKeyV1 {
  string kid = 1;
  LocalizedTextV1 name = 2;
  KeyAlgorithmV1 algorithm = 3;
  string encodedPem = 4;
  KeyFormatV1 format = 5;
  string userId = 6;
  int64 createdAt = 7;
}

enum KeyFormatV1 {
  JWK = 0;
  X509 = 1;
}

enum KeyAlgorithmV1 {
  RS256 = 0;
}

message LocalizedTextV1 {
  // TODO find a way to share this in common models and make proto gen work
  string en = 1;
}
