documentationUrl: https://github.com/italia/api-oas-checker-rules
extends:
  [
    "https://github.com/italia/api-oas-checker-rules/releases/download/1.4/spectral.yml",
  ]
rules:
  # Errors
  has-x-summary: off # we don't use the x-summary custom field, unsupported in our setup
  servers-use-https: off # we use http in local/dev environments
  paths-kebab-case: off # not compatible with our naming conventions (e.g. x-correlation-id)

  # Warnings
  paths-status-problem-schema:
    off # our Problem schema has no "detail";
    # also, our generated OpenAPI files have allOf when there is a $ref + description,
    # in line with OpenAPI 3.0 spec

  # Hints
  has-x-api-id: off # we don't use x-api-id custom field
  allowed-number-format: off # suggests decimal32 instead of int32, but OpenAPI standard uses int32
  no-method-name-in-operationId: off # we usually use service method name as operationId

  # Info
  use-recommended-names-in-schemas: off # not compatible with our naming conventions
