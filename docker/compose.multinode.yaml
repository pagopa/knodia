name: knodia-multinode

services:
  # ============================================================
  # Infrastructure : related services
  # ============================================================

  postgres:
    security_opt:
      - no-new-privileges:true
    labels:
      knodia.check.on.startup: "true"
    image: postgres:17.7@sha256:2006493727bd5277eece187319af1ef82b4cf82cf4fc1ed00da0775b646ac2a4
    container_name: knodia-multinode-postgres
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: root
    command: -c 'max_connections=512' -c 'wal_level=logical'
    volumes:
      - multinode-postgres-data:/var/lib/postgresql
      - ./multinode/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================
  # Flyway Migrations
  # ============================================================

  flyway-orion:
    security_opt:
      - no-new-privileges:true
    image: flyway/flyway:11@sha256:782c5c207ffb5ac6336139fda4f4295bd9991ef63ad36919406d4268740069bb
    container_name: knodia-multinode-flyway-orion
    entrypoint: ["/bin/sh", "/flyway/scripts/migrate-all-databases.sh"]
    volumes:
      - ../migration/event-store:/flyway/databases/orion_event_store:ro
      - ../migration/read-model:/flyway/databases/orion_readmodel:ro
      - ../migration/remote-resource:/flyway/databases/orion_remote_resource:ro
      - ../migration/signal-hub:/flyway/databases/orion_signal_hub:ro
      - ../scripts/flyway:/flyway/scripts:ro
    environment:
      FLYWAY_USER: root
      FLYWAY_PASSWORD: root
      FLYWAY_CONNECT_RETRIES: "5"
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_PLACEHOLDERS_NAMESPACE: local_orion
    depends_on:
      postgres:
        condition: service_healthy

  flyway-lynx:
    security_opt:
      - no-new-privileges:true
    image: flyway/flyway:11@sha256:782c5c207ffb5ac6336139fda4f4295bd9991ef63ad36919406d4268740069bb
    container_name: knodia-multinode-flyway-lynx
    entrypoint: ["/bin/sh", "/flyway/scripts/migrate-all-databases.sh"]
    volumes:
      - ../migration/event-store:/flyway/databases/lynx_event_store:ro
      - ../migration/read-model:/flyway/databases/lynx_readmodel:ro
      - ../migration/remote-resource:/flyway/databases/lynx_remote_resource:ro
      - ../migration/signal-hub:/flyway/databases/lynx_signal_hub:ro
      - ../scripts/flyway:/flyway/scripts:ro
    environment:
      FLYWAY_USER: root
      FLYWAY_PASSWORD: root
      FLYWAY_CONNECT_RETRIES: "5"
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_PLACEHOLDERS_NAMESPACE: local_lynx
    depends_on:
      flyway-orion:
        condition: service_completed_successfully

  # signup is a central subsystem shared by both knodes, so it migrates into a
  # single non-namespaced database (schema local_signup) instead of per-knode.
  # Chained after flyway-lynx so the three flyway runs don't race on the shared
  # roles migration against the postgres database.
  flyway-signup:
    security_opt:
      - no-new-privileges:true
    image: flyway/flyway:11@sha256:782c5c207ffb5ac6336139fda4f4295bd9991ef63ad36919406d4268740069bb
    container_name: knodia-multinode-flyway-signup
    entrypoint: ["/bin/sh", "/flyway/scripts/migrate-all-databases.sh"]
    volumes:
      - ../migration/signup:/flyway/databases/signup:ro
      - ../scripts/flyway:/flyway/scripts:ro
    environment:
      FLYWAY_USER: root
      FLYWAY_PASSWORD: root
      FLYWAY_CONNECT_RETRIES: "5"
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_PLACEHOLDERS_NAMESPACE: local
    depends_on:
      flyway-lynx:
        condition: service_completed_successfully

  seed:
    security_opt:
      - no-new-privileges:true
    image: amazon/aws-cli:2.34.25
    container_name: knodia-multinode-seed
    depends_on:
      flyway-orion:
        condition: service_completed_successfully
      flyway-lynx:
        condition: service_completed_successfully
      flyway-signup:
        condition: service_completed_successfully
      minio-setup:
        condition: service_completed_successfully
    volumes:
      - ../scripts/seed:/seed:ro
      - ../apps/services/mock-eservice/openapi/openapi-bearer.yaml:/apps/services/mock-eservice/openapi/openapi-bearer.yaml:ro
      - ../apps/services/mock-eservice/openapi/openapi-dpop.yaml:/apps/services/mock-eservice/openapi/openapi-dpop.yaml:ro
      - ../apps/services/mock-eservice/openapi/openapi-bearer-signal-hub.yaml:/apps/services/mock-eservice/openapi/openapi-bearer-signal-hub.yaml:ro
    environment:
      PGHOST: postgres
      PGUSER: root
      PGPASSWORD: root
      S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: testawskey
      AWS_SECRET_ACCESS_KEY: testawssecret
      AWS_REGION: eu-south-1
    # `-e` makes the shell fail fast on the first tenant error.
    entrypoint:
      - /bin/sh
      - -e
      - -c
      - |
        dnf install -qy postgresql15 >/dev/null
        SQL_DIR=/seed/sql/orion PGDATABASE=orion_readmodel NAMESPACE=local_orion ENVIRONMENT=local S3_BUCKET=knodia-orion-eservice-interfaces /seed/seed.sh
        SQL_DIR=/seed/sql/lynx  PGDATABASE=lynx_readmodel  NAMESPACE=local_lynx  ENVIRONMENT=local S3_BUCKET=knodia-lynx-eservice-interfaces  /seed/seed.sh

  # ============================================================
  # Kafka
  # ============================================================

  kafka:
    security_opt:
      - no-new-privileges:true
    labels:
      knodia.check.on.startup: "true"
    image: confluentinc/cp-kafka:8.1.1
    container_name: knodia-multinode-kafka
    ports:
      - 9092:9092
      - 29092:29092
    environment:
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_NODE_ID: "1"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      CLUSTER_ID: "KYKz4GOqSZurqXVpzOsgNA"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_NUM_PARTITIONS: "3"
    volumes:
      - multinode-kafka-data:/var/lib/kafka/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-lc",
          "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30

  kafka-setup:
    security_opt:
      - no-new-privileges:true
    image: confluentinc/cp-kafka:8.1.1
    container_name: knodia-multinode-kafka-setup
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./multinode/kafka-topics:/kafka-topics:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        while IFS=: read -r topic partitions; do
          kafka-topics --bootstrap-server kafka:9092 \
            --create --if-not-exists \
            --topic "$$topic" \
            --partitions "$$partitions" \
            --replication-factor 1
        done < /kafka-topics
        echo 'All topics created'

  kafka-ui:
    security_opt:
      - no-new-privileges:true
    labels:
      knodia.check.on.startup: "true"
    container_name: knodia-multinode-kafka-ui
    image: kafbat/kafka-ui:v1.4.2@sha256:8dd62c9b18a01b732824cae91c6fe5203fac8e931448a2a639bd20270b8fed2b
    ports:
      - 8084:8080
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: multinode
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  # ============================================================
  # Debezium and connectors
  # ============================================================

  debezium-connect:
    security_opt:
      - no-new-privileges:true
    labels:
      knodia.check.on.startup: "true"
    image: quay.io/debezium/connect:3.4.1.Final
    container_name: knodia-multinode-debezium-connect
    mem_limit: 768m
    ports:
      - 8083:8083
    environment:
      HEAP_OPTS: "-Xms256m -Xmx512m"
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: knodia-multinode-debezium
      CONFIG_STORAGE_TOPIC: knodia-multinode-debezium-configs
      OFFSET_STORAGE_TOPIC: knodia-multinode-debezium-offsets
      STATUS_STORAGE_TOPIC: knodia-multinode-debezium-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_PLUGIN_PATH: /kafka/connect
      CONNECT_TOPIC_CREATION_ENABLE: "true"
      CONNECT_TOPIC_CREATION_DEFAULT_REPLICATION_FACTOR: 1
      CONNECT_TOPIC_CREATION_DEFAULT_PARTITIONS: 10
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/connectors || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  debezium-setup:
    security_opt:
      - no-new-privileges:true
    container_name: knodia-multinode-debezium-setup
    image: curlimages/curl:8.12.1@sha256:94e9e444bcba979c2ea12e27ae39bee4cd10bc7041a472c4727a558e213744e6
    depends_on:
      debezium-connect:
        condition: service_healthy
      flyway-orion:
        condition: service_completed_successfully
      flyway-lynx:
        condition: service_completed_successfully
    volumes:
      - ./multinode/event-store-connector-orion.json:/connectors/orion.json:ro
      - ./multinode/event-store-connector-lynx.json:/connectors/lynx.json:ro
    entrypoint: >
      /bin/sh -c "
      for node in orion lynx; do
      response=$$(curl -s -o /dev/null -w '%{http_code}' -X POST
      -H 'Accept:application/json'
      -H 'Content-Type:application/json'
      -d @/connectors/$$node.json
      http://debezium-connect:8083/connectors);
      if [ \"$$response\" -eq 201 ]; then echo \"Connector $$node registered\";
      elif [ \"$$response\" -eq 409 ]; then echo \"Connector $$node already exists\";
      else echo \"Failed to register connector $$node: HTTP $$response\"; exit 1;
      fi;
      done
      "

  # ============================================================
  # MinIO (S3-compatible storage)
  # ============================================================

  minio:
    security_opt:
      - no-new-privileges:true
    labels:
      knodia.check.on.startup: "true"
    container_name: knodia-multinode-minio
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    entrypoint: >
      /usr/bin/minio server /data --console-address ':9001'
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      MINIO_ROOT_USER: testawskey
      MINIO_ROOT_PASSWORD: testawssecret
      MINIO_SITE_REGION: eu-south-1
      MINIO_DOMAIN: minio
    networks:
      default:
        aliases:
          - knodia-orion-eservice-interfaces.minio
          - knodia-lynx-eservice-interfaces.minio
    volumes:
      - multinode-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-setup:
    security_opt:
      - no-new-privileges:true
    container_name: knodia-multinode-minio-setup
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 testawskey testawssecret;
      mc mb --ignore-existing local/knodia-orion-eservice-interfaces;
      mc mb --ignore-existing local/knodia-lynx-eservice-interfaces;
      "

  # ============================================================
  # pgAdmin
  # ============================================================

  pgadmin:
    security_opt:
      - no-new-privileges:true
    labels:
      knodia.check.on.startup: "true"
    container_name: knodia-multinode-pgadmin
    image: dpage/pgadmin4:9
    ports:
      - 5050:80
    environment:
      PGADMIN_DEFAULT_EMAIL: root@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - multinode-pgadmin-data:/var/lib/pgadmin
      - ./multinode/pgadmin-servers.json:/pgadmin4/servers.json:ro
      - ./multinode/pgpass:/pgadmin4/pgpass:ro
    depends_on:
      - postgres

  # ============================================================
  # Orion Node
  # ============================================================

  eservice-process-orion:
    security_opt:
      - no-new-privileges:true
    labels:
      knodia.check.on.startup: "true"
    container_name: knodia-multinode-eservice-process-orion
    mem_limit: 200m
    build:
      context: ..
      dockerfile: apps/services/eservice-process/Dockerfile
    ports:
      - 3001:3000
    environment:
      NODE_OPTIONS: "--max-old-space-size=150"
      LOG_LEVEL: info
      HOST: "0.0.0.0"
      PORT: "3000"
      KNODE_ID: "Orion"
      EVENTSTORE_DB_USER: local_orion_eservice_process_user
      EVENTSTORE_DB_PASSWORD: local_orion_eservice_process_user
      EVENTSTORE_DB_HOST: postgres
      EVENTSTORE_DB_PORT: "5432"
      EVENTSTORE_DB_NAME: orion_event_store
      EVENTSTORE_DB_USE_SSL: "false"
      EVENTSTORE_DB_ESERVICE_SCHEMA: local_orion_eservice
      READMODEL_DB_USER: local_orion_eservice_process_user
      READMODEL_DB_PASSWORD: local_orion_eservice_process_user
      READMODEL_DB_HOST: postgres
      READMODEL_DB_PORT: "5432"
      READMODEL_DB_NAME: orion_readmodel
      READMODEL_DB_USE_SSL: "false"
      READMODEL_DB_ESERVICE_SCHEMA: local_orion_eservice
      READMODEL_DB_ORGANIZATION_SCHEMA: local_orion_organization
      IS_CONSUMER_OPERATOR_IDENTIFICATION_REQUIRED: "false"
      ACCEPTED_AUDIENCES: "local.knodia.test/ui-session,local.knodia.test/internal,local.knodia.test/external-ui-session"
      WELL_KNOWN_URLS: "http://local-jwks:80/knodia/.well-known/jwks.json"
    depends_on:
      flyway-orion:
        condition: service_completed_successfully
      local-kms-setup:
        condition: service_completed_successfully

  k2k-gateway-orion:
    security_opt:
      - no-new-privileges:true
    labels:
      knodia.check.on.startup: "true"
    container_name: knodia-multinode-k2k-gateway-orion
    mem_limit: 200m
    build:
      context: ..
      dockerfile: apps/services/k2k-gateway/Dockerfile
    ports:
      - 3101:3000
    environment:
      NODE_OPTIONS: "--max-old-space-size=150"
      LOG_LEVEL: info
      HOST: "0.0.0.0"
      PORT: "3000"
      AGREEMENT_PROCESS_URL: "http://agreement-process-orion:3000"
      CALLER_KNODE_ID: "Lynx"
      ESERVICE_INTERFACES_S3_BUCKET: knodia-orion-eservice-interfaces
      ESERVICE_PROCESS_URL: "http://eservice-process-orion:3000"
      KEYCHAIN_PROCESS_URL: "http://keychain-process-orion:3000"
      ORGANIZATION_PROCESS_URL: "http://organization-process-orion:3000"
      PURPOSE_PROCESS_URL: "http://purpose-process-orion:3000"
      INTERNAL_JWT_AUDIENCE: "local.knodia.test/internal"
      INTERNAL_JWT_ISSUER: "local-knodia"
      INTERNAL_JWT_KID: "alias/local-knodia-key"
      INTERNAL_JWT_SECONDS_DURATION: "3600"
      INTERNAL_JWT_SUBJECT: "k2k-gateway"
      EXTERNAL_UI_SESSION_MAGIC_LINK_JWT_AUDIENCE: "local.knodia.test/external-ui-session-magic-link"
      EXTERNAL_UI_SESSION_MAGIC_LINK_JWT_ISSUER: "local-knodia"
      EXTERNAL_UI_SESSION_MAGIC_LINK_JWT_KID: "alias/local-knodia-key"
      EXTERNAL_UI_SESSION_MAGIC_LINK_JWT_SECONDS_DURATION: "120"
      FRONTEND_BASE_URL: "http://localhost:5001"
      FRONTEND_ACTIVATION_PATH: "/ui/agreement-activation"
      AWS_REGION: eu-south-1
      AWS_ACCESS_KEY_ID: testawskey
      AWS_SECRET_ACCESS_KEY: testawssecret
      AWS_ENDPOINT_URL_KMS: http://local-kms:8080
      AWS_ENDPOINT_URL_S3: http://minio:9000
    depends_on:
      agreement-process-orion:
        condition: service_started
      eservice-process-orion:
        condition: service_started
      keychain-process-orion:
        condition: service_started
      organization-process-orion:
        condition: service_started
      purpose-process-orion:
        condition: service_started
      minio:
        condition: service_healthy

  k2o-gateway-orion:
    security_opt:
      - no-new-privileges:true
    labels:
      knodia.check.on.startup: "true"
    container_name: knodia-multinode-k2o-gateway-orion
    mem_limit: 200m
    build:
      context: ..
      dockerfile: apps/services/k2o-gateway/Dockerfile
    ports:
      - 3901:3000
    environment:
      NODE_OPTIONS: "--max-old-space-size=150"
      LOG_LEVEL: info
      HOST: "0.0.0.0"
      PORT: "3000"
      ACCEPTED_AUDIENCES: "k2o-gateway.test.knodia.org"
      WELL_KNOWN_URLS: "http://local-jwks:80/knodia/.well-known/jwks.json"
      INTERNAL_JWT_AUDIENCE: "local.knodia.test/internal"
      INTERNAL_JWT_ISSUER: "local-knodia"
      INTERNAL_JWT_KID: "alias/local-knodia-key"
      INTERNAL_JWT_SECONDS_DURATION: "3600"
      INTERNAL_JWT_SUBJECT: "k2k-gateway"
      KEYCHAIN_PROCESS_URL: "http://keychain-process-orion:3000"
      AWS_REGION: eu-south-1
      AWS_ACCESS_KEY_ID: testawskey
      AWS_SECRET_ACCESS_KEY: testawssecret
      AWS_ENDPOINT_URL_KMS: http://local-kms:8080
    depends_on:
      keychain-process-orion:
        condition: service_started

  agreement-process-orion:
    security_opt:
      - no-new-privileges:true
    labels:
      knodia.check.on.startup: "true"
    container_name: knodia-multinode-agreement-process-orion
    mem_limit: 200m
    build:
      context: ..
      dockerfile: apps/services/agreement-process/Dockerfile
    ports:
      - 3201:3000
    environment:
      NODE_OPTIONS: "--max-old-space-size=150"
      LOG_LEVEL: info
      HOST: "0.0.0.0"
      PORT: "3000"
      KNODE_ID: "Orion"
      EVENTSTORE_DB_USER: local_orion_agreement_process_user
      EVENTSTORE_DB_PASSWORD: local_orion_agreement_process_user
      EVENTSTORE_DB_HOST: postgres
      EVENTSTORE_DB_PORT: "5432"
      EVENTSTORE_DB_NAME: orion_event_store
      EVENTSTORE_DB_USE_SSL: "false"
      EVENTSTORE_DB_AGREEMENT_SCHEMA: local_orion_agreement
      READMODEL_DB_USER: local_orion_agreement_process_user
      READMODEL_DB_PASSWORD: local_orion_agreement_process_user
      READMODEL_DB_HOST: postgres
      READMODEL_DB_PORT: "5432"
      READMODEL_DB_NAME: orion_readmodel
      READMODEL_DB_USE_SSL: "false"
      READMODEL_DB_AGREEMENT_SCHEMA: local_orion_agreement
      READMODEL_DB_ESERVICE_SCHEMA: local_orion_eservice
      ACCEPTED_AUDIENCES: "local.knodia.test/ui-session,local.knodia.test/internal,local.knodia.test/external-ui-session"
      WELL_KNOWN_URLS: "http://local-jwks:80/knodia/.well-known/jwks.json"
    depends_on:
      flyway-orion:
        condition: service_completed_successfully
      local-kms-setup:
        condition: service_completed_successfully

  remote-resources-manager-orion:
    security_opt:
      - no-new-privileges:true
    labels:
      knodia.check.on.startup: "true"
    container_name: knodia-multinode-remote-resources-manager-orion
    mem_limit: 200m
    build:
      context: ..
      dockerfile: apps/services/remote-resources-manager/Dockerfile
    ports:
      - 4901:3000
    environment:
      NODE_OPTIONS: "--max-old-space-size=150"
      LOG_LEVEL: info
      HOST: "0.0.0.0"
      PORT: "3000"
      TARGET_KNODE_URLS: '{"Lynx":"http://k2k-gateway-lynx:3000"}'
      ACCEPTED_AUDIENCES: "local.knodia.test/ui-session,local.knodia.test/external-ui-session"
      WELL_KNOWN_URLS: "http://local-jwks:80/knodia/.well-known/jwks.json"
      REMOTE_RESOURCE_DB_USER: local_orion_remote_resources_manager_user
      REMOTE_RESOURCE_DB_PASSWORD: local_orion_remote_resources_manager_user
      REMOTE_RESOURCE_DB_HOST: postgres
      REMOTE_RESOURCE_DB_PORT: "5432"
      REMOTE_RESOURCE_DB_NAME: orion_remote_resource
      REMOTE_RESOURCE_DB_USE_SSL: "false"
      REMOTE_RESOURCE_DB_AGREEMENT_SCHEMA: local_orion_agreement
      REMOTE_RESOURCE_DB_PURPOSE_SCHEMA: local_orion_purpose
      READMODEL_DB_USER: local_orion_remote_resources_manager_user
      READMODEL_DB_PASSWORD: local_orion_remote_resources_manager_user
      READMODEL_DB_HOST: postgres
      READMODEL_DB_PORT: "5432"
      READMODEL_DB_NAME: orion_readmodel
      READMODEL_DB_USE_SSL: "false"
      READMODEL_DB_ORGANIZATION_SCHEMA: local_orion_organization
    depends_on:
      k2k-gateway-lynx:
        condition: service_started
      flyway-orion:
