name: knodia-multinode

services:
  # ============================================================
  # Infrastructure : related services
  # ============================================================

  event-store:
    security_opt:
      - no-new-privileges:true
    image: postgres:18@sha256:1090bc3a8ccfb0b55f78a494d76f8d603434f7e4553543d6e807bc7bd6bbd17f
    container_name: knodia-multi-node-event-store
    ports:
      - 6001:5432
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: root
    command: -c 'max_connections=512' -c 'wal_level=logical'
    volumes:
      - multi-node-event-store-data:/var/lib/postgresql
      - ./multinode/init-dbs.sh:/docker-entrypoint-initdb.d/init-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root"]
      interval: 5s
      timeout: 5s
      retries: 5

  readmodel:
    security_opt:
      - no-new-privileges:true
    image: postgres:18@sha256:1090bc3a8ccfb0b55f78a494d76f8d603434f7e4553543d6e807bc7bd6bbd17f
    container_name: knodia-multi-node-readmodel
    ports:
      - 6002:5432
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: root
    volumes:
      - multi-node-readmodel-data:/var/lib/postgresql
      - ./multinode/init-dbs.sh:/docker-entrypoint-initdb.d/init-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================
  # Flyway Roles (cluster-wide, run once per PG instance)
  # ============================================================

  flyway-roles-event-store:
    security_opt:
      - no-new-privileges:true
    image: flyway/flyway:11
    container_name: knodia-multi-node-flyway-roles-event-store
    command: migrate
    volumes:
      - ../migration/roles/R__roles.sql:/flyway/sql/R__roles.sql:ro
    environment:
      FLYWAY_URL: jdbc:postgresql://event-store:5432/orion
      FLYWAY_USER: root
      FLYWAY_PASSWORD: root
      FLYWAY_CONNECT_RETRIES: "5"
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_SCHEMAS: public
      FLYWAY_DEFAULT_SCHEMA: public
      FLYWAY_PLACEHOLDERS_NAMESPACE: local
    depends_on:
      event-store:
        condition: service_healthy

  flyway-roles-readmodel:
    security_opt:
      - no-new-privileges:true
    image: flyway/flyway:11
    container_name: knodia-multi-node-flyway-roles-readmodel
    command: migrate
    volumes:
      - ../migration/roles/R__roles.sql:/flyway/sql/R__roles.sql:ro
    environment:
      FLYWAY_URL: jdbc:postgresql://readmodel:5432/orion
      FLYWAY_USER: root
      FLYWAY_PASSWORD: root
      FLYWAY_CONNECT_RETRIES: "5"
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_SCHEMAS: public
      FLYWAY_DEFAULT_SCHEMA: public
      FLYWAY_PLACEHOLDERS_NAMESPACE: local
    depends_on:
      readmodel:
        condition: service_healthy

  # ============================================================
  # Flyway Schema Migrations (per database)
  # ============================================================

  flyway-event-store-orion:
    security_opt:
      - no-new-privileges:true
    image: flyway/flyway:11
    container_name: knodia-multi-node-flyway-event-store-orion
    entrypoint: ["/bin/sh", "/flyway/scripts/migrate-all-schemas.sh"]
    volumes:
      - ../migration/event-store:/flyway/schemas:ro
      - ../scripts/flyway:/flyway/scripts:ro
    environment:
      FLYWAY_URL: jdbc:postgresql://event-store:5432/orion
      FLYWAY_USER: root
      FLYWAY_PASSWORD: root
      FLYWAY_CONNECT_RETRIES: "5"
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_PLACEHOLDERS_NAMESPACE: local
    depends_on:
      flyway-roles-event-store:
        condition: service_completed_successfully

  flyway-event-store-lynx:
    security_opt:
      - no-new-privileges:true
    image: flyway/flyway:11
    container_name: knodia-multi-node-flyway-event-store-lynx
    entrypoint: ["/bin/sh", "/flyway/scripts/migrate-all-schemas.sh"]
    volumes:
      - ../migration/event-store:/flyway/schemas:ro
      - ../scripts/flyway:/flyway/scripts:ro
    environment:
      FLYWAY_URL: jdbc:postgresql://event-store:5432/lynx
      FLYWAY_USER: root
      FLYWAY_PASSWORD: root
      FLYWAY_CONNECT_RETRIES: "5"
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_PLACEHOLDERS_NAMESPACE: local
    depends_on:
      flyway-roles-event-store:
        condition: service_completed_successfully

  flyway-readmodel-orion:
    security_opt:
      - no-new-privileges:true
    image: flyway/flyway:11
    container_name: knodia-multi-node-flyway-readmodel-orion
    entrypoint: ["/bin/sh", "/flyway/scripts/migrate-all-schemas.sh"]
    volumes:
      - ../migration/read-model:/flyway/schemas:ro
      - ../scripts/flyway:/flyway/scripts:ro
    environment:
      FLYWAY_URL: jdbc:postgresql://readmodel:5432/orion
      FLYWAY_USER: root
      FLYWAY_PASSWORD: root
      FLYWAY_CONNECT_RETRIES: "5"
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_PLACEHOLDERS_NAMESPACE: local
    depends_on:
      flyway-roles-readmodel:
        condition: service_completed_successfully

  flyway-readmodel-lynx:
    security_opt:
      - no-new-privileges:true
    image: flyway/flyway:11
    container_name: knodia-multi-node-flyway-readmodel-lynx
    entrypoint: ["/bin/sh", "/flyway/scripts/migrate-all-schemas.sh"]
    volumes:
      - ../migration/read-model:/flyway/schemas:ro
      - ../scripts/flyway:/flyway/scripts:ro
    environment:
      FLYWAY_URL: jdbc:postgresql://readmodel:5432/lynx
      FLYWAY_USER: root
      FLYWAY_PASSWORD: root
      FLYWAY_CONNECT_RETRIES: "5"
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_PLACEHOLDERS_NAMESPACE: local
    depends_on:
      flyway-roles-readmodel:
        condition: service_completed_successfully

  # ============================================================
  # Kafka
  # ============================================================

  kafka:
    security_opt:
      - no-new-privileges:true
    image: confluentinc/cp-kafka:7.6.9@sha256:652f4017a6389f22930eb27ad02ce730622ebe145efa442625d7f439f1bc111e
    container_name: knodia-multi-node-kafka
    ports:
      - 9092:9092
      - 29092:29092
    environment:
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_NODE_ID: "1"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      CLUSTER_ID: "KYKz4GOqSZurqXVpzOsgNA"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_NUM_PARTITIONS: "3"
    volumes:
      - multi-node-kafka-data:/var/lib/kafka/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-lc",
          "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30

  debezium-connect:
    security_opt:
      - no-new-privileges:true
    image: quay.io/debezium/connect:3.4.1.Final
    container_name: knodia-multi-node-debezium-connect
    ports:
      - 8083:8083
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: knodia-multi-node-debezium
      CONFIG_STORAGE_TOPIC: knodia-multi-node-debezium-configs
      OFFSET_STORAGE_TOPIC: knodia-multi-node-debezium-offsets
      STATUS_STORAGE_TOPIC: knodia-multi-node-debezium-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_PLUGIN_PATH: /kafka/connect
      CONNECT_TOPIC_CREATION_ENABLE: "true"
      CONNECT_TOPIC_CREATION_DEFAULT_REPLICATION_FACTOR: 1
      CONNECT_TOPIC_CREATION_DEFAULT_PARTITIONS: 10
    depends_on:
      kafka:
        condition: service_healthy
      event-store:
        condition: service_started

  kafka-ui:
    security_opt:
      - no-new-privileges:true
    container_name: knodia-multi-node-kafka-ui
    image: kafbat/kafka-ui:v1.4.2@sha256:8dd62c9b18a01b732824cae91c6fe5203fac8e931448a2a639bd20270b8fed2b
    ports:
      - 8084:8080
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: multinode
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  # ============================================================
  # MinIO (S3-compatible storage)
  # ============================================================

  minio:
    security_opt:
      - no-new-privileges:true
    container_name: knodia-multi-node-minio
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    entrypoint: >
      /usr/bin/minio server /data --console-address ':9001'
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      MINIO_ROOT_USER: testawskey
      MINIO_ROOT_PASSWORD: testawssecret
      MINIO_SITE_REGION: eu-south-1
      MINIO_DOMAIN: localhost
    volumes:
      - multi-node-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-setup:
    security_opt:
      - no-new-privileges:true
    container_name: knodia-multi-node-minio-setup
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 testawskey testawssecret;
      mc mb --ignore-existing local/knodia-orion-eservice-interfaces;
      mc mb --ignore-existing local/knodia-lynx-eservice-interfaces;
      exit 0;
      "

  # ============================================================
  # pgAdmin
  # ============================================================

  pgadmin:
    security_opt:
      - no-new-privileges:true
    container_name: knodia-multi-node-pgadmin
    image: dpage/pgadmin4:9
    ports:
      - 5050:80
    environment:
      PGADMIN_DEFAULT_EMAIL: root@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - multi-node-pgadmin-data:/var/lib/pgadmin
      - ./multinode/pgadmin-servers.json:/pgadmin4/servers.json:ro
      - ./multinode/pgpass:/pgadmin4/pgpass:ro
    depends_on:
      - event-store
      - readmodel

  # ============================================================
  # Orion Node
  # ============================================================

  eservice-process-orion:
    security_opt:
      - no-new-privileges:true
    container_name: knodia-multi-node-eservice-process-orion
    build:
      context: ..
      dockerfile: apps/services/eservice-process/Dockerfile
    ports:
      - 3001:3000
    environment:
      LOG_LEVEL: info
      HOST: "0.0.0.0"
      PORT: "3000"
      EVENTSTORE_DB_USER: root
      EVENTSTORE_DB_PASSWORD: root
      EVENTSTORE_DB_HOST: event-store
      EVENTSTORE_DB_PORT: "5432"
      EVENTSTORE_DB_NAME: orion
      EVENTSTORE_DB_USE_SSL: "false"
      EVENTSTORE_DB_ESERVICE_SCHEMA: local_eservice
      READMODEL_DB_USER: root
      READMODEL_DB_PASSWORD: root
      READMODEL_DB_HOST: readmodel
      READMODEL_DB_PORT: "5432"
      READMODEL_DB_NAME: orion
      READMODEL_DB_USE_SSL: "false"
      READMODEL_DB_ESERVICE_SCHEMA: local_eservice
      ACCEPTED_AUDIENCES: "local.knodia.test/ui-session"
      WELL_KNOWN_URLS: "http://local-jwks:80/knodia/.well-known/jwks.json"
    depends_on:
      flyway-event-store-orion:
        condition: service_completed_successfully
      flyway-readmodel-orion:
        condition: service_completed_successfully
      local-kms-setup:
        condition: service_completed_successfully

  k2k-gateway-orion:
    security_opt:
      - no-new-privileges:true
    container_name: knodia-multi-node-k2k-gateway-orion
    build:
      context: ..
      dockerfile: apps/services/k2k-gateway/Dockerfile
    ports:
      - 3101:3000
    environment:
      LOG_LEVEL: info
      HOST: "0.0.0.0"
      PORT: "3000"
      ESERVICE_PROCESS_URL: "http://eservice-process-orion:3000"
    depends_on:
      eservice-process-orion:
        condition: service_started

  remote-resources-manager-orion:
    security_opt:
      - no-new-privileges:true
    container_name: knodia-multi-node-remote-resources-manager-orion
    build:
      context: ..
      dockerfile: apps/services/remote-resources-manager/Dockerfile
    ports:
      - 4901:3000
    environment:
      LOG_LEVEL: info
      HOST: "0.0.0.0"
      PORT: "3000"
      KNODE_URL: "http://k2k-gateway-orion:3000"
      ACCEPTED_AUDIENCES: "local.knodia.test/ui-session"
      WELL_KNOWN_URLS: "http://local-jwks:80/knodia/.well-known/jwks.json"
    depends_on:
      k2k-gateway-orion:
        condition: service_started
      local-kms-setup:
        condition: service_completed_successfully

  bff-orion:
    security_opt:
      - no-new-privileges:true
    container_name: knodia-multi-node-bff-orion
    build:
      context: ..
      dockerfile: apps/services/backend-for-frontend/Dockerfile
    ports:
      - 3601:3000
    environment:
      LOG_LEVEL: info
      HOST: "0.0.0.0"
      PORT: "3000"
      ESERVICE_PROCESS_URL: "http://eservice-process-orion:3000"
      REMOTE_RESOURCES_MANAGER_URL: "http://remote-resources-manager-orion:3000"
      ACCEPTED_AUDIENCES: "local.knodia.test/ui-session"
      WELL_KNOWN_URLS: "http://local-jwks:80/knodia/.well-known/jwks.json"
      ESERVICE_INTERFACES_S3_BUCKET: knodia-orion-eservice-interfaces
      AWS_ACCESS_KEY_ID: testawskey
      AWS_SECRET_ACCESS_KEY: testawssecret
      AWS_REGION: eu-south-1
      AWS_ENDPOINT_URL_S3: http://minio:9000
    depends_on:
      remote-resources-manager-orion:
        condition: service_started
      minio:
        condition: service_healthy
      local-kms-setup:
        condition: service_completed_successfully

  readmodel-writer-orion:
    security_opt:
      - no-new-privileges:true
    container_name: knodia-multi-node-readmodel-writer-orion
    build:
      context: ..
      dockerfile: apps/services/eservice-readmodel-writer/Dockerfile
    environment:
      READMODEL_DB_USER: root
      READMODEL_DB_PASSWORD: root
      READMODEL_DB_HOST: readmodel
      READMODEL_DB_PORT: "5432"
      READMODEL_DB_NAME: orion
      READMODEL_DB_USE_SSL: "false"
      READMODEL_DB_ESERVICE_SCHEMA: local_eservice
      KAFKA_BROKERS: kafka:9092
      KAFKA_LOG_LEVEL: INFO
      KAFKA_CLIENT_ID: kafka-eservice-client-orion
      KAFKA_GROUP_ID: kafka-eservice-readmodel-writer-orion
      TOPIC_STARTING_OFFSET: earliest
      ESERVICE_TOPIC: event-store-orion.local_eservice.events
    depends_on:
      flyway-readmodel-orion:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  # ============================================================
  # Lynx Node
  # ============================================================

  eservice-process-lynx:
    security_opt:
      - no-new-privileges:true
    container_name: knodia-multi-node-eservice-process-lynx
    build:
      context: ..
      dockerfile: apps/services/eservice-process/Dockerfile
    ports:
      - 3002:3000
    environment:
      LOG_LEVEL: info
      HOST: "0.0.0.0"
      PORT: "3000"
      EVENTSTORE_DB_USER: root
      EVENTSTORE_DB_PASSWORD: root
      EVENTSTORE_DB_HOST: event-store
      EVENTSTORE_DB_PORT: "5432"
      EVENTSTORE_DB_NAME: lynx
      EVENTSTORE_DB_USE_SSL: "false"
      EVENTSTORE_DB_ESERVICE_SCHEMA: local_eservice
      READMODEL_DB_USER: root
      READMODEL_DB_PASSWORD: root
      READMODEL_DB_HOST: readmodel
      READMODEL_DB_PORT: "5432"
      READMODEL_DB_NAME: lynx
      READMODEL_DB_USE_SSL: "false"
      READMODEL_DB_ESERVICE_SCHEMA: local_eservice
      ACCEPTED_AUDIENCES: "local.knodia.test/ui-session"
      WELL_KNOWN_URLS: "http://local-jwks:80/knodia/.well-known/jwks.json"
    depends_on:
      flyway-event-store-lynx:
        condition: service_completed_successfully
      flyway-readmodel-lynx:
        condition: service_completed_successfully
      local-kms-setup:
        condition: service_completed_successfully

  k2k-gateway-lynx:
    security_opt:
      - no-new-privileges:true
    container_name: knodia-multi-node-k2k-gateway-lynx
    build:
      context: ..
      dockerfile: apps/services/k2k-gateway/Dockerfile
    ports:
      - 3102:3000
    environment:
      LOG_LEVEL: info
      HOST: "0.0.0.0"
      PORT: "3000"
      ESERVICE_PROCESS_URL: "http://eservice-process-lynx:3000"
    depends_on:
      eservice-process-lynx:
        condition: service_started

  remote-resources-manager-lynx:
    security_opt:
      - no-new-privileges:true
    container_name: knodia-multi-node-remote-resources-manager-lynx
    build:
      context: ..
      dockerfile: apps/services/remote-resources-manager/Dockerfile
    ports:
      - 4902:3000
    environment:
      LOG_LEVEL: info
      HOST: "0.0.0.0"
      PORT: "3000"
      KNODE_URL: "http://k2k-gateway-lynx:3000"
      ACCEPTED_AUDIENCES: "local.knodia.test/ui-session"
      WELL_KNOWN_URLS: "http://local-jwks:80/knodia/.well-known/jwks.json"
    depends_on:
      k2k-gateway-lynx:
        condition: service_started
      local-kms-setup:
        condition: service_completed_successfully

  bff-lynx:
    security_opt:
      - no-new-privileges:true
    container_name: knodia-multi-node-bff-lynx
    build:
      context: ..
      dockerfile: apps/services/backend-for-frontend/Dockerfile
    ports:
      - 3602:3000
    environment:
      LOG_LEVEL: info
      HOST: "0.0.0.0"
      PORT: "3000"
      ESERVICE_PROCESS_URL: "http://eservice-process-lynx:3000"
      REMOTE_RESOURCES_MANAGER_URL: "http://remote-resources-manager-lynx:3000"
      ACCEPTED_AUDIENCES: "local.knodia.test/ui-session"
      WELL_KNOWN_URLS: "http://local-jwks:80/knodia/.well-known/jwks.json"
      ESERVICE_INTERFACES_S3_BUCKET: knodia-lynx-eservice-interfaces
      AWS_ACCESS_KEY_ID: testawskey
      AWS_SECRET_ACCESS_KEY: testawssecret
      AWS_REGION: eu-south-1
      AWS_ENDPOINT_URL_S3: http://minio:9000
    depends_on:
      remote-resources-manager-lynx:
        condition: service_started
      minio:
        condition: service_healthy
      local-kms-setup:
        condition: service_completed_successfully

  readmodel-writer-lynx:
    security_opt:
      - no-new-privileges:true
    container_name: knodia-multi-node-readmodel-writer-lynx
    build:
      context: ..
      dockerfile: apps/services/eservice-readmodel-writer/Dockerfile
    environment:
      READMODEL_DB_USER: root
      READMODEL_DB_PASSWORD: root
      READMODEL_DB_HOST: readmodel
      READMODEL_DB_PORT: "5432"
      READMODEL_DB_NAME: lynx
      READMODEL_DB_USE_SSL: "false"
      READMODEL_DB_ESERVICE_SCHEMA: local_eservice
      KAFKA_BROKERS: kafka:9092
      KAFKA_LOG_LEVEL: INFO
      KAFKA_CLIENT_ID: kafka-eservice-client-lynx
      KAFKA_GROUP_ID: kafka-eservice-readmodel-writer-lynx
      TOPIC_STARTING_OFFSET: earliest
      ESERVICE_TOPIC: event-store-lynx.local_eservice.events
    depends_on:
      flyway-readmodel-lynx:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  # ============================================================
  # Local KMS & JWKS (authentication)
  # ============================================================

  local-kms:
    security_opt:
      - no-new-privileges:true
    image: nsmithuk/local-kms:3.11.7@sha256:360d7377b6f3687c89a622236791e4fa3f7316366267b437829edbdfa8a5fc60
    container_name: knodia-multi-node-local-kms
    ports:
      - 4566:8080
    environment:
      PORT: 8080
      KMS_REGION: eu-south-1
    volumes:
      - multi-node-local-kms-data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8080"]
      interval: 5s
      timeout: 5s
      retries: 10

  local-kms-setup:
    security_opt:
      - no-new-privileges:true
    image: node:24-alpine@sha256:4f696fbf39f383c1e486030ba6b289a5d9af541642fc78ab197e584a113b9c03
    container_name: knodia-multi-node-local-kms-setup
    depends_on:
      local-kms:
        condition: service_healthy
    volumes:
      - multi-node-jwks-data:/jwks
      - ../scripts/local-kms:/app/scripts/local-kms:ro
      - ../node_modules:/app/node_modules:ro
    working_dir: /app
    environment:
      KMS_ENDPOINT: http://local-kms:8080
      JWKS_OUTPUT_DIR: /jwks
    command: node scripts/local-kms/kms-setup.mjs

  local-jwks:
    security_opt:
      - no-new-privileges:true
    image: nginx:1.28-alpine@sha256:15e96e59aa3b0aada3a121296e3bce117721f42d88f5f64217ef4b18f458c6ab
    container_name: knodia-multi-node-local-jwks
    ports:
      - 4500:80
    volumes:
      - multi-node-jwks-data:/usr/share/nginx/html:ro

