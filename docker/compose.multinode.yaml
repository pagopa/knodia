      READMODEL_DB_PORT: "5432"
      READMODEL_DB_NAME: lynx_readmodel
      READMODEL_DB_USE_SSL: "false"
      READMODEL_DB_PURPOSE_SCHEMA: local_lynx_purpose
      KAFKA_BROKERS: kafka:9092
      KAFKA_LOG_LEVEL: INFO
      KAFKA_CLIENT_ID: kafka-purpose-client-lynx
      KAFKA_GROUP_ID: kafka-purpose-readmodel-writer-lynx
      TOPIC_STARTING_OFFSET: earliest
      PURPOSE_TOPIC: event-store-lynx.local_lynx_purpose.events
      KAFKA_DISABLE_AWS_IAM_AUTH: "true"
    depends_on:
      flyway-lynx:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  authorization-server-lynx:
    security_opt:
      - no-new-privileges:true
    labels:
      knodia.check.on.startup: "true"
    container_name: knodia-multinode-authorization-server-lynx
    mem_limit: 200m
    build:
      context: ..
      dockerfile: apps/services/authorization-server/Dockerfile
    ports:
      - 3702:3000
    environment:
      NODE_OPTIONS: "--max-old-space-size=150"
      LOG_LEVEL: info
      HOST: "0.0.0.0"
      PORT: "3000"
      KNODE_ID: "Lynx"
      TARGET_KNODE_URLS: '{"Orion":"http://k2k-gateway-orion:3000"}'
      ESERVICE_ACCESS_TOKEN_JWT_KID: "alias/local-knodia-auth-server-key"
      GENERATED_ESERVICE_ACCESS_TOKEN_ISSUER: "auth.lynx.local.knodia.com"
      KNODE_API_TOKEN_JWT_KID: "alias/local-knodia-auth-server-key"
      GENERATED_KNODE_API_TOKEN_ISSUER: "auth.lynx.local.knodia.com"
      GENERATED_KNODE_API_TOKEN_AUDIENCES: "signalhub.test.knodia.org"
      KNODE_API_TOKEN_DURATION_SECONDS: "3600"
      ESERVICE_CLIENT_ASSERTION_ACCEPTED_AUDIENCES: "test.knodia.org"
      KNODE_API_CLIENT_ASSERTION_ACCEPTED_AUDIENCES: "test.knodia.org"
      CLIENT_ASSERTION_CLOCK_TOLERANCE_SECONDS: "30"
      CLIENT_ASSERTION_MAX_TOKEN_AGE_SECONDS: "300"
      DPOP_PROOF_HTU_BASE_URL: "https://test.knodia.org/token"
      DPOP_PROOF_MAX_TOKEN_AGE_SECONDS: "300"
      DYNAMODB_DPOP_PROOFS_TABLE: knodia-auth-server-dpop-proofs
      JWT_CLOCK_TOLERANCE_SECONDS: "30"
      READMODEL_DB_USER: local_lynx_authorization_server_user
      READMODEL_DB_PASSWORD: local_lynx_authorization_server_user
      READMODEL_DB_HOST: postgres
      READMODEL_DB_PORT: "5432"
      READMODEL_DB_NAME: lynx_readmodel
      READMODEL_DB_USE_SSL: "false"
      READMODEL_DB_ESERVICE_SCHEMA: local_lynx_eservice
      READMODEL_DB_AGREEMENT_SCHEMA: local_lynx_agreement
      READMODEL_DB_KEYCHAIN_SCHEMA: local_lynx_keychain
      READMODEL_DB_PURPOSE_SCHEMA: local_lynx_purpose
      AWS_REGION: eu-south-1
      AWS_ACCESS_KEY_ID: testawskey
      AWS_SECRET_ACCESS_KEY: testawssecret
      AWS_ENDPOINT_URL_KMS: http://local-kms:8080
      AWS_ENDPOINT_URL_DYNAMODB: http://dynamodb-local:8000
    depends_on:
      flyway-lynx:
        condition: service_completed_successfully
      local-kms-setup:
        condition: service_completed_successfully
      dynamodb-setup:
        condition: service_completed_successfully

  mock-eservice-lynx:
    security_opt:
      - no-new-privileges:true
    labels:
      knodia.check.on.startup: "true"
    container_name: knodia-multinode-mock-eservice-lynx
    mem_limit: 200m
    build:
      context: ..
      dockerfile: apps/services/mock-eservice/Dockerfile
    ports:
      - 9992:3000
    environment:
      NODE_OPTIONS: "--max-old-space-size=150"
      LOG_LEVEL: info
      HOST: "0.0.0.0"
      PORT: "3000"
      KNODE_ID: "Lynx"
      ACCEPTED_AUDIENCES: "mock.lynx.local.knodia.com"
      EXPECTED_ISSUER: "auth.lynx.local.knodia.com"
      WELL_KNOWN_URLS: "http://local-jwks:80/knodia/.well-known/jwks.json"
      DPOP_PROOF_HTU_BASE_URL: "https://test.knodia.org"
      DPOP_PROOF_MAX_TOKEN_AGE_SECONDS: "300"
      DYNAMODB_DPOP_PROOFS_TABLE: knodia-mock-eservice-dpop-proofs
      JWT_CLOCK_TOLERANCE_SECONDS: "30"
      SIGNAL_HUB_SEED_START_DATE_MS: "1767225600000"
      SIGNAL_HUB_SEED_EXPIRE_SECONDS: "30"
      SIGNAL_HUB_SEED_SALT_LENGTH: "16"
      SIGNAL_HUB_DB_HOST: postgres
      SIGNAL_HUB_DB_PORT: "5432"
      SIGNAL_HUB_DB_NAME: lynx_signal_hub
      SIGNAL_HUB_DB_SCHEMA: local_lynx_signal_hub
      SIGNAL_HUB_DB_USER: local_lynx_mock_eservice_user
      SIGNAL_HUB_DB_PASSWORD: local_lynx_mock_eservice_user
      SIGNAL_HUB_DB_USE_SSL: "false"
      AWS_REGION: eu-south-1
      AWS_ACCESS_KEY_ID: testawskey
      AWS_SECRET_ACCESS_KEY: testawssecret
      AWS_ENDPOINT_URL_DYNAMODB: http://dynamodb-local:8000
    depends_on:
      flyway-lynx:
        condition: service_completed_successfully
      local-kms-setup:
        condition: service_completed_successfully
      dynamodb-setup:
        condition: service_completed_successfully

  signal-hub-lynx:
    security_opt:
      - no-new-privileges:true
    labels:
      knodia.check.on.startup: "true"
    container_name: knodia-multinode-signal-hub-lynx
    mem_limit: 200m
    build:
      context: ..
      dockerfile: apps/services/signal-hub/Dockerfile
    ports:
      - 3802:3000
    environment:
      NODE_OPTIONS: "--max-old-space-size=150"
      LOG_LEVEL: info
      HOST: "0.0.0.0"
      PORT: "3000"
      ACCEPTED_AUDIENCES: "signalhub.test.knodia.org"
      WELL_KNOWN_URLS: "http://local-jwks:80/knodia/.well-known/jwks.json"
      READMODEL_DB_USER: local_lynx_signal_hub_user
      READMODEL_DB_PASSWORD: local_lynx_signal_hub_user
      READMODEL_DB_HOST: postgres
      READMODEL_DB_PORT: "5432"
      READMODEL_DB_NAME: lynx_readmodel
      READMODEL_DB_USE_SSL: "false"
      READMODEL_DB_AGREEMENT_SCHEMA: local_lynx_agreement
      READMODEL_DB_ESERVICE_SCHEMA: local_lynx_eservice
      READMODEL_DB_PURPOSE_SCHEMA: local_lynx_purpose
      SIGNAL_HUB_DB_USER: local_lynx_signal_hub_user
      SIGNAL_HUB_DB_PASSWORD: local_lynx_signal_hub_user
      SIGNAL_HUB_DB_HOST: postgres
      SIGNAL_HUB_DB_PORT: "5432"
      SIGNAL_HUB_DB_NAME: lynx_signal_hub
      SIGNAL_HUB_DB_USE_SSL: "false"
      SIGNAL_HUB_DB_SCHEMA: local_lynx_signal_hub

  signal-hub-cleaner-lynx:
    security_opt:
      - no-new-privileges:true
    container_name: knodia-multinode-signal-hub-cleaner-lynx
    build:
      context: ..
      dockerfile: apps/services/signal-hub-cleaner/Dockerfile
    environment:
      LOG_LEVEL: info
      SIGNAL_HUB_DB_USER: local_lynx_signal_hub_cleaner_user
      SIGNAL_HUB_DB_PASSWORD: local_lynx_signal_hub_cleaner_user
      SIGNAL_HUB_DB_HOST: postgres
      SIGNAL_HUB_DB_PORT: "5432"
      SIGNAL_HUB_DB_NAME: lynx_signal_hub
      SIGNAL_HUB_DB_USE_SSL: "false"
      SIGNAL_HUB_DB_SCHEMA: local_lynx_signal_hub
      SIGNALS_RETENTION_HOURS: "1"
    depends_on:
      flyway-lynx:
        condition: service_completed_successfully
    command:
      - sh
      - -c
      - "while true; do node src/index.ts || true; sleep ${SIGNAL_HUB_CLEANUP_INTERVAL_SECONDS:-3600}; done"
    restart: unless-stopped

  # ============================================================
  # Frontends
  # ============================================================

  frontend-orion:
    security_opt:
      - no-new-privileges:true
    labels:
      knodia.check.on.startup: "true"
    container_name: knodia-multinode-frontend-orion
    build:
      context: ..
      dockerfile: apps/web/frontend-orion/Dockerfile
    ports:
      - 5001:80
    volumes:
      - ./multinode/nginx-frontend.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./multinode/env-orion.js:/usr/share/nginx/html/ui/env.js:ro
    environment:
      BFF_UPSTREAM: "http://bff-orion:3000"
    depends_on:
      bff-orion:
        condition: service_started

  frontend-lynx:
    security_opt:
      - no-new-privileges:true
    labels:
      knodia.check.on.startup: "true"
    container_name: knodia-multinode-frontend-lynx
    build:
      context: ..
      dockerfile: apps/web/frontend-lynx/Dockerfile
    ports:
      - 5002:80
    volumes:
      - ./multinode/nginx-frontend.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./multinode/env-lynx.js:/usr/share/nginx/html/ui/env.js:ro
    environment:
      BFF_UPSTREAM: "http://bff-lynx:3000"
    depends_on:
      bff-lynx:
        condition: service_started

  # ============================================================
  # DynamoDB Local
  # ============================================================

  dynamodb-local:
    security_opt:
      - no-new-privileges:true
    image: amazon/dynamodb-local:3.3.0
    container_name: knodia-multinode-dynamodb-local
    ports:
      - 8085:8000
    command: -jar DynamoDBLocal.jar -inMemory -sharedDb
    healthcheck:
      test:
        ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8000 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  dynamodb-setup:
    security_opt:
      - no-new-privileges:true
    image: amazon/aws-cli:2.34.25
    container_name: knodia-multinode-dynamodb-setup
    depends_on:
      dynamodb-local:
        condition: service_healthy
    volumes:
      - ../scripts/dynamo:/dynamo-scripts:ro
      - ../dynamo-tables:/dynamo-tables:ro
    environment:
      AWS_ACCESS_KEY_ID: testawskey
      AWS_SECRET_ACCESS_KEY: testawssecret
      AWS_DEFAULT_REGION: eu-south-1
      DYNAMODB_CONNECTION_STRING: http://dynamodb-local:8000
      TABLES_DIR: /dynamo-tables
    entrypoint: ["/bin/bash", "/dynamo-scripts/setup-tables.sh"]

  # ============================================================
  # Local KMS & JWKS (authentication)
  # ============================================================

  local-kms:
    security_opt:
      - no-new-privileges:true
    labels:
      knodia.check.on.startup: "true"
    image: nsmithuk/local-kms:3.11.7@sha256:360d7377b6f3687c89a622236791e4fa3f7316366267b437829edbdfa8a5fc60
    container_name: knodia-multinode-local-kms
    ports:
      - 4566:8080
    environment:
      PORT: 8080
      KMS_REGION: eu-south-1
    volumes:
      - multinode-local-kms-data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8080"]
      interval: 5s
      timeout: 5s
      retries: 10

  local-kms-setup:
    security_opt:
      - no-new-privileges:true
    image: node:24-alpine@sha256:4f696fbf39f383c1e486030ba6b289a5d9af541642fc78ab197e584a113b9c03
    container_name: knodia-multinode-local-kms-setup
    depends_on:
      local-kms:
        condition: service_healthy
    volumes:
      - multinode-jwks-data:/jwks
      - ../scripts/local-auth:/app/scripts/local-auth:ro
      - ../node_modules:/app/node_modules:ro
    working_dir: /app
    environment:
      KMS_ENDPOINT: http://local-kms:8080
      JWKS_OUTPUT_DIR: /jwks
    command: node scripts/local-auth/kms-setup.mjs

  local-jwks:
    security_opt:
      - no-new-privileges:true
    labels:
      knodia.check.on.startup: "true"
    image: nginx:1.28-alpine@sha256:15e96e59aa3b0aada3a121296e3bce117721f42d88f5f64217ef4b18f458c6ab
    container_name: knodia-multinode-local-jwks
    ports:
      - 4500:80
    volumes:
      - multinode-jwks-data:/usr/share/nginx/html:ro

  local-cognito:
    security_opt:
      - no-new-privileges:true
    labels:
      knodia.check.on.startup: "true"
    image: node:24-alpine@sha256:4f696fbf39f383c1e486030ba6b289a5d9af541642fc78ab197e584a113b9c03
    container_name: knodia-multinode-local-cognito
    ports:
      - 4567:3000
    volumes:
      - ../scripts/local-auth:/app/scripts/local-auth:ro
    working_dir: /app
    environment:
      ISSUER: "http://localhost:4567"
      ALLOWED_ORIGINS: "http://localhost:5001,http://localhost:5002"
    command: node scripts/local-auth/local-cognito.mjs

volumes:
  multinode-postgres-data:
  multinode-kafka-data:
  multinode-minio-data:
  multinode-pgadmin-data:
  multinode-local-kms-data:
  multinode-jwks-data:
