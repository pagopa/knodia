name: knodia

services:
  event-store:
    security_opt:
      - no-new-privileges:true
    image: postgres:18
    container_name: knodia-event-store
    ports:
      - 6001:5432
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: root
    volumes:
      - event-store-data:/var/lib/postgresql

  readmodel:
    security_opt:
      - no-new-privileges:true
    image: postgres:18
    container_name: knodia-readmodel
    ports:
      - 6002:5432
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: root
    volumes:
      - readmodel-data:/var/lib/postgresql

volumes:
  event-store-data:
  readmodel-data:
