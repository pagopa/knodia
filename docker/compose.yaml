name: knodia

services:
  event-store:
    security_opt:
      - no-new-privileges:true
    image: postgres:17.7@sha256:2006493727bd5277eece187319af1ef82b4cf82cf4fc1ed00da0775b646ac2a4
    container_name: knodia-event-store
    ports:
      - 6001:5432
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: root
    command: -c 'max_connections=512' -c 'wal_level=logical'
    volumes:
      - event-store-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root"]
      interval: 5s
      timeout: 5s
      retries: 5

  readmodel:
    security_opt:
      - no-new-privileges:true
    image: postgres:17.7@sha256:2006493727bd5277eece187319af1ef82b4cf82cf4fc1ed00da0775b646ac2a4
    container_name: knodia-readmodel
    ports:
      - 6002:5432
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: root
    volumes:
      - readmodel-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root"]
      interval: 5s
      timeout: 5s
      retries: 5

  flyway-roles-event-store:
    security_opt:
      - no-new-privileges:true
    image: flyway/flyway:11@sha256:782c5c207ffb5ac6336139fda4f4295bd9991ef63ad36919406d4268740069bb
    container_name: knodia-flyway-roles-event-store
    command: migrate
    volumes:
      - ../migration/local/event_store_roles.sql:/flyway/sql/R__event_store_roles.sql:ro
    environment:
      FLYWAY_URL: jdbc:postgresql://event-store:5432/root
      FLYWAY_USER: root
      FLYWAY_PASSWORD: root
      FLYWAY_CONNECT_RETRIES: "5"
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_SCHEMAS: public
      FLYWAY_DEFAULT_SCHEMA: public
      FLYWAY_PLACEHOLDERS_NAMESPACE: local
    depends_on:
      event-store:
        condition: service_healthy

  flyway-roles-readmodel:
    security_opt:
      - no-new-privileges:true
    image: flyway/flyway:11@sha256:782c5c207ffb5ac6336139fda4f4295bd9991ef63ad36919406d4268740069bb
    container_name: knodia-flyway-roles-readmodel
    command: migrate
    volumes:
      - ../migration/local/read_model_roles.sql:/flyway/sql/R__read_model_roles.sql:ro
    environment:
      FLYWAY_URL: jdbc:postgresql://readmodel:5432/root
      FLYWAY_USER: root
      FLYWAY_PASSWORD: root
      FLYWAY_CONNECT_RETRIES: "5"
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_SCHEMAS: public
      FLYWAY_DEFAULT_SCHEMA: public
      FLYWAY_PLACEHOLDERS_NAMESPACE: local
    depends_on:
      readmodel:
        condition: service_healthy

  flyway-event-store:
    security_opt:
      - no-new-privileges:true
    image: flyway/flyway:11@sha256:782c5c207ffb5ac6336139fda4f4295bd9991ef63ad36919406d4268740069bb
    container_name: knodia-flyway-event-store
    entrypoint: ["/bin/sh", "/flyway/scripts/migrate-all-schemas.sh"]
    volumes:
      - ../migration/event-store:/flyway/schemas:ro
      - ../scripts/flyway:/flyway/scripts:ro
    environment:
      FLYWAY_URL: jdbc:postgresql://event-store:5432/root
      FLYWAY_USER: root
      FLYWAY_PASSWORD: root
      FLYWAY_CONNECT_RETRIES: "5"
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_PLACEHOLDERS_NAMESPACE: local
    depends_on:
      flyway-roles-event-store:
        condition: service_completed_successfully

  flyway-readmodel:
    security_opt:
      - no-new-privileges:true
    image: flyway/flyway:11@sha256:782c5c207ffb5ac6336139fda4f4295bd9991ef63ad36919406d4268740069bb
    container_name: knodia-flyway-readmodel
    entrypoint: ["/bin/sh", "/flyway/scripts/migrate-all-schemas.sh"]
    volumes:
      - ../migration/read-model:/flyway/schemas:ro
      - ../scripts/flyway:/flyway/scripts:ro
    environment:
      FLYWAY_URL: jdbc:postgresql://readmodel:5432/root
      FLYWAY_USER: root
      FLYWAY_PASSWORD: root
      FLYWAY_CONNECT_RETRIES: "5"
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_PLACEHOLDERS_NAMESPACE: local
    depends_on:
      flyway-roles-readmodel:
        condition: service_completed_successfully

  kafka:
    security_opt:
      - no-new-privileges:true
    image: confluentinc/cp-kafka:7.6.9@sha256:652f4017a6389f22930eb27ad02ce730622ebe145efa442625d7f439f1bc111e
    container_name: knodia-kafka
    ports:
      - 9092:9092
      - 29092:29092
    environment:
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_NODE_ID: "1"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      CLUSTER_ID: "KYKz4GOqSZurqXVpzOsgNA"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_NUM_PARTITIONS: "3"
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-lc",
          "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30

  debezium-connect:
    security_opt:
      - no-new-privileges:true
    image: quay.io/debezium/connect:3.4.1.Final@sha256:3a6e0a30d37d560371a1d39fb788068b29d3dc47c38394b0ffea5bbe4c6f8e1d
    container_name: knodia-debezium-connect
    ports:
      - 8083:8083
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: knodia-debezium
      CONFIG_STORAGE_TOPIC: knodia-debezium-configs
      OFFSET_STORAGE_TOPIC: knodia-debezium-offsets
      STATUS_STORAGE_TOPIC: knodia-debezium-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_PLUGIN_PATH: /kafka/connect
      CONNECT_TOPIC_CREATION_ENABLE: "true"
      CONNECT_TOPIC_CREATION_DEFAULT_REPLICATION_FACTOR: 1
      CONNECT_TOPIC_CREATION_DEFAULT_PARTITIONS: 10
    depends_on:
      kafka:
        condition: service_healthy
      event-store:
        condition: service_started

  kafka-ui:
    security_opt:
      - no-new-privileges:true
    container_name: knodia-kafka-ui
    image: kafbat/kafka-ui:v1.4.2@sha256:8dd62c9b18a01b732824cae91c6fe5203fac8e931448a2a639bd20270b8fed2b
    ports:
      - 8084:8080
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  # MinIO is a local S3-compatible storage, to replace AWS S3 in local development
  minio:
    security_opt:
      - no-new-privileges:true
    container_name: knodia-minio
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    entrypoint: >
      /usr/bin/minio server /data --console-address ':9001'
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      MINIO_ROOT_USER: testawskey # AWS S3 access key ID used for local development
      MINIO_ROOT_PASSWORD: testawssecret # AWS S3 secret access key used for local development
      MINIO_SITE_REGION: eu-south-1
      MINIO_DOMAIN: localhost
    volumes:
      - ./minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-setup:
    security_opt:
      - no-new-privileges:true
    container_name: knodia-minio-setup
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 testawskey testawssecret;
      mc mb --ignore-existing local/knodia-eservice-interfaces;
      exit 0;
      "
  # Web GUI for PostgreSQL
  pgadmin:
    security_opt:
      - no-new-privileges:true
    container_name: knodia-pgadmin
    image: dpage/pgadmin4:9@sha256:10137f33be7ed61e47f56004493710cb5b80ba7fb0ca01758855e242f1f284a7
    ports:
      - 5050:80
    environment:
      PGADMIN_DEFAULT_EMAIL: root@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin-servers.json:/pgadmin4/servers.json:ro
      - ./pgpass:/pgadmin4/pgpass:ro
    depends_on:
      - event-store
      - readmodel

  # Mock AWS KMS for local development (no seed file — keys created via API)
  local-kms:
    security_opt:
      - no-new-privileges:true
    image: nsmithuk/local-kms:3.11.7
    container_name: knodia-local-kms
    ports:
      - 4566:8080
    environment:
      PORT: 8080
      KMS_REGION: eu-south-1
    volumes:
      - local-kms-data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8080"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates KMS keys and writes JWKS files to shared volume
  local-kms-setup:
    security_opt:
      - no-new-privileges:true
    image: node:24-alpine
    container_name: knodia-local-kms-setup
    depends_on:
      local-kms:
        condition: service_healthy
    volumes:
      - jwks-data:/jwks
      - ../scripts/local-kms:/app/scripts/local-kms:ro
      - ../node_modules:/app/node_modules:ro
    working_dir: /app
    environment:
      KMS_ENDPOINT: http://local-kms:8080
      JWKS_OUTPUT_DIR: /jwks
    command: node scripts/local-kms/kms-setup.mjs

  # Serves JWKS endpoints for local token validation
  # - http://localhost:4500/cognito/.well-known/jwks.json
  # - http://localhost:4500/knodia/.well-known/jwks.json
  local-jwks:
    security_opt:
      - no-new-privileges:true
    image: nginx:1.28-alpine@sha256:15e96e59aa3b0aada3a121296e3bce117721f42d88f5f64217ef4b18f458c6ab
    container_name: knodia-local-jwks
    ports:
      - 4500:80
    volumes:
      - jwks-data:/usr/share/nginx/html:ro

volumes:
  event-store-data:
  readmodel-data:
  kafka-data:
  minio-data:
  pgadmin-data:
  local-kms-data:
  jwks-data:
