name: knodia

services:
  postgres:
    security_opt:
      - no-new-privileges:true
    image: postgres:17.7@sha256:2006493727bd5277eece187319af1ef82b4cf82cf4fc1ed00da0775b646ac2a4
    container_name: knodia-postgres
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: root
    command: -c 'max_connections=512' -c 'wal_level=logical'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root"]
      interval: 5s
      timeout: 5s
      retries: 5

  flyway:
    security_opt:
      - no-new-privileges:true
    image: flyway/flyway:11@sha256:782c5c207ffb5ac6336139fda4f4295bd9991ef63ad36919406d4268740069bb
    container_name: knodia-flyway
    entrypoint: ["/bin/sh", "/flyway/scripts/migrate-all-databases.sh"]
    volumes:
      - ../migration/event-store:/flyway/databases/event_store:ro
      - ../migration/read-model:/flyway/databases/readmodel:ro
      - ../migration/remote-resource:/flyway/databases/remote_resource:ro
      - ../migration/signal-hub:/flyway/databases/signal_hub:ro
      - ../migration/signup:/flyway/databases/signup:ro
      - ../scripts/flyway:/flyway/scripts:ro
    environment:
      FLYWAY_USER: root
      FLYWAY_PASSWORD: root
      FLYWAY_CONNECT_RETRIES: "5"
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_PLACEHOLDERS_NAMESPACE: local
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    security_opt:
      - no-new-privileges:true
    image: amazon/aws-cli:2.34.25
    container_name: knodia-seed
    depends_on:
      flyway:
        condition: service_completed_successfully
      minio-setup:
        condition: service_completed_successfully
    volumes:
      - ../scripts/seed:/seed:ro
      - ../apps/services/mock-eservice/openapi/openapi-bearer.yaml:/apps/services/mock-eservice/openapi/openapi-bearer.yaml:ro
      - ../apps/services/mock-eservice/openapi/openapi-dpop.yaml:/apps/services/mock-eservice/openapi/openapi-dpop.yaml:ro
      - ../apps/services/mock-eservice/openapi/openapi-bearer-signal-hub.yaml:/apps/services/mock-eservice/openapi/openapi-bearer-signal-hub.yaml:ro
      - ../apps/services/mock-eservice/openapi/openapi-bearer-poc-uc02-companies.yaml:/apps/services/mock-eservice/openapi/openapi-bearer-poc-uc02-companies.yaml:ro
      - ../apps/services/mock-eservice/openapi/openapi-bearer-poc-uc01-qualifications.yaml:/apps/services/mock-eservice/openapi/openapi-bearer-poc-uc01-qualifications.yaml:ro
      - ../apps/services/mock-eservice/openapi/openapi-bearer-receive-data.yaml:/apps/services/mock-eservice/openapi/openapi-bearer-receive-data.yaml:ro
    environment:
      PGHOST: postgres
      PGUSER: root
      PGPASSWORD: root
      PGDATABASE: readmodel
      NAMESPACE: local
      ENVIRONMENT: local
      SQL_DIR: /seed/sql/orion
      S3_BUCKET: knodia-eservice-interfaces
      S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: testawskey
      AWS_SECRET_ACCESS_KEY: testawssecret
      AWS_REGION: eu-south-1
    entrypoint:
      - /bin/sh
      - -e
      - -c
      - |
        dnf install -qy postgresql15 >/dev/null
        /seed/seed.sh

  kafka:
    security_opt:
      - no-new-privileges:true
    image: confluentinc/cp-kafka:8.1.1
    container_name: knodia-kafka
    ports:
      - 9092:9092
      - 29092:29092
    environment:
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_NODE_ID: "1"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      CLUSTER_ID: "KYKz4GOqSZurqXVpzOsgNA"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_NUM_PARTITIONS: "3"
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-lc",
          "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30

  kafka-setup:
    security_opt:
      - no-new-privileges:true
    image: confluentinc/cp-kafka:8.1.1
    container_name: knodia-kafka-setup
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./kafka-topics:/kafka-topics:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        while IFS=: read -r topic partitions; do
          kafka-topics --bootstrap-server kafka:9092 \
            --create --if-not-exists \
            --topic "$$topic" \
            --partitions "$$partitions" \
            --replication-factor 1
        done < /kafka-topics
        echo 'All topics created'

  debezium-connect:
    security_opt:
      - no-new-privileges:true
    image: quay.io/debezium/connect:3.4.1.Final
    container_name: knodia-debezium-connect
    ports:
      - 8083:8083
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: knodia-debezium
      CONFIG_STORAGE_TOPIC: knodia-debezium-configs
      OFFSET_STORAGE_TOPIC: knodia-debezium-offsets
      STATUS_STORAGE_TOPIC: knodia-debezium-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_PLUGIN_PATH: /kafka/connect
      CONNECT_TOPIC_CREATION_ENABLE: "true"
      CONNECT_TOPIC_CREATION_DEFAULT_REPLICATION_FACTOR: 1
      CONNECT_TOPIC_CREATION_DEFAULT_PARTITIONS: 10
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/connectors || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  debezium-setup:
    security_opt:
      - no-new-privileges:true
    container_name: knodia-debezium-setup
    image: curlimages/curl:8.12.1@sha256:94e9e444bcba979c2ea12e27ae39bee4cd10bc7041a472c4727a558e213744e6
    depends_on:
      debezium-connect:
        condition: service_healthy
    volumes:
      - ./event-store-connector.json:/connector.json:ro
    entrypoint: >
      /bin/sh -c "
      response=$$(curl -s -o /dev/null -w '%{http_code}' -X POST
      -H 'Accept:application/json'
      -H 'Content-Type:application/json'
      -d @/connector.json
      http://debezium-connect:8083/connectors);
      if [ \"$$response\" -eq 201 ]; then echo 'Connector registered'; exit 0; fi;
      if [ \"$$response\" -eq 409 ]; then echo 'Connector already exists'; exit 0; fi;
      echo \"Failed to register connector: HTTP $$response\"; exit 1;
      "

  kafka-ui:
    security_opt:
      - no-new-privileges:true
    container_name: knodia-kafka-ui
    image: kafbat/kafka-ui:v1.4.2@sha256:8dd62c9b18a01b732824cae91c6fe5203fac8e931448a2a639bd20270b8fed2b
    ports:
      - 8084:8080
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  # MinIO is a local S3-compatible storage, to replace AWS S3 in local development
  minio:
    security_opt:
      - no-new-privileges:true
    container_name: knodia-minio
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    entrypoint: >
      /usr/bin/minio server /data --console-address ':9001'
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      MINIO_ROOT_USER: testawskey # AWS S3 access key ID used for local development
      MINIO_ROOT_PASSWORD: testawssecret # AWS S3 secret access key used for local development
      MINIO_SITE_REGION: eu-south-1
      MINIO_DOMAIN: localhost
    volumes:
      - ./minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-setup:
    security_opt:
      - no-new-privileges:true
    container_name: knodia-minio-setup
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 testawskey testawssecret;
      mc mb --ignore-existing local/knodia-eservice-interfaces;
      mc mb --with-lock --ignore-existing local/knodia-signup-archives;
      mc retention set --default GOVERNANCE 1d local/knodia-signup-archives;
      "
  # Web GUI for PostgreSQL
  pgadmin:
    security_opt:
      - no-new-privileges:true
    container_name: knodia-pgadmin
    image: dpage/pgadmin4:9@sha256:10137f33be7ed61e47f56004493710cb5b80ba7fb0ca01758855e242f1f284a7
    ports:
      - 5050:80
    environment:
      PGADMIN_DEFAULT_EMAIL: root@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin-servers.json:/pgadmin4/servers.json:ro
      - ./pgpass:/pgadmin4/pgpass:ro
    depends_on:
      - postgres

  # Mock AWS KMS for local development (no seed file — keys created via API)
  local-kms:
    security_opt:
      - no-new-privileges:true
    image: nsmithuk/local-kms:3.11.7@sha256:360d7377b6f3687c89a622236791e4fa3f7316366267b437829edbdfa8a5fc60
    container_name: knodia-local-kms
    ports:
      - 4566:8080
    environment:
      PORT: 8080
      KMS_REGION: eu-south-1
    volumes:
      - local-kms-data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8080"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates KMS keys and writes JWKS files to shared volume
  local-kms-setup:
    security_opt:
      - no-new-privileges:true
    image: node:24-alpine@sha256:4f696fbf39f383c1e486030ba6b289a5d9af541642fc78ab197e584a113b9c03
    container_name: knodia-local-kms-setup
    depends_on:
      local-kms:
        condition: service_healthy
    volumes:
      - jwks-data:/jwks
      - ../scripts/local-auth:/app/scripts/local-auth:ro
      - ../node_modules:/app/node_modules:ro
    working_dir: /app
    environment:
      KMS_ENDPOINT: http://local-kms:8080
      JWKS_OUTPUT_DIR: /jwks
    command: node scripts/local-auth/kms-setup.mjs

  # Serves JWKS endpoints for local token validation
  # - http://localhost:4500/knodia/.well-known/jwks.json
  local-jwks:
    security_opt:
      - no-new-privileges:true
    image: nginx:1.28-alpine@sha256:15e96e59aa3b0aada3a121296e3bce117721f42d88f5f64217ef4b18f458c6ab
    container_name: knodia-local-jwks
    ports:
      - 4500:80
    volumes:
      - jwks-data:/usr/share/nginx/html:ro

  dynamodb-local:
    security_opt:
      - no-new-privileges:true
    image: amazon/dynamodb-local:3.3.0
    container_name: knodia-dynamodb-local
    ports:
      - 8085:8000
    command: -jar DynamoDBLocal.jar -inMemory -sharedDb
    healthcheck:
      test:
        ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8000 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  dynamodb-setup:
    security_opt:
      - no-new-privileges:true
    image: amazon/aws-cli:2.34.25
    container_name: knodia-dynamodb-setup
    depends_on:
      dynamodb-local:
        condition: service_healthy
    volumes:
      - ../scripts/dynamo:/dynamo-scripts:ro
      - ../dynamo-tables:/dynamo-tables:ro
    environment:
      AWS_ACCESS_KEY_ID: testawskey
      AWS_SECRET_ACCESS_KEY: testawssecret
      AWS_DEFAULT_REGION: eu-south-1
      DYNAMODB_CONNECTION_STRING: http://dynamodb-local:8000
      TABLES_DIR: /dynamo-tables
    entrypoint: ["/bin/bash", "/dynamo-scripts/setup-tables.sh"]

  local-cognito:
    security_opt:
      - no-new-privileges:true
    image: node:24-alpine@sha256:4f696fbf39f383c1e486030ba6b289a5d9af541642fc78ab197e584a113b9c03
    container_name: knodia-local-cognito
    ports:
      - 4567:3000
    volumes:
      - ../scripts/local-auth:/app/scripts/local-auth:ro
    working_dir: /app
    command: node scripts/local-auth/local-cognito.mjs

  local-one-identity:
    security_opt:
      - no-new-privileges:true
    image: node:24-alpine@sha256:4f696fbf39f383c1e486030ba6b289a5d9af541642fc78ab197e584a113b9c03
    container_name: knodia-local-one-identity
    ports:
      - 4568:3000
    volumes:
      - ../scripts/local-auth:/app/scripts/local-auth:ro
    working_dir: /app
    environment:
      ISSUER: "http://localhost:4568"
      ALLOWED_ORIGINS: "http://localhost:5176,http://localhost:5176"
      CLIENT_ID: local-oi-client-id
      CLIENT_SECRET: local-oi-client-secret
      REDIRECT_URI: "http://localhost:5176/login/callback"
    command: node scripts/local-auth/local-one-identity.mjs

volumes:
  postgres-data:
  kafka-data:
  minio-data:
  pgadmin-data:
  local-kms-data:
  jwks-data:
