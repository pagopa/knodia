version: v2

# Define workspace modules
modules:
  - path: packages/models/keychain-models/proto
    name: buf.build/knodia/keychain-models

  - path: packages/models/purpose-models/proto
    name: buf.build/knodia/purpose-models

lint:
  use:
    - STANDARD
  except:
    - PACKAGE_DIRECTORY_MATCH
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
    - FIELD_LOWER_SNAKE_CASE
    - FILE_LOWER_SNAKE_CASE
